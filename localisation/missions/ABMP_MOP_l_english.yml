l_english:
 mop_win_civil_war_title: "Crush the Boieri"
 mop_win_civil_war_desc: "$TODO$"
 no_coring_penalty_in_perma_claim_provinces: "The insane core creation cost penalty will be §Gnegated§! in provinces we have a §Ypermanent claim§! on until the end of the game."
 mop_cossack_relations_title: "Courting the Steppe"
 mop_cossack_relations_desc: "$TODO$"
 improved_relations_with_zaz_tt: "@ZAZ §Y[ZAZ.GetName]§! has an §YImproved Relations§! value of §G+100§! with us."
 if_we_allied_with_zaz_tt: "If we allied with @ZAZ §Y[ZAZ.GetName]§!:"
 if_we_improved_relations_with_zaz_tt: "If we improved relations with @ZAZ §Y[ZAZ.GetName]§!:"
 if_zaz_no_longer_exists_and_we_conquered_zaz_tt: "If @ZAZ §Y[ZAZ.GetName]§! no longer exists and we conquered their starting provinces:"
 mop_deepen_cossack_ties_title: "Deepen Cossack Ties"
 mop_deepen_cossack_ties_desc: "The steppe is a dangerous borderland, and neither the Sfatul Tarii nor the Zaporizhian Host can stand alone. Surrounded by boyar princedoms and the hungry gaze of the Horde, we must bind ourselves to the Cossacks through shared trust and purpose. They will guard the frontier, and we will see that their supply lines never run dry."
 zaz_will_be_released_again_lmao_tt: "@ZAZ §Y[ZAZ.GetName]§! will be released."
 so_as_long_as_zaz_remains_our_subject_tt: "§gThis modifier will be active as long as @ZAZ §Y[ZAZ.GetName]§! or @HTM §Y[HTM.GetName]§! are our subjects.§!"
 mop_expand_the_host_anti_confusion_trigger_tt: "§gNote that @ZAZ §Y[ZAZ.GetName]§! needs to own these provinces, §RNOT YOU§!.§!"
 mop_western_ukraine_title: "Unleash the Host"
 mop_western_ukraine_desc: "In the lands of Ruthenia, our merchants are stripped and hanged from the gates, our pilgrims robbed, our envoys mocked as serfs who forgot their place. The boyars preach that Moldavians are no better than beasts, fit only for the lash. Every caravan that crosses their borders is bled dry by tolls and extortion.\n\nWe have pleaded for peace and received only corpses in return. So be it. Zaporizhia shall have free rein to pacify the western marches. Let the boyars learn the price of their hatred."
 mop_enclave_in_kiev_tt: "We will take control of §Y[280.GetName]§! and the surrounding area and establish a commune."
 mop_secure_crimea_title: "Secure the Black Sea"
 mop_secure_crimea_desc: "The Golden Horde still festers upon the steppe, raiding our frontiers and chaining free men for the slave markets of Azov. So long as they endure, neither the communes nor the Host will know peace. We must strike south, shatter the Horde’s hold on the coast, and seize their port before another generation is sold into bondage."
 azov_commune_tt: "We will take control of §Y[286.GetName]§! and the surrounding area and establish a commune."
 abolitionists_ban_black_sea_slave_tt: "The Abolitionists will see to it that the Black Sea slave trade is abolished. As a result, §YSlaves§! will no longer be produced in §Y[286.GetName]§!."
 mop_develop_kiev_title: "Kiev the Great"
 mop_develop_kiev_desc: "Kyiv must become the beating heart of our northern trade and the surest sign of our good order in Ruthenia. Expand its streets and storehouses, strengthen its councils, and endow the Kyievo-Pecherska Lavra so that faith and craft flourish side by side."
 mop_march_to_sarai_title: "March to Sarai"
 mop_march_to_sarai_desc: "The Horde’s capital has long been the beating heart of raids and slave markets that torment our lands. With Azov secured and the Host at our side, we can cut the head from the beast."
 astrakhan_commune_tt: "We will take control of §Y[464.GetName]§! and the surrounding area and establish a commune."
 mop_east_ukraine_title: "Seize the Left Bank"
 mop_east_ukraine_desc: "The western marches are quieted; now the Host must ride across the Dnieper. Sloboda Ukraine, the Left Bank, and Chernihiv are the keystone of Ruthenia’s heartland. With our backing and their banners, Zaporizhia will break the boyar cordon, bind the frontier to our trade, and carry Moldavian law to the far bank."
 conssack_conquest_cb_enabled_tt: "@HTM §Y[HTM.GetName]§! will unlock the §YCossack Conquest§! casus belli, which allows them to attack neighboring countries in the regions of the §YPontic Steppe§!, the §YUrals§!, §YCentral Asia§!, §YWest Siberia§!, §YEast Siberia§!, §YMongolia§!, and §YManchuria§!.\n§GWe can use this casus belli against their neighbors on their behalf§!."
 mop_proclaim_the_hetmanate_title: "Rise of the Hetmanate"
 mop_proclaim_the_hetmanate_desc: "From a band of free riders on the Lower Dnieper to the stewards of Ruthenia and the tamers of the southern steppes — our Cossack brothers have risen beside us in triumph. Together we shattered the Golden Horde’s yoke, humbled the proud Ruthenian princes, and turned the wild frontier into a bastion of liberty and discipline. Now, as we proclaim the Hetmanate, the Host stands as a sovereign arm of our League — a living testament to the power of common men who would not bow."
 cossack_protectorate_tt: "§gA §YCossack Protectorate§! is a very loyal subject that can fight its own wars. Although it doesn't give you any vassal income, it gives you plenty of §Ymanpower§!, §Yforce limit§!, and §Yunique bonuses§! to your military depending on how much total development it has.§!"
 mop_wallachia_title: "[mop_wallachia_title_loc]"
 mop_wallachia_desc: "[mop_wallachia_desc_loc]"
 if_bogdan_razesul_is_ruling_tt: "If §VBogdan Razesul§! is ruling §Y[Root.GetName]§!:"
 if_bogdan_razesul_isnt_ruling_tt: "If §VBogdan Razesul§! isn't ruling §Y[Root.GetName]§!:"
 if_the_butcher_has_already_purged_the_ten_houses_tt: "If the Butcher of Tirgoviste has already purged the Ten Houses of Wallachia:"
 if_the_butcher_hasnt_already_purged_the_ten_houses_tt: "If the Butcher of Tirgoviste hasn't already purged the Ten Houses of Wallachia:"
 if_bulgaria_is_our_rival_tt: "If @BUL [BUL.GetName] is our rival, we will gain:"
 mop_liberate_dobruja_title: "Liberate Dobruja"
 mop_liberate_dobruja_desc: "For nearly a millennium, the Bulgar yoke has weighed upon our people. Their recent war against the Romans has left them overextended, their armies drained. An opportunity to settle old scores and secure our future now presents itself. We must strike across the Danube and liberate our kin in Dobruja."
 mop_liberate_transylvania_title: "Liberate Transylvania"
 mop_liberate_transylvania_desc: "For centuries, the Vlachs have been the subject of heathens, but this ends now. We must liberate our kin in Transylvania from the oppressive yoke of the Magyar invaders before they regain their strength and seek to conquer [Root.GetName] once more."
 mop_vlach_emancipation_title: "Emancipation of the Vlachs"
 mop_vlach_emancipation_desc: "Wallachia, Transylvania, Dobruja, and Moldavia now stand free of the yoke of the boieri. From the Carpathians to the Black Sea, the fields belong to those who till them, and Sfatul Tarii speaks for all our kin. Let the world know the peasants of Dacia are one people: we bind our communes into a single cause and raise a new banner over the mountains and the Danube."
 tuc_unlock_new_renames_tt: "Unlock new country names to rename yourself to in the §YRename Our Country§! event. The first rename is free."
 unlock_dacian_commune_reform_tt: "We will replace the §YMoldavian Commune§! Tier 1 government reform with the more powerful §YDacian Commune§! reform"
 ruler_has_protector_of_the_little_folk_personality_tt: "If our ruler has the §YProtector of the Little Folk§! personality trait:"
 ruler_doesnt_have_protector_of_the_little_folk_personality_tt: "If our ruler doesn't have the §YProtector of the Little Folk§! personality trait:"
 mop_arm_the_bulgar_peasants_title: "Arm the Bulgar Peasants"
 mop_arm_the_bulgar_peasants_desc: "Our whispers have turned to oaths, and oaths now need steel. The Bulgarian villages have risen in secret, hammering ploughshares into pikes and hiding powder beneath their granaries. Our agents cross the Danube under night, smuggling coin and arms through the monasteries and wine caravans. Let them take what they need from the boyars’ own purses—those riches will soon return to the people one way or another."
 mop_no_tutorial_mission_target_tt: "Use the §YSupport Rebels§! covert action to support §YPeasant Rebels§! on a country that meets two conditions:\n1. Owns §YBulgarian§! provinces in the §YBalkans§!.\n2. Owns at least one province §Yanywhere§! with the §YRadicalized Peasants§! modifier.\n\n§gIf the target lacks the modifier, use the §YIncite Peasants§! covert action to apply it.§!\n\n§gTip: Use the Trade Mapmode to see which province have the modifier. Look for this icon: £radicalized_peasantry£§!"
 is_supporting_peasant_rebels_against_target_tt: "We are supporting §YPEASANT§! rebels against §Y[mop_peasant_subject_tutorial_mission_target.GetName]§!"
 mop_robbed_target_tt: "§gOur agents intercept supply caravans and extort local magnates loyal to the oppressor, seizing §Y100¤§! to arm the Bulgarian communes.§!"
 get_ready_to_invade_with_peasants_tt: "§gMonitor the rebel progress in the §YDiplomacy§! window.\n\nThe §YGreat Peasant Uprising§! Casus Belli unlocks when §YPeasant Rebels§! reach a specific progress threshold. Higher §YRebel Support Efficiency§! lowers this threshold.\n\nFormula:\n§O100% - (Rebel Support Efficiency / 10)§!\n\nBased on your current efficiency, the Casus Belli against the target will unlock at:\n§Y[This.required_progress_for_early_great_peasant_uprising_cb.GetValue]% Progress§!\n\n§RWARNING: If the rebels rise up and are destroyed before you declare war, you must find a new target or wait 10 years to restart the process with the current target!§!§!"
 mop_war_for_the_bulgars_title: "War for the Bulgars"
 mop_war_for_the_bulgars_desc: "The spark has caught; the Bulgar villages now stand on the edge of open revolt. Our agents have armed them, our whispers have turned to war cries, and the boyars now beg for mercy."
 some_of_the_bulgars_join_our_ranks_tt: "§gSome of the Bulgarian peasants join our ranks!§!"
 mop_liberate_the_bulgars_title: "Liberate the Bulgars"
 mop_liberate_the_bulgars_desc: "We have armed the villages and marched beneath the banner of revolt; now we must see the work finished. The Bulgar peasants have cast down their lords with our aid, and look to us as guarantors of their freedom."
 mop_liberate_the_bulgars_subject_trigger_tt: "@[mop_peasant_subject_tutorial_mission_target.GetTag] §Y[mop_peasant_subject_tutorial_mission_target.GetName]§! is either:\n£allied_commune£ An §YAllied Commune§! subject of ours.\n£sister_commune£ A §YSister Commune§! subject of ours.\n£integrated_commune£ An §YIntegrated Commune§! subject of ours."
 mop_liberate_the_bulgars_BUL_core_on_all_bulgarian_provinces_tt: "@BUL §Y[BUL.GetName]§! will gain a core on all §YBulgarian§! provinces in the §YBalkans§!"
 mop_crush_the_magyars_title: "Crush the Magyars"
 mop_crush_the_magyars_desc: "The Magyar yoke has oppressed our people for centuries. Though we have driven them from Transylvania, the serpent's head remains. So long as they hold the Pannonian Plain, they will plot their vengeance. We must crush them utterly before they can strike again."
 mop_carpathian_fortifications_title: "The Gates of Carpathia"
 mop_carpathian_fortifications_desc: "Our brethren in Transylvania are free, but the Magyar threat remains. The Carpathian Mountains, our ancestral shield, must be forged into an unbreakable wall. By fortifying the crucial mountain passes, we will transform them into gates of steel, locking the region against any invader. Transylvania will become an impenetrable bastion, a graveyard for any army foolish enough to test its strength."
 mop_seal_the_carpathians_title: "Seal the Carpathians"
 mop_seal_the_carpathians_desc: "With the Magyars shattered, our dominion over the Pannonian Basin is nearly complete. A new vulnerability has been exposed, however, along the western mountain passes. The German princes and the Polish crown watch our ascent with avarice. Our nation's security cannot be guaranteed while these gateways remain in foreign hands. We must seize the lands of Transdanubia, Slovakia, and Moravia to establish an unbreachable frontier, turning the Carpathians into the impenetrable spine of our kingdom."
 mop_carpathia_cultural_hegemon_title: "An Exemplary Society"
 mop_carpathia_cultural_hegemon_desc: "The Carpathian Basin still bears the marks of the old Magyar clans: scattered settlements, tribal strongholds, and lands left fallow by the swords of wayward lords. If we are to prove the strength of our communal order, then we must do more than conquer it. We must transform it.\n\nEvery valley must be raised to the standard of our heartland, every town strengthened and enriched, every people brought into the Romanian cultural fold. The plains must bustle with trade and craft, the passes must shine with fortified communes, and Pest must be rebuilt as the crowning proof of our achievement—a city to rival Paris or Prague."
 mop_recover_from_civil_war_title: "Recover From the Civil War"
 mop_recover_from_civil_war_desc: "Our victory has saved the land, but Moldavia still bleeds. Villages lie in ash, fields bear the scars of marching hosts, and the people mourn sons and fathers lost in the struggle. To restore the strength of the communes, we must bring stability back to the realm, clear the devastation from our heartlands, and raise a church in [Root.Capital.GetCapitalName] to honor the fallen. Only when the wounds of the civil war are tended will Moldavia stand whole once more."
 mop_rebuild_wallachia_title: "Rebuild Wallachia"
 mop_rebuild_wallachia_desc: "The fires of conquest and the Butcher’s cruelty left Wallachia battered, fearful, and unsure of our intent. Its towns were scarred, its fields plundered, and its people caught between tyrants and uprisings. Now that the dust has settled, it falls to us to prove that we did not cross the Olt as ravagers, but as liberators.\n\nWe must cleanse the last traces of devastation, restore the markets of Tirgoviste, repair the roads and guildhalls, and raise every Wallachian commune to prosperity. Only by rebuilding what was broken, brick by brick, can we show the Wallachian people that the peasant republic seeks not dominion, but the flourishing of all Vlachs beneath a just and common banner."
 control_of_trade_to_black_sea_desc: "We Control the Flow of Trade Into the Black Sea"
 mop_the_gates_of_the_danube_title: "Gates of the Danube"
 mop_the_gates_of_the_danube_desc: "With Basarabia and Dobruja in our hands, we stand astride the lower Danube. If we raise proper docks, shipyards, markets, and forts at Kilia and along the coast, we can turn these river mouths into true gates—counting every hull that passes and taxing every bale of grain and timber bound for the Black Sea. Let the merchants grumble; they will still come, for there is no cheaper road to the sea than the river we now command."
 mop_mare_dacia_title: "Mare Dacia"
 mop_mare_dacia_desc: "The Vlach lands are united under a single banner. The work of conquest is done; the work of construction begins. We must now forge these disparate regions into a single, thriving, and interconnected heartland. Every road paved, every workshop built, and every field developed strengthens the whole. This is the vision of Mare Dacia: a powerful and prosperous nation, the solid foundation upon which all our future ambitions will be built."
 mop_the_black_sea_gate_title: "The Black Sea Gate"
 mop_the_black_sea_gate_desc: "With Crimea secured and the mouths of the Danube under our watch, only one opening remains for the trade of the northern steppes into the Black Sea: Azov. If we are to master this sea, we must raise Azov into a true gate—fortified, well-provisioned, and busy with docks, shipyards, and markets. Let every caravan and river barge that seeks the Black Sea first pass beneath our guns and pay its due."
 mop_the_caspian_gate_title: "The Caspian Gate"
 mop_the_caspian_gate_desc: "Beyond the lower Volga lies Astrakhan, the key by which the riches of the steppe and the East pour into the Caspian. Having marched to Sarai and secured our hold on the Black Sea, we must now do the same here: strengthen Astrakhan’s walls, expand its quays, and turn it into a bustling mart where all trade between the steppe and the southern seas can be watched and weighed. When both Azov and Astrakhan stand as our gates, few routes will remain that do not pass through our hands."
 mop_bulgars_are_free_title: "The Bulgars Are Free"
 mop_bulgars_are_free_desc: "Across the valleys and mountains of the Balkans, the Bulgarian peasantry has long laboured under crowns not their own. By bringing every Bulgarian village in the region under the protection of our federation—either as direct communes or as allied communes, we can finally say that the Bulgars are no longer subjects of kings, but comrades of the Communes."
 mop_control_all_bulgarian_balkan_provinces_tt: "All the provinces of §YBulgarian§! culture in the §YBalkans§! are owned by us or a £allied_commune£§YCommune Subject§!."
 bulgarian_integrated_commune_bonus_tt: "£integrated_commune£§YIntegrated Commune§!£integrated_commune£ subjects of §YBulgarian§! culture will grant us §G-5.0%§! Shock Damage Received if they have over §Y300§! total development."
 mop_control_all_thrace_provinces_tt: "All provinces in the §YThrace§! area are either controlled by us, a £allied_commune£§YCommune Subject§!, or a non-sovereign subject of our £allied_commune£§YCommune Subject§!."
 mop_liberate_thrace_title: "Liberate Thrace"
 mop_liberate_thrace_desc: "The plains and coasts of Thrace have long been trampled by imperial armies and ruled from the gilded halls of [151.GetName]. If our revolution is to endure, the straits and the city at their heart must no longer answer to emperors or stratocrats, but to the communes themselves. By bringing every village and town in Thrace under the protection of our federation, we will free the peasants of the region and seize the City of the World’s Desire for the common cause."
 mop_liberate_the_serbs_title: "Liberate the Serbs"
 mop_liberate_the_serbs_desc: "From the Drina to the Morava, the Serbian peasantry toils beneath crowns and warlords who claim their labor and their land. Our allies among the Bulgars now stand free; the time has come to carry the banner of liberation westward. By breaking the chains of the Serbian villagers and bringing their communes into our federation, we will forge a solid wall of free peasants across the central Balkans and deny the monarchs a base from which to threaten our revolution."
 mop_conquer_ragusa_title: "Seize Dubrovnik"
 mop_conquer_ragusa_desc: "The proud port of Dubrovnik stands as an oligarchic enclave on the Adriatic, ruled by merchant families who grow rich off the toil of Balkan peasants and the trade that passes through our lands. As long as this patrician republic endures, Venice and the Italian princes will have a friendly harbor from which to threaten our communes. By taking Dubrovnik into our hands and reorganizing it under communal principles, we will secure a vital Adriatic outpost, safeguard the trade of the Balkans, and open a forward base for future operations against the tyrants across the sea."
 mop_liberate_the_serbs_tt: "All provinces of §YSerbian§! culture in the §YBalkans§! are either controlled by us, a £allied_commune£§YCommune Subject§!, or a non-sovereign subject of our £allied_commune£§YCommune Subject§!."
 if_we_have_completed_naval_ideas_tt: "If we have completed §YNaval Ideas§!:"
 mop_liberate_the_greeks_title: "Liberate the Greeks"
 mop_liberate_the_greeks_desc: "The fall of the imperial city was only the first step. From the hills of Hellas to the harbors of the Aegean, Greek peasants, sailors, and craftsmen still bend the knee to princes, stratocrats, and merchant elites who claim the legacy of empires long dead. If our victory in Thrace is to mean anything, we must carry the revolution southward and across the islands, breaking the last chains that bind the Greek people."
 mop_liberate_the_greeks_tt: "All provinces of §YGreek§! culture in the §YBalkans§! or §YAegean Archipelago§! are either controlled by us, a £allied_commune£§YCommune Subject§!, or a non-sovereign subject of our £allied_commune£§YCommune Subject§!."
 mop_great_port_of_dubrovnik_title: "The Great Port of Dubrovnik"
 mop_great_port_of_dubrovnik_desc: "We have seized Dubrovnik from its patrician masters, but for now it remains only a promising harbor on the Adriatic. If this city is to become the spearhead of our maritime ambitions, we must pour our strength into its docks, shipyards, walls, and markets. By expanding its infrastructure, strengthening its fortifications, and restoring the Walls of Ston, we can transform Dubrovnik into the foremost commune-port of the Adriatic: an arsenal, marketplace, and bastion from which to defy the oligarchs of Venice and the princes beyond the sea."
 if_albania_is_an_allied_commune_tt: "If @ALB §Y[ALB.GetName]§! is our £allied_commune£§YAllied Commune§! subject:"
 albania_integrated_commune_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YAlbanian§! culture will grant us §G+1§! Land Leader Shock if they have more than §Y150§! total development."
 mop_protect_the_albanians_title: "Protect the Albanians"
 mop_protect_the_albanians_desc: "Between the mountains and the sea, the Albanian villages stand exposed to the ambitions of kings, beys, and merchants alike. Though small in number, their highland communes and coastal towns sit astride the routes between Greece, Illyria, and Italy. If we secure Albania under our protection, whether directly or through loyal communes, we will not only shield its peasants from conquest, but also close another door through which our enemies might strike at the Balkans."
 mop_liberate_illyria_title: "Liberate Illyria"
 mop_liberate_illyria_desc: "From the valleys of Bosnia to the coasts of Dalmatia and the rivers of Croatia and Slavonia, the lands once called Illyria form the western wall of the Balkans. For centuries, kings, bans, and foreign republics have carved these provinces into marches and borderlands, treating their peasants as little more than fodder for their wars. Now that Dubrovnik stands as a commune-port of our federation, we are in a position to sweep inland and bind these scattered peoples into a belt of free communes."
 serbian_integrated_commune_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YSerbian§! culture will grant us §G-5.0%§! Aggressive Expansion Impact if they have more than §Y250§! total development."
 unlock_ILR_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @ILR §YThe Illyrian Communes§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YSouth Slavic§! culture. Once @ILR §YThe Illyrian Communes§! is established, you will be able to transfer §YSouth Slavic§! provinces from your other £integrated_commune£§YIntegrated Communes§! to @ILR §YThe Illyrian Communes§!."
 croatian_integrated_commune_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YCroatian§! culture will grant us §G-10.0%§! Cavalry Cost if they have more than §Y250§! total development."
 bosnian_integrated_commune_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YBosnian§! culture will grant us §G+5.0%§! Artillery Combat Ability if they have more than §Y200§! total development."
 mop_liberate_the_balkans_title: "Liberate the Balkans"
 mop_liberate_the_balkans_desc: "From the Carpathians to the Adriatic, the peoples of the Balkans have long suffered under feudal oppression, foreign dynasties and the whims of distant courts. Our communes have shattered the old order in our own lands; now we must finish the work we began and tear down every last tyrant from the Danube to the Aegean. Only when every village, town and city in the Balkans stands free will our struggle be complete."
 mop_dismantle_the_stratocracy_title: "Dismantle the Stratocracy"
 mop_dismantle_the_stratocracy_desc: "Across the Bosphorus lies the militarized state of Nicaea, a fortress-kingdom ruled by a hardened caste of officers who command through discipline and fear. Their citadels dominate the Asian shore of the strait, their galleys guard its currents, and their generals dream of restoring the old order by force. If we are to secure the Bosphorus and ensure that its waters serve the communes rather than a warlord elite, the stratocracy must be broken."
 mop_gates_of_the_bosprous_title: "Gates of the Bosporus"
 mop_gates_of_the_bosprous_desc: "We have torn down the stratocracy on the Asian shore and brought Chalcedon into the fold, but to truly command the Bosporus we must do more than merely hold its banks. Stanboli and Chalcedon must be remade into twin gates of stone and timber: deep harbors for our fleets, fortified batteries to command the currents, and great communal customs houses to tally every cargo that dares pass between the Black Sea and the Mediterranean.\n\nOnce the docks are expanded, the markets organized and the fortifications raised on both sides of the strait, the Bosporus will cease to be a vulnerability and become the beating heart of our trade empire. Let merchants and princes alike learn that passage through these waters is granted only by the will of the communes."
 control_of_the_bosporus_desc: "We control the Bosporus."
 unlock_HLE_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @HLE §YThe Hellenic Communes§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YGreek§! culture. Once @HLE §YThe Hellenic Communes§! is established, you will be able to transfer §YGreek§! provinces from your other £integrated_commune£§YIntegrated Communes§! to @HLE §YThe Hellenic Communes§!."
 greek_integrated_commune_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YGreek§! culture will grant us §G-10.0%§! Great Project Upgrade Cost if they have more than §Y300§! total development."
 mop_free_anatolia_title: "Free Anatolia"
 mop_free_anatolia_desc: "Anatolia remains divided between beyliks, emirs, and ancient rivalries. To secure lasting stability, we must end the rule of tyrants throughout the peninsula and place its many peoples under the protection of the communes. When Anatolia is fully liberated, its councils can finally stand beside ours as partners in a shared future."
 unlock_RUM_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @RUM §YThe Turk Communes§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YTurkish§! culture. Once @RUM §YThe Turk Communes§! is established, you will be able to transfer §YTurkish§! provinces from your other £integrated_commune£§YIntegrated Communes§! to @RUM §YThe Turk Communes§!."
 unlock_ARM_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @ARM §YThe Armenian Communes§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YArmenian§! culture. Once @ARM §YThe Armenian Communes§! is established, you will be able to transfer §YArmenian§! provinces from your other £integrated_commune£§YIntegrated Communes§! to @ARM §YThe Armenian Communes§!."
 integrated_commune_turkish_orthodox_bonus_tt: "§YOrthodox§! £integrated_commune£§YIntegrated Commune§! subjects of §YTurkish§! culture will grant us §G+1.00§! Tolerance of the True Faith if they have more than §Y300§! total development."
 integrated_commune_turkish_muslim_bonus_tt: "§YMuslim§! £integrated_commune£§YIntegrated Commune§! subjects of §YTurkish§! culture will grant us §G+1.00§! Tolerance of Heathens if they have more than §Y300§! total development."
 integrated_commune_armenian_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YArmenian§! culture will grant us §G+1.00§! Tolerance of Heretics if they have more than §Y200§! total development."
 mop_free_the_lechites_title: "Free the Lechites"
 mop_free_the_lechites_desc: "From Kraków to the Vistula and the Oder, the Lechitic lands are broken into petty princedoms: Polan kings, Silesian dukes, Vistulan warlords, Mazovian and Lendian princes, all ruling over the same weary peasants in the name of rival gods. If our commune is to bring true freedom to these peoples, we must sweep aside their princelings and bind every Lechitic land into a federation of councils."
 unlock_PLC_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @PLC §YThe Commonwealth§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YArmenian§! culture. Once @PLC §YThe Commonwealth§! is established, you will be able to transfer §YPolan§!, §YSilesian§!, §YVistulan§!, §YLendian§!, §YMazovian§!, and §YPolish§! provinces from your other £integrated_commune£§YIntegrated Communes§! to @PLC §YThe Commonwealth§!."
 integrated_commune_polish_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YPolan§!, §YSilesian§!, §YVistulan§!, §YLendian§!, §YMazovian§!, or §YPolish§! culture will grant us §G+5.0%§! Cavalry Combat Ability if they have more than §Y300§! total development."
 mop_destroy_the_princes_title: "Destroy the Princes"
 mop_destroy_the_princes_desc: "The lands of Rus' groan under a patchwork of petty crowns and self-styled grand princes, each clinging to his throne while the peasantry bleeds. If our revolution is to be secure, the princely order itself must be swept away. By seizing Moscova and ensuring that no East Slavic monarchy in Europe remains outside our commune system, we will prove that crowns and dynasties can be broken, but the will of the people endures."
 no_east_slavic_monarchies_europe_tt: "There are no §YEast Slavic§! monarchies in §YEurope§!, unless they are subjects of £allied_commune£§YCommune Subject§!."
 every_east_slavic_commune_subject_ld_tt: "Every £allied_commune£§YCommune Subject§! of §YEast Slavic§! culture will lose §G-20.0%§! Liberty Desire."
 mop_fortify_moscow_title: "Fortify Moscova"
 mop_fortify_moscow_desc: "Having torn down the princes’ rule in Moscova, we must now ensure that no new tyrant can so easily seize it again. By expanding the Kremlin, lining the city with new redoubts and barracks, and turning Moscova into a vast armoury and depot for the communes’ armies, we will forge a bulwark that can weather any storm from steppe or West alike."
 mop_grand_captain_bonus_tt: "§YGrand Captain§! advisors now grant §G-5.0%§! to Reinforce Cost per skill level."
 mop_saltworks_of_cracovia_title: "Saltworks of Cracovia"
 mop_saltworks_of_cracovia_desc: "We need a strong economy to support our armies. Krakow sits on valuable salt deposits. By developing the city and its infrastructure, we can turn these mines into the republic's primary treasury."
 mop_completed_great_cracovia_mission_tt: "Completed Mission §YSaltworks of Cracovia§!."
 unlock_krakow_salt_mine_bonus_tt: "We will §Gunlock§! the Production Efficiency bonus for the §YWieliczka Salt Mine§!"
 enable_establish_consulate_po_tt: "Unlock the ability to create §YConsulate§! subjects.\n\n§g§YConsulates§! are unique subjects that provide yearly £allmana£ §GTribute§! and §G+5.0%§! Trade Steering instead of tax.\n\nStrategically, they act as forward operating bases. They spread §YRadicalized Peasantry§! to neighbors, allowing you to establish £integrated_commune£§YCommune Subjects§! in distant regions.\n\n§YHow to establish a Consulate:§!\n1. Target a country on a §Ydifferent continent§! with §Y125§! or less Total Development.\n2. Declare war using §YANY§! Trade Casus Belli (e.g., §YTrade Conflict§!, §YTrade Dispute§!, or §YTrade League Dispute§!).\n3. Select the §YEstablish Consulate§! peace offer.§!"
 mop_urals_title: "Secure the Urals"
 mop_urals_desc: "The open steppe is a highway for reactionaries and raiders. To permanently secure the revolution in the East, we must push our frontier to the natural barrier of the Ural Mountains. We will break the last remnants of the Khanates and transform the city of Kazan from a seat of Khans into a fortress of the people."
 mop_urals_trigger_tt: "Every province in the §YUral§! region is owned by us, our £allied_commune£§YCommune Subject§!, a non-sovereign subject of our £allied_commune£§YCommune Subject§!, or our @HTM §YCossack Protectorate§!."
 mop_unlock_krepost_system_tt: "Every province owned by us or a subject with a §Yfortification building§!, and all built in the future by us or a subject in the following regions:\n- §YPontic Steppe§!\n- §YUral§!\n- §YCentral Asia§!\n- §YWest Siberia§!\n- §YEast Siberia§!\n- §YMongolia§!\n- §YManchuria§!\n- §YAlania Area§!\n- §YCumania Area§!\nwill receive:"
 integrated_commune_tartar_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YTartar§! culture will grant us §G+5.0%§! Shock Damage if they have more than §Y250§! total development."
 mop_kazan_title: "The Eastern Bastion"
 mop_kazan_desc: "Cazan is the keystone of our domination over the steppes. To maintain our grip on the vast frontier, we must transform the city into a self-sufficient military metropolis. The Kremlin must be expanded, the population drilled, and the infrastructure built to sustain a massive army thousands of miles from the capital."
 mop_russia_title: "Sloboda"
 mop_russia_desc: "The concept of the 'Sloboda' (the free settlement) must be expanded from a frontier curiosity into a national reality. We must drive out the last of the Boyars and Oligarchs from the Russian heartland and transform the entire region into a single, vast union of free communities."
 mop_russia_trigger_tt: "Every province in the §YRussia§! region is owned by us, our £allied_commune£§YCommune Subject§!, a non-sovereign subject of our £allied_commune£§YCommune Subject§!, or our @HTM §YCossack Protectorate§!."
 unlock_UKR_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @UKR §YSloboda Rus§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YEast Slavic§! culture. Once @UKR §YSloboda Rus§! is established, you will be able to transfer §YEast Slavic§! or §YUgric§! provinces from your other £integrated_commune£§YIntegrated Communes§! to @UKR §YSloboda Rus§!."
 integrated_commune_east_slavic_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YEast Slavic§! culture will grant us §G-10.0%§! Infantry Cost if they have more than §Y400§! total development."
 mop_arhanghel_title: "Gateway to the White Sea"
 mop_arhanghel_desc: "The Baltic is a lake of enemies, strangled by tolls and blockades. To free our trade, we must kick open the back door to the Atlantic. Arhanghel must be expanded from a frozen outpost into a world-class harbor, capable of hosting the merchant fleets of the Dutch and English regardless of the winter freeze."
 mop_arctic_provinces_dock_bonus_tt: "Constructing §YDock§! or §YDrydock§! buildings in §Yarctic§! provinces §Gnegates§! all the penalties of the arctic climate. This also applies to our subjects."
 mop_baltic_title: "Secure the Baltic"
 mop_baltic_desc: "The Baltic shores are rich in amber and strategic harbors, yet they remain divided between ancient tribes and foreign crusaders. We must drive out the German orders, seize the key ports of Danzig and Riga, and unite the region into a single, cohesive federation of free communes."
 unlock_BLT_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @BLT §YThe Baltic Communes§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YBaltic§! culture. Once @BLT §YThe Baltic Communes§! is established, you will be able to transfer §YBaltic§! provinces from your other £integrated_commune£§YIntegrated Communes§! to @BLT §YThe Baltic Communes§!."
 integrated_commune_baltic_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YBaltic§! culture will grant us §G+1.00§! Max General Shock if they have more than §Y200§! total development."
 mop_baltic_ports_title: "Dominion of the Baltic"
 mop_baltic_ports_desc: "The twin cities of the Baltic must serve the dual pillars of our Republic: Wealth and Faith. Gdansc shall be forged into an unsinkable fortress of trade, funneling the grain of the Vistula to the world. Riga, the former seat of the Crusades, must be purged of its Latin heresy and consecrated as the spiritual capital of the North."
 control_danzig_and_riga_desc: "Controls the key Baltic ports of Gdansc and Riga."
 mop_central_asia_title: "Taming the Silk Road"
 mop_central_asia_desc: "The fabled cities of the Silk Road—Samarkand, Khiva, Bukhara—are the beating heart of Asian commerce. Yet, they are ruled by petty Khans and tribal warlords. The Hetmanate must ride south to break their power. We will seize the key nodes of the Silk Road and redirect its wealth exclusively towards the Republic."
 mop_central_asia_trigger_tt: "Every province in the §YCentral Asia§! region is owned by us, our £allied_commune£§YCommune Subject§!, a non-sovereign subject of our £allied_commune£§YCommune Subject§!, or our @HTM §YCossack Protectorate§!."
 change_bessarabia_to_silk_tt: "§gMaster weavers from Khiva have been relocated to our heartland to revolutionize our textile industry.§!\n§Y[1756.GetName]§! will now produce §YSilk§!."
 mop_silk_road_infrastructure_title: "The Silk Road Portage"
 mop_silk_road_infrastructure_desc: "The old river route to the Caspian is long dead, but the Republic's ingenuity will build a new one. We must construct a fortified overland highway from the Aral Sea to the Caspian coast, bridging the gap with stone, steel, and logistical precision. Khiva, once an isolated oasis, will become the beating heart of this new trade artery."
 mop_push_into_siberia_title: "Push Beyond the Urals"
 mop_push_into_siberia_desc: "The Grey Horde dominates the southern steppes, blocking the path to the Silk Road, but the vast taiga of the north lies empty and waiting. We must cross the mountains and establish a permanent foothold in the West Siberian basin. The new settlement of Tiumen shall serve as the logistic hub for our pioneers."
 mop_push_into_siberia_tt: "Every province in the §YWest Siberia§! region is owned by us, our £allied_commune£§YCommune Subject§!, a non-sovereign subject of our £allied_commune£§YCommune Subject§!, or our @HTM §YCossack Protectorate§!."
 if_sloboda_rus_is_subject_tt: "If @UKR §YSloboda Rus§! is our £allied_commune£§YCommune Subject§!:"
 mop_mongolia_title: "Pacify the Mongols"
 mop_mongolia_desc: "The Eurasian steppe offers no natural borders, only an endless highway for potential invaders. To stop now is to leave our eastern flank exposed. The frontier must be pushed east until there is nothing left to conquer."
 mop_mongolia_trigger_tt: "Every province in the §YMongolia§! region is owned by us, our £allied_commune£§YCommune Subject§!, a non-sovereign subject of our £allied_commune£§YCommune Subject§!, or our @HTM §YCossack Protectorate§!."
 integrated_commune_mongolian_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of the §YMonoglian§! culture group will grant us §G-5.0%§! Province Warscore Cost if they have more than §Y300§! total development."
 mop_qaraqorum_title: "Caracorum Garrison"
 mop_qaraqorum_desc: "To hold the vastness of Mongolia, we cannot rely on distant armies marching from the Danube. The defense of the East must be local, permanent, and self-sufficient. \n\nWe must station a massive force of cavalry in Caracorum and grant them rights to the surrounding pasturelands. By transforming these soldiers into permanent settler-guardians, we ensure that the Republic's grip on the steppe will never be broken."
 ab_has_dismantled_china_tt: "We have dismantled the §YEmpire of China§!."
 mop_north_china_trigger_tt: "Every province in the §YNorth China§! region is owned by us, our £allied_commune£§YCommune Subject§!, a non-sovereign subject of our £allied_commune£§YCommune Subject§!, or our @HTM §YCossack Protectorate§!."
 mop_north_china_title: "Breach the Great Wall"
 mop_north_china_desc: "The Emperors built a serpent of stone to bar the north, believing they could wall out the future. But walls of earth cannot withstand the march of the righteous. We shall pierce the fortifications and descend upon the Yellow River plain. We must seize Pechin and Sian, throwing open the gates of the Forbidden City and establishing our foothold in the heart of the Middle Kingdom."
 unlock_PCC_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish the @PCC §YPeople's Communes of China§! in an £integrated_commune£§YIntegrated Commune§! that has §YChinese§! culture or is located in the §YChina Subcontinent§!.\n\nOnce established, you can transfer provinces of §YChinese§! culture or within the §YChina Subcontinent§! from your other subjects to them."
 integrated_commune_chinese_bonus_tt: "£integrated_commune£§YIntegrated Commune§!£integrated_commune£ subjects of §YChinese§! culture will grant us §G+5.0%§! Governing Capacity Modifier if they have over §Y500§! total development, and another §G+5.0%§! Governing Capacity Modifier for every §Y500§! total development, up to a total of §G+20.0%§! at §Y2000§! total development."
 mop_manchuria_title: "The Pacific Frontier"
 mop_manchuria_desc: "We have crossed the Volga, the Urals, and the endless steppe. Now, only the forests of the Jurchen tribes stand between us and the end of the world. We must push through to the coast and wash our boots in the Great Eastern Ocean. Only when our flag flies over the Pacific will the Revolution be secure."
 mop_manchuria_trigger_tt: "Every province in the §YManchuria§! region is owned by us, our £allied_commune£§YCommune Subject§!, a non-sovereign subject of our £allied_commune£§YCommune Subject§!, or our @HTM §YCossack Protectorate§!."
 unlock_WEE_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @WEE §YThe Wendish Communes§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YWendish§!, §YPomeranian§!, or §YSorbian§! culture. Once @WEE §YThe Wendish Communes§! is established, you will be able to transfer §YWendish§!, §YPomeranian§!, and §YSorbian§! provinces from your other £integrated_commune£§YIntegrated Communes§! to @WEE §YThe Wendish Communes§!."
 integrated_commune_wendish_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YWendish§!, §YPomeranian§!, or §YSorbian§! culture will grant us §G-10.0%§! Fort Maintenance if they have more than §Y300§! total development."
 mop_free_the_wends_title: "The Race for the Elbe"
 mop_free_the_wends_desc: "The German princes look East with hungry eyes. We know their ambition: the Drive to the East. If we hesitate, the Holy Roman Emperor will extend his protection over these lands, and the Wends will be swallowed by feudalism. We must strike first. We will secure the lands between the Oder and the Elbe, turning the Wendish tribes into a permanent shield against the Empire."
 mop_fortify_berlin_title: "Fortify Berlin"
 mop_fortify_berlin_desc: "Berlin stands on the precipice. Beyond the Elbe, the Holy Roman Emperor marshals his forces, waiting for a moment of weakness. We must turn this city into an impregnable fortress. From the Brandenburg Gate to the banks of the Spree, every street shall be a rampart and every citizen a defender. Let the Imperial armies break their teeth on our walls."
 every_owned_wendish_province_with_fort_tt: "Every owned or subject-held province in the §YWendia§! region with a fort §Gupgrades its fort§! and gains the following modifier:"
 mop_finnic_title: "Liberate Kalevala"
 mop_finnic_desc: "The Suomi and Sami peoples have long toiled under the yoke of foreign masters, their lands treated as mere resource colonies for Stockholm or Novgorod. It is time to sever these chains. We must sweep through Finland, Lapland, and the Bothnian coast, expelling the bailiffs and uniting the deep forests into a single, free commune."
 unlock_SLU_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @SLU §YThe Kalevalan Communes§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YFinnic§! culture. Once @SLU §YThe Kalevalan Communes§! is established, you will be able to transfer §YFinnic§! provinces from your other £integrated_commune£§YIntegrated Communes§! to @SLU §YThe Kalevalan Communes§!."
 integrated_commune_finnic_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YFinnic§! culture will grant us §G+1.00%§! Attrition For Enemies and §G+1.00%§! Max Hostile Attrition if they have more than §Y300§! total development."
 forest_dev_20_percent_extra_dev_tt: "There is now a §G20%§! chance of gaining §G1§! extra point of development when developing §YForest§! provinces."
 mop_scandinavia_title: "Shatter the North"
 mop_scandinavia_desc: "The frozen lands beyond the Baltic are home to two threats that our Republic can no longer ignore. To the west, the Norse cling to the barbarism of the old world, their longships raiding our coasts and strangling the trade that feeds our people. To the east, the Swedish crusaders preach a Latin holy war against us, seeking to shackle our free peasantry to the Pope and the feudal lash. We must strike north and dismantle these kingdoms one by one."
 unlock_NSE_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @NSE §YThe Nordic Communes§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YNordic§! culture. Once @NSE §YThe Nordic Communes§! is established, you will be able to transfer §YNordic§! provinces from your other £integrated_commune£§YIntegrated Communes§! to @NSE §YThe Nordic Communes§!."
 mop_scandinavia_communes_effect_tt: "We will §Gestablish communes§! in §YReykjavik§!, §YBergenhus§!, §YKobenhavn§!, §YGotland§!, and §YAland§!."
 integrated_commune_scandinavian_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YScandinavian§! culture will allow us to §Graid coastlines§! and §Grecruit explorers and conquistadors§! if they have more than §Y450§! total development."
 sound_toll_trigger_tt: "Every province in the §Y[12.GetAreaName]§! area, as well as the province of §Y[6.GetName]§!:\n- is owned by us, our £allied_commune£§YCommune Subject§!, or a non-sovereign subject of our £allied_commune£§YCommune Subject§!\n- has at least §Y10§! Development\n- has a §YCoastal Defense§! or a §YNaval Battery§! building."
 until_kiel_canal_is_constructed_desc: "until the §YKiel Canal§! is constructed"
 unlock_can_use_propagate_religion_tt: "We can now use the §YPropagate Religion§! trading policy."
 mop_baltic_sea_title: "The Baltic Gate"
 mop_baltic_sea_desc: "We have fortified the strategic triangle of the North. Copenhaga seals the gate, Gotlanda marshals the trade, and Alandia watches the horizon. The Baltic is no longer a sea; it is a federal lake. By enforcing the Sound Dues and militarizing these islands, we ensure that no ship sails these waters without the express permission of the Peasant Republic."
 mop_north_sea_title: "The Northern Horizon"
 mop_north_sea_desc: "The liberation of Scandinavia opened the door to the Atlantic. Standing upon the docks of Berghenhus and Reichiavic, we face the vast gray abyss of the ocean. We must expand these harbors into the ultimate launchpads for our journey west, ensuring our ships sail to find new worlds from the strongest foundations on earth."
 mop_vladivostoc_title: "Pacific Infrastructure"
 mop_vladivostoc_desc: "Vladivostoc now stands as the marble pillar of the Orient. We have transformed this frozen harbor into a titan of industry and war. From these drydocks, a new fleet rises to claim the sunrise, ensuring the Pacific Ocean serves the Federation."
 mop_great_vladivostoc_commune: "The Great Vladivostoc Commune"
 desc_mop_great_vladivostoc_commune: "The shipyards here burn day and night. We churn out heavy ships at a pace the monarchs of Asia cannot comprehend, securing our dominance over the eastern waves."
 mop_the_pacific_fleet: "The Pacific Fleet"
 desc_mop_the_pacific_fleet: "The vast distance from the capital demands autonomy. We have commissioned a second command structure, authorizing additional flagships to lead our eastern armada independently of the home fleet."
 mop_discounted_continue_the_liberation_tt: "The §YContinue the Liberation§! interaction will now cost §G40.00§! §YPeasant Zeal§! instead of §Y50.00§!"
 unlock_KOR_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish the @KOR §YDemocratic People's Communes§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YKorean§! culture. Once the @KOR §YDemocratic People's Communes§! is established, you will be able to transfer §YKorean§! provinces from your other £integrated_commune£§YIntegrated Communes§! to the @KOR §YDemocratic People's Communes§!."
 integrated_commune_korean_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YKorean§! culture will grant us §G-10.0%§! Institution Cost if they have more than §Y300§! total development."
 mop_korea_title: "The Hermit Kingdom"
 mop_korea_desc: "The Joseon Dynasty hides behind a veil of isolation, preserving a rigid hierarchy that chokes the common people. We will tear down these walls and flood the peninsula with revolutionary fervor. By establishing a stronghold in Pyongyang and dismantling the power of the Yangban aristocracy, we shall wake the Land of the Morning Calm to a brilliant, liberated dawn."
 mop_enhanced_peasant_expansion_tt: "The §YContinue the Liberation§! interaction will now grant the following §Genhanced§! modifier:"
 mop_pyongyang_title: "The Phenian School"
 mop_pyongyang_desc: "Most within the Federation view the intense zealotry of Phenian with unease, yet the Abolitionists argue that our revolution has grown complacent. They insist we must look to the East for strength. To prove the validity of this radical path, the faction leadership demands we pour the state's treasury into the city's development. We shall artificially construct a golden age in Phenian, using its manufactured prosperity as irrefutable evidence that their total devotion is the only path forward."
 mop_discounted_cultivate_the_land_tt: "The §YCultivate the Land§! interaction will now cost §G40.00§! §YPeasant Zeal§! instead of §Y50.00§!"
 mop_japan_title: "Topple the Shogunate"
 mop_japan_desc: "The Shogun rules through the terror of the sword, binding the peasantry in chains of feudal obligation. We must reignite the dormant spirit of the Ikko-Ikki and sweep across these islands. Seize Chioto, strip the Samurai of their status, and dismantle the imperial hierarchy. We must prove that the will of the collective is sharper than any Katana."
 integrated_commune_japanese_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of the §YJapanese§! culture group will grant us §G+2.5%§! Discipline if they have more than §Y450§! total development."
 unlock_JAP_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @JAP §YIkko Japan§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YJapanese§! culture. Once @JAP §YIkko Japan§! is established, you will be able to transfer §YJapanese§! provinces from your other £integrated_commune£§YIntegrated Communes§! to @JAP §YIkko Japan§!."
 mop_enhanced_cultivate_the_land_tt: "The §YCultivate the Land§! interaction will now grant the following §Genhanced§! modifier:"
 mop_kyoto_title: "The Pure Land"
 mop_kyoto_desc: "For generations, the fires of the Sengoku era consumed Japan, fueled by the endless ambition of the warlords. The Ikko monks preached of a 'Pure Land'—a paradise achievable in this life through communal faith and peace. Our Exemplarists have taken this doctrine to heart. By rebuilding Chioto as a monument to tranquility rather than power, we declare the era of the sword finished. We shall turn our backs on the chaos of the world to cultivate a paradise within our own borders."
 enable_palace_of_the_east_tt: "We will be able to renovate §YThe Forbidden Palace§!"
 mop_discounted_rally_the_communes_tt: "The §YRally the Communes§! interaction will now cost §G40.00§! §YPeasant Zeal§! instead of §Y50.00§!"
 mop_enhanced_rally_the_communes_tt: "The §YRally the Communes§! interaction will now grant us §G7.5%§! of our subjects manpower instead of §Y5%§!, and the following §Genhanced§! modifier:"
 mop_develop_north_china_title: "The Celestial Bureaucracy"
 mop_develop_north_china_desc: "The sheer scale of the Chinese administration is breathtaking. Our Leaguist faction studies the Forbidden City and sees the ultimate administrative engine hiding behind the imperial facade. We must repair the canals and fill the halls with our own clerks, repurposing the machinery of the Dragon Throne to serve the common man. By adopting the structure of the Civil Service, we ensure the Federation functions with the intricate efficiency of the Celestial Empire."
 mop_south_china_title: "Sweep the South"
 mop_south_china_desc: "The merchant princes of the Yangtze and the Pearl River hoard wealth that belongs to the collective. We must march past the riverlands, shatter the grip of the local gentry, and secure the great ports of the coast. By seizing Hanciu and Canton, we ensure the immense bounty of the Orient serves the Federation."
 mop_center_of_trade_upgrade_bonus_tt: "Upgrading a §YCenter of Trade§! will grant §G+1§! base production to the province. This works for our subjects as well."
 mop_south_china_trigger_tt: "All populated provinces in the §YSouth China§! region are owned by us, our £allied_commune£§YCommune Subject§!, or a non-sovereign subject of our £allied_commune£§YCommune Subject§!."
 mop_develop_south_china_title: "The Southern Engine"
 mop_develop_south_china_desc: "Hanciu anchors the Grand Canal, feeding the North, while Canton throws open the gates to the maritime world. We must dredge the waterways and expand the shipyards, transforming these cities into the dual pistons of our economy. By perfecting this infrastructure, we bind the immense productivity of the Yangtze and the Pearl River directly to the Federation, ensuring our global crusade never lacks for silver or grain."
 mop_xinan_title: "Seize the Land of Abundance"
 mop_xinan_desc: "The Sichuan Basin is a fortress of nature, shielding the most fertile soil on earth. While our armies march across the continent, the issue of supply becomes paramount. We cannot allow the Tusi warlords to hoard the harvest of the 'Tianfu'—the Heavenly Province. We must pierce the mountain passes, dismantle the feudal chieftainships, and secure the ancient irrigation systems. By seizing this granary, we ensure that no citizen of the Federation ever knows the bite of hunger again."
 commune_subject_rice_bonus_tt: "Every £allied_commune£§YCommune Subject§! and all future subjects will receive:"
 mop_develop_xinan_title: "The Garden of the West"
 mop_develop_xinan_desc: "The Sichuan Basin is a natural fortress, shielded by cloud piercing mountains and fed by the eternal waters of the Min River. While our coastal communes drive the economy, they remain vulnerable to the fleets of our enemies. We must transform Chengdu into an unassailable sanctuary for the Revolution. By expanding the ancient Dujiangyan engineering works and fortifying the mountain passes, we create a self sufficient paradise deep in the interior, a guarantee that the Federation can endure any calamity."
 unlocked_dujiangyan_bonus_tt: "We have unlocked this bonus through a mission."
 enable_dujiangyan_bonus_tt: "The great project §YDujiangyan§! will now grant §G-5.0%§! Development Cost Modifier globally at §Ytier 3§!."
 mop_slay_the_dragon_title: "Slay the Dragon"
 mop_slay_the_dragon_desc: "For five thousand years, the dynastic cycle has chained the peasantry to a life of unending servitude. One tyrant falls only for another to claim the Mandate, wrapping their oppression in a cloak of celestial authority. We have come to break the wheel. We shall shatter the Jade Seal and tear down the Throne and the meek shall finally inherit the earth."
 mop_destroy_eoc_trigger_tt: "Every province in the §YChina§! subcontinent is owned by us, our £allied_commune£§YCommune Subject§!, a non-sovereign subject of our £allied_commune£§YCommune Subject§!, or our @HTM §YCossack Protectorate§!."
 mop_tibet_title: "Free Tibet"
 mop_tibet_desc: "The generals warn of thin air and frozen passes, arguing that the Himalayas are a fortress built by God to keep armies out. But the Revolution cannot stop at the timberline. Behind those peaks, the Lamas have constructed a feudal kingdom in the clouds, using their proximity to the heavens to justify the enslavement of the earth. We must brave the ascent and secure the high ground of Asia. By planting the flag of the Federation on the Roof of the World, we prove that there is no sanctuary high enough to protect a tyrant from the justice of the common man."
 mop_develop_bhutan_title: "The Thunder Citadels"
 mop_develop_bhutan_desc: "Thimphu stands as the sentinel overlooking the steamy plains of Bengal. While Tibet provides the high ground, Bhutan provides the choke point. We must study the 'Dzong' architecture of the locals—massive structures that serve as fortress, monastery, and city all in one. By expanding these citadels and lining the ridges with artillery, we transform Thimphu into an impregnable gatehouse. From here, we can project power into the Indian subcontinent while remaining safely behind a wall of clouds."
 mop_dzong_citadels_enabled_tt: "All §Ymountain§! provinces owned by us or our subjects with a §Yfort§! building will receive:"
 mop_dzong_citadels_future_tt: "§gThis applies to all §Ymountain§! provinces with a §Yfort§! constructed on them in the future as well.§!"
 mop_cauacasia_trigger_tt: "Every province in the §YCaucasia§! region is owned by us, our £allied_commune£§YCommune Subject§!, a non-sovereign subject of our £allied_commune£§YCommune Subject§!, or our @HTM §YCossack Protectorate§!."
 mop_caucasia_title: "Storm the Caucasus"
 mop_caucasia_desc: "The peaks of the Caucasus serve as more than a natural barrier; they are a hunting ground. For centuries, the empires of the South have harvested these mountains for slaves to fill their armies and harems. We must march into the highlands to sever this artery of human misery. By securing the mountain passes, we link our front with the Cossack hosts in the north and choke the reactionary powers by cutting off their supply of fresh recruits at the source."
 mop_holy_land_title: "Liberate the Holy Land"
 mop_holy_land_desc: "The cradle of our faith lies shackled in the grip of the Nizzarid blasphemers. For centuries, the Sultans have bled the Levant dry, oppressing the faithful and the fellahin alike. Our duty goes beyond the liberation of the peasantry; we as honorable Christians must liberate the holy land from the infidel. We shall march south as the Sword of the Lord, sweeping through Syria to break the chains of our Christian brothers. From Antiochia to Ierusalim, we must drive the infidel into the sea and restore the Holy Land to the stewardship of the faithful."
 mop_antiohia_commune: "The Antiohia Commune"
 desc_mop_antiohia_commune: "The ancient See of St. Peter has been restored. By returning the Patriarchate to the people, we have created a seminary system that operates on faith rather than gold, allowing us to maintain a vast clergy with minimal expense."
 mop_ierusalim_commune: "The Ierusalim Commune"
 desc_mop_ierusalim_commune: "The Holy Sepulchre is now guarded by the common soldier. Possession of the holiest city on earth validates our divine mandate, lending our missionaries an authority that even the most stubborn heathens find difficult to resist."
 if_we_have_completed_innovative_ideas_tt: "If we have embraced all §YInnovative§! ideas:"
 mop_iraq_title: "Liberate the Cradle"
 mop_iraq_desc: "Between the Tigris and the Euphrates lies the very cradle of agriculture, where the first furrow was plowed by the first peasant. Yet, under the neglect of the warlords, the ancient irrigation canals have choked with silt and the House of Wisdom lies in ruin. We must march into Mesopotamia to reclaim this wasted potential. By seizing Bagdad and restoring the flow of the Two Rivers, we shall turn the desert green again and proving that the Federation is the true heir to the knowledge of the ancients."
 can_use_bagdad_library_tt: "We can use §YThe House of Wisdom§! great project without meeting the religious requirements!"
 mop_reestablish_the_patriarchs_title: "Restore the Ancient Sees"
 mop_reestablish_the_patriarchs_desc: "The cities where the Apostles once walked have been liberated, yet their spiritual thrones remain dusty and diminished. For too long, the Patriarchs of Antiohia and Ierusalim have served as mere figureheads under the shadow of the crescent. We must pour the wealth of the Republic into restoring these ancient Sees to their rightful glory. By physically rebuilding the churches and endowing the clergy, we ensure that the voice of Eastern Orthodoxy rings out loud and clear from the very cradle of Christianity."
 mop_bagdad_title: "The New Babylon"
 mop_bagdad_desc: "The scars left by the Mongol hordes still disfigure the face of Mesopotamia. We must dredge the Nahrawan Canal and force the Tigris to water these arid plains once more. Our goal is to resurrect Bagdad, raising it from the dust to rival the ancient splendor of Babylon itself. We shall rebuild the House of Wisdom and replant the gardens, establishing the City of Peace as the scientific heart of the Federation."
 mop_satrapeia_title: "Harness the Eternal Fire"
 mop_satrapeia_desc: "The lowlands of Satrapeia bleed with the black blood of the earth, and the hills burn with flames that never die. We must harness this volatile gift for the revolution. By constructing extraction wells and expanding the harbor, we shall transform this region into the alchemical heart of our war machine. We must ensure that the Federation's armies are supplied with enough pitch and naphtha to burn the reactionary empires to ash."
 naval_reformer_galley_buff_tt: "§YNaval Reformer§! advisors now grant §G+5.0%§! Galley Combat Ability for each skill level."
 desert_dev_20_percent_extra_dev_tt: "There is now a §G20%§! chance of gaining §G1§! extra point of development when developing §YDesert§! provinces."
 coastal_desert_dev_20_percent_extra_dev_tt: "There is now a §G20%§! chance of gaining §G1§! extra point of development when developing §YCoastal Desert§! provinces."
 mop_arabia_title: "Shatter the Peninsula"
 mop_arabia_desc: "History warns us that a united Arabia is a sword pointed at the heart of Christendom. The Umayyads and Abbasids proved that a unified Arabia can shake the balance of the world. We cannot permit a new Caliphate to rise from the desert. Our strategy must be one of calculated fragmentation. We shall march south to dismantle the structures of unity, breaking the peninsula into a mosaic of small, introspective communes. By ensuring they focus on local rivalries rather than global conquest, we neutralize the threat forever."
 unlock_egyptian_grain_export_tt: "Unlock the §YGift Egyptian Grain§! diplomatic action.\nThis allows us to sacrifice §YProduction Development§! in §YGrain§!-producing provinces in the §YEgypt Region§! to provide food aid to foreign nations or subjects.\n§gBenefits:\n- Target gains §YManpower§! bonuses.\n- Increases §YTrust§! and §YOpinion§!.\n- Reduces §YLiberty Desire§! in subjects by §G-10%§!.§!"
 mop_egypt_title: "Liberate Egypt"
 mop_egypt_desc: "In ages long past, Egypt was a house of bondage, its people crushed beneath the Pharaoh. The Lord Almighty raised Moses and commanded that His children be set free; yet Pharaoh’s heart was hardened, and Egypt was scourged with plagues and cast into darkness.\n\nSo it is again in our own day. The Saracen tyrants profane the churches of the Copts, extort the meek, and enslave the faithful. It is clear that Providence has guided us to this land, so we may break the chains of bondage and humble those who mock Heaven. Once more, Egypt must be cast into darkness and the rivers must flow with the blood of the infidel, for that is the will of the Lord. And His will be done."
 marsh_dev_20_percent_extra_dev_tt: "There is now a §G20%§! chance of gaining §G1§! extra point of development when developing §YMarsh§! provinces."
 mountain_dev_20_percent_extra_dev_tt: "There is now a §G20%§! chance of gaining §G1§! extra point of development when developing §YMountain§! provinces."
 highlands_dev_20_percent_extra_dev_tt: "There is now a §G20%§! chance of gaining §G1§! extra point of development when developing §YHighlands§! provinces."
 mop_persia_title: "Slay the Shahs"
 mop_persia_desc: "The Iranian plateau bleeds under the ambition of petty tyrants. From the fire-worshipping Sassanids to the Saracen Injuids, every warlord here claims the title of Shahanshah. This ultimate arrogance insults both God and the common man. We shall cross the Zagros Mountains to extinguish these ancient dynasties. Whether they bow to the Sacred Fire or the Crescent, they must learn that the only true sovereign is the people."
 mop_portul_abas_title: "Great Port of Abas"
 mop_portul_abas_desc: "Persia’s coasts have long served foreign empires, but now Portul Abas shall rise as our own gate to the wider world. By deepening its harbor, fortifying its walls, and turning its workshops to the sea, we will forge a true oceanic commune. From this harbor we shall push beyond the Persian Gulf, carrying the revolution into the vast Indian Ocean."
 mop_moca_title: "The Black Elixir"
 mop_moca_desc: "A crate of the 'Ishmaelite beans' recently reached the Sfatul Tarii. After the initial hesitation, a weary clerk brewed the dark liquid, and proceeded to draft three weeks of legislation in a single night. The Council is now gripped by a feverish obsession. They claim this 'coffee' is the cure for lethargy and the fuel of the mind. National priority has shifted overnight: we must clear the hills of Yemen and cover them in plantations. The Revolution must never sleep again."
 mop_alexandria_patriarch_title: "Restore the See of Saint Mark"
 mop_alexandria_patriarch_desc: "For centuries, the Seat of Saint Mark has languished under the heel of the Saracen, its bells silenced by the call of the minaret. We must sweep the city clean of the infidel administration and restore the ancient basilicas to their former grandeur. By expelling the Sultan's functionaries and reinstalling the true Patriarch, we ensure that the spiritual authority of the Nile is held by a shepherd of the true faith, not a servant of the Crescent."
 liberated_peasants_in_hre_tt: "We've overthrown the nobility and created a  £allied_commune£§YCommune Subject§! in at least §Y2§! countries in the £hre£§YHoly Roman Empire§!. Currently: §Y[Root.hre_nations_liberated.GetValue]§!"
 incited_peasants_in_hre_tt: "We have used the §YIncite Peasants§! covert diplomatic action against §Y4§! countries in the £hre£§YHoly Roman Empire§! within the last §Y10 years§!."
 has_scornfully_insulted_the_hremperor_tt: "We have scornfully insulted the £hre£§YHoly Roman Emperor§!, @[Emperor.GetTag] §Y[Emperor.GetName]§!."
 mop_great_peasants_war_each_incited_country_tt: "We will add §G+75§! to our Spy Network in their country. §YIncited Peasantry§! will be replaced with §YInsurrectionary Peasantry§! which has the following effect:"
 start_gpw_early_tt: "We will start the §YGreat Peasants War§! early in the £hre£§YHoly Roman Empire§!!"
 have_invited_3_hre_countries_to_league_tt: "We have diplomatically vassalized at least §Y3 Peasant Republics§! in the £hre£§YHRE§! using the §YInvite to League§! diplomatic action. Currently: §Y[This.hre_nations_diplo_annexed.GetValue]§!\n§gThis action is only visible on peasant republic countries.§!"
 has_supported_2_mass_peasant_uprisings_tt: "We have used the §YStage Mass Peasant Uprising§! covert diplomatic action on at least §Y2§! nations in the £hre£§YHRE§!. Currently: §Y[This.number_of_mass_peasant_uprisings.GetValue]§!"
 mop_great_peasants_war_permanent_pp_tt: "We will gain §G+10§! Power Projection §Gpermanently§!."
 great_peasants_war_late_tt: "§YThe Great Peasants War§! has happened already."
 mop_great_peasants_war_title: "The Great Peasants War"
 mop_great_peasants_war_desc: "The feudal lords of the Holy Roman Empire sit atop a powder keg of resentment. It is our duty to light the fuse. We must send our agents into the German heartlands, radicalize the countryside, and ensure that when the fires of war are lit, they burn hot enough to consume the Imperial throne itself."
 integrated_commune_neapolitan_bonus_tt: "£integrated_commune£§YIntegrated Commune§!£integrated_commune£ subjects of §YNeapolitan§! culture will grant us §G-10.0%§! Ship Costs if they have over §Y350§! total development."
 mop_south_italy_title: "Liberate the Mezzogiorno"
 mop_south_italy_desc: "The Shia Sultans rule the mainland from their island fortresses, treating the fertile peninsula as little more than a harvest colony. The farmers of Apulia and the fishermen of Calabria cry out for deliverance. We must cross the Adriatic, secure the boot of Italy, and drive the Sultan's armies back across the Strait of Messina."
 we_will_liberate_sicilian_slaves_tt: "We will liberate all the slaves captured by §Y[SIC.GetName]§!."
 mop_sicily_title: "Liberate the Isles"
 mop_sicily_desc: "The islands of the Mediterranean have long served as safe harbors for pirates, slavers, and reactionary aristocrats. From the rock of Malta to the granaries of Sicily, these territories act as staging grounds for raids against free peoples. We must cross the straits, storm their fortifications, and turn these unsinkable carriers of oppression into bastions of the revolution."
 mop_malta_title: "Shield of the Mediterranean"
 mop_malta_desc: "Possession of Malta is merely the first step; to truly secure the seas, we must transform this rock into an unsinkable carrier of revolutionary power. By expanding the harbors, reinforcing the ancient citadel, and establishing a permanent naval shipyard, we will ensure that our reach extends to every corner of the Mediterranean."
 unlocked_corsair_crew_flagship_tt: "§GUnlocks§! the §YCorsair Crew§! flagship modification:\nFleet Privateering Efficiency: §G+50.0%§!\nMovement Speed On and Off Ships: §G+25.0%§!\nFlagship Maintenance: §R+0.75§!"
 mop_venice_title: "The Merchant Princes"
 mop_venice_desc: "The so-called 'Serene Republic' is a gilded lie, an oligarchy where a few merchant families fatten themselves on the labor of the Adriatic while claiming the mantle of liberty. We must breach the lagoon, storm the Doge's Palace, and burn the Golden Book. The Arsenal will no longer serve profit, but the liberation of the working class."
 galleass_galley_in_venice_tt: "We will gain §Y5§! Galleass Galleys in §Y[112.GetName]§!."
 integrated_commune_venetian_bonus_tt: "£integrated_commune£§YIntegrated Commune§!£integrated_commune£ subjects of §YVenetian§! culture will grant us §G+7.5%§! Galley Combat Ability if they have over §Y350§! total development."
 coastline_dev_20_percent_extra_dev_tt: "There is now a §G20%§! chance of gaining §G1§! extra point of development when developing §YCoastal§! provinces."
 unlocked_venetian_arsenal_heavy_bombards_tt: "§GUnlocks§! the §YArsenal Heavy Bombards§! flagship modification:\nFleet Naval Barrage Cost: §G-50.0%§!\nFlagship Cannons: §G+50.0%§!\nFlagship Maintenance: §R+1.00§!"
 mop_dev_venice_title: "Most Serene Commune"
 mop_dev_venice_desc: "Venice was built on the backs of sailors and shipwrights, yet for centuries only the aristocracy reaped the rewards. It is time to unleash the full potential of this city under the banner of the revolution."
 integrated_commune_sardinian_bonus_tt: "£integrated_commune£§YIntegrated Commune§!£integrated_commune£ subjects of §YSardinian§! culture will grant us §G+25%§! Blockade Efficiency if they have over §Y350§! total development."
 integrated_commune_lombard_bonus_tt: "£integrated_commune£§YIntegrated Commune§!£integrated_commune£ subjects of §YLombard§! culture will grant us §G+5%§! Infantry Combat Ability if they have over §Y350§! total development."
 integrated_commune_piedmontese_bonus_tt: "£integrated_commune£§YIntegrated Commune§!£integrated_commune£ subjects of §YPiedmontese§! culture will grant us §G+10%§! Garrison Size if they have over §Y350§! total development."
 integrated_commune_ligurian_bonus_tt: "£integrated_commune£§YIntegrated Commune§!£integrated_commune£ subjects of §YLigurian§! culture will grant us §G-0.5§! Interest per annum if they have over §Y350§! total development."
 mop_north_italy_title: "Liberate the North"
 mop_north_italy_desc: "The wealthy cities of Lombardy and the fortresses of Piedmont stand as monuments to feudal arrogance. We must sweep across the plain, smashing the power of the Condottieri and the banking families. From the rice fields of the Po to the docks of Genoa, the North shall be free."
 repay_loan_reduces_inflation_tt: "Repaying loans now §Greduces§! inflation by §G-0.05§!."
 mop_genoa_title: "La Superba"
 mop_genoa_desc: "The banking families choked Genoa's potential with their intrigue and avarice. We have swept them aside. By integrating the port directly into the Federation's supply chain and expanding its dockyards, we will transform this city into an industrial titan that eclipses anything the old Doges could have imagined."
 unlock_genoese_rigging_tt: "§GUnlocks§! the §YGenoese Rigging§! flagship modification:\nTrade Power per Ship in Fleet: §G+2.00§!\nFleet Movement Speed: §G+1.00§!\nFlagship Maintenance: §R+1.00§!"
 integrated_commune_tuscan_bonus_tt: "£integrated_commune£§YIntegrated Commune§!£integrated_commune£ subjects of §YTuscan§! culture will grant us §G-2.5%§! Idea Cost if they have over §Y350§! total development."
 integrated_commune_romagnan_bonus_tt: "£integrated_commune£§YIntegrated Commune§!£integrated_commune£ subjects of §YRomagnan§! culture will grant us §G-5%§! Advisor Cost if they have over §Y350§! total development."
 mop_central_italy_title: "End the Medici Tyranny"
 mop_central_italy_desc: "The Medici bankers and the Romagnan counts have turned the cradle of the Renaissance into a gilded cage, using culture as a cloak for usury and nepotism. We must storm the palaces of Florence and the lecture halls of Bologna. Wisdom belongs to the free man, not the highest bidder."
 integrated_commune_umbrian_bonus_tt: "£integrated_commune£§YIntegrated Commune§!£integrated_commune£ subjects of §YUmbrian§! culture will grant us §G-5%§! Morale Damage Received if they have over §Y350§! total development."
 mop_rome_title: "Liberate Rome"
 mop_rome_desc: "For centuries Rome has been the throne of emperors, popes and princes, never of the common folk. Now our communes ring the Apennines and the Tiber lies within our reach. If we seize the Eternal City and bind central Italy into our federation, we will prove that no altar, palace or senate is beyond the peasantry’s grasp."
 unlock_ROP_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @ROP §YThe Roman Communes§! in one of your £integrated_commune£§YIntegrated Communes§! that is of §YLatin§! culture. Once @ROP §YThe Roman Communes§! is established, you will be able to transfer §YLatin§! provinces and provinces in the §YItaly Region§! from your other £integrated_commune£§YIntegrated Communes§! to @ROP §YThe Roman Communes§!."
 integrated_commune_latin_bonus_tt: "For every §Y500§! Total Development held by a §YLatin§! £integrated_commune£§YIntegrated Commune§! (up to a cap of §Y2000§! Development), we gain:\nCore Creation Cost: §G-100.0%§!"
 mop_italy_title: "Unify the Peninsula"
 mop_italy_desc: "Italy has long been a patchwork of bickering city-states and foreign fiefdoms, keeping the people divided and weak. We must sweep away the Doges, the Dukes, and the Condottieri. From the Alps to Sicily, we shall unite the peninsula under a single federal banner, reviving the ancient spirit of the Res Publica to govern the cradle of civilization."
 mop_roman_patriarch_title: "The Roman Patriarchate"
 mop_roman_patriarch_desc: "For centuries, the Bishop of Rome has claimed a supremacy that belongs only to God, leading the West into error and schism. We have marched into the Vatican to correct this ancient mistake. By dismantling the corrupt machinery of the Papal Curia and installing a Patriarch loyal to the Orthodox rites, we return the Church of Rome to its original station. The Eternal City serves the True Faith once more."
 reduce_liberty_desire_from_converting_subjects_to_orthodox_tt: "Converting our subjects to §YOrthodox§! will reduce their Liberty Desire by §G50§! for §Y500 months§!."
 mop_pentarchy_title: "Restore the Pentarchy"
 mop_pentarchy_desc: "The ancient Patriarchates of Alexandria, Antiohia, and Ierusalim—the very cradle of our faith—languish under the yoke of infidels and heretics. The Pentarchy, the five-pillared foundation of the original Church, is incomplete. It is our ultimate duty to liberate these holy cities and bring all five Sees under our protection."
 hill_dev_20_percent_extra_dev_tt: "There is now a §G20%§! chance of gaining §G1§! extra point of development when developing §YHill§! provinces."
 integrated_commune_austrian_bonus_tt: "£integrated_commune£§YIntegrated Commune§!£integrated_commune£ subjects of §YAustrian§! culture will grant us §G+1§! Diplomatic Relations if they have over §Y450§! total development."
 mop_austria_title: "The Danubian Gateway"
 mop_austria_desc: "The Danube is the commercial artery of the Federation, yet its upper reaches remain choked by the tolls of Styrian dukes and Alpine counts. Strategic security demands that we control the river from the Black Sea to its source. We must march into the highlands to secure Viena and fortify the mountain passes. By locking the Alpine gates, we shield the Federation from Western aggression and ensure that the wealth of Germania flows downstream into our hands, not theirs."
 mop_vienna_title: "The Concert of Viena"
 mop_vienna_desc: "Viena stands as the jewel of the Danube, yet it retains the stiff arrogance of the old aristocracy. To truly integrate this city, we must break its cultural isolation. We shall convert the cathedrals to the Orthodox rite and repurpose the Schönbrunn Palace into a center for public administration and the arts. By proving that the Federation can nurture high culture as well as it nurtures the soil, we demonstrate to the German princes that our way of life offers beauty as well as bread."
 mop_switzerland_swiss_fort_bonus_tooltip: "Every Fort owned by us or our subjects in the §YSwitzerland§! and §YRomandie§! areas gains:"
 mop_switzerland_title: "The Alpine Bastion"
 mop_switzerland_desc: "The Swiss Cantons share a flicker of our communal spirit, yet they squander their freedom by selling their sons as mercenaries to foreign tyrants. We must end this blood trade. By marching into the Alps and integrating the Cantons, we transform the roof of Europe into an impenetrable fortress."
 integrated_commune_swiss_bonus_tt: "£integrated_commune£§YIntegrated Commune§!£integrated_commune£ subjects of §YSwiss§! culture will grant us §G+7.5%§! Mercenary Discipline if they have over §Y450§! total development."
 integrated_commune_bavarian_bonus_tt: "£integrated_commune£§YIntegrated Commune§!£integrated_commune£ subjects of §YBavarian§! culture will grant us §G+5.0%§! Goods Produced Modifier if they have over §Y450§! total development."
 oktoberfest_enabled_tt: "Every year starting in §YSeptember§!, every §YGrain§! and §YWine§! producing province will celebrate §YOktoberfest§! for §Y1 month§!, which grants the province the following:"
 mop_bavaria_title: "Liberate Bavaria"
 mop_bavaria_desc: "With the Alps secured, the path to the heart of the Holy Roman Empire lies open across the Bavarian plateau. The Wittelsbach dukes stand as the self-appointed gatekeepers of Germania, using their rich agricultural lands to feed the Imperial armies and block our advance up the Danube. We must march on Munchen to seize the granaries of the south. By shattering this shield, we leave the remaining princes of the Empire exposed and defenseless."
 mop_south_germany_title: "Liberate South Germany"
 mop_south_germany_desc: "The patchwork of bishoprics and duchies that has long strangled the south of Germany must be swept away. We will unite the radical zeal of the Swabian peasantry with the industrial might of the Franconian guilds. Nürnberg shall be seized and reorganized as a Federal Enclave—a shining beacon of science and industry to power the revolution."
 integrated_commune_swabian_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YSwabian§! culture will grant us §G-0.10§! Yearly Inflation Reduction if they have at least §Y450§! total development."
 integrated_commune_franconian_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YFranconian§! culture will grant us §G-7.5%§! Administrative Advisor Cost if they have at least §Y450§! total development."
 buffed_razesi_education_grants_tt: "The §YRazesi Education Grants§! estate privilege now grants §G-10.0%§! Administrative Advisor Cost."
 woods_dev_20_percent_extra_dev_tt: "There is now a §G20%§! chance of gaining §G1§! extra point of development when developing §YWoods§! provinces."
 mop_nurnberg_title: "Develop Nürnberg"
 mop_nurnberg_desc: "The guilds of Nürnberg possess the potential to arm the entire Federation. We must pour our wealth into this city until it rises as a peerless metropolis of steel and science. A thoroughly modernized industry will guarantee the survival of our ideals."
 mop_bohemia_title: "The Hussite Legacy"
 mop_bohemia_desc: "Prague remains a dormant volcano of radical thought. The Hussites dreamed of a world without masters long before us. We shall march into Bohemia to vindicate their martyrs and harness their intellectual fervor. The Truth Prevails."
 integrated_commune_czech_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YCzech§! culture will grant us §G+10.0%§! Innovativeness Gain if they have at least §Y200§! total development."
 defenestration_tactics_enabled_tt: "§gImpressed by the efficiency of Czech political discourse, our spies have adopted the art of defenestration.§!\nSupporting rebels now has a §Y10%§! chance of granting §G+1000%§! Rebel Support Efficiency against the target, allowing you declare war with the §YGreat Peasant Uprising§! casus belli §Gimmediately§!."
 mop_saxons_title: "Awaken the Saxons"
 mop_saxons_desc: "The oligarchs of the Hanseatic League and the princes of Saxony have grown fat on the labor of the north. We must storm the ports of Hamburg and Bremen and seize the printing presses of Leipzig. By uniting the Saxon lands under the communal banner, we secure both the intellectual and commercial future of the revolution."
 integrated_commune_saxon_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YSaxon§! culture will grant us §G+10.0%§! Global Institution Spread if they have at least §Y450§! total development."
 integrated_commune_lower_saxon_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YLower Saxon§! culture will grant us §G+5.0%§! Global Trade Power if they have at least §Y450§! total development."
 mop_rhine_title: "The Rhine Confederation"
 mop_rhine_desc: "The Rhine is the artery of Western Europe. We must liberate its banks from the clutch of bishop-princes and unite the Rhenish and Westphalian peoples under one banner. Frankfurt shall serve as the anchor of this new order, securing the revolution's western flank."
 integrated_commune_hannoverian_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YHannoverian§! culture will grant us §G+1.00§! Tolerance of Heretics if they have at least §Y450§! total development."
