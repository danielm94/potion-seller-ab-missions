 frankfurt_bank_event_eco_ideas_tt: "§VThe bonuses from this event will be increased by §G50%§! if we have completed §YEconomic Ideas§!!§!"
 integrated_commune_germanic_scaling_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of the §YEast Germanic§! or §YGermanic§! culture group grant us cumulative bonuses based on their §Ytotal development§!:\n§Y500§!: Monthly Autonomy Change: §G-0.05§!\n§Y1000§!: Discipline: §G+2.5%§!\n§Y1500§!: Production Efficiency: §G+5.0%§!\n§Y2000§!: Yearly Prestige: §G+0.50§!\n§Y2500§!: Administrative Efficiency: §G+5.0%§!"
 unlock_GER_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish the @GER §YGerman Confederation§! in one of your £integrated_commune£§YIntegrated Communes§! that is of §YGermanic§! or §YEast Germanic§! culture. Once the @GER §YGerman Confederation§! is established, you will be able to transfer §YGermanic§! and §YEast Germanic§! provinces, as well as provinces in the §YNorth Germany§! and §YSouth Germany§! regions, from your other £integrated_commune£§YIntegrated Communes§! to the @GER §YGerman Confederation§!."
 germanic_subjects_lose_ld_tt: "All of our §YEast Germanic§! and §YGermanic§! subjects lose §G20§! Liberty Desire and gain §G10§! Trust with us."
 mop_germany_title: "Tochter Aus Elysium"
 mop_germany_desc: "The myriad borders of the German princes have been erased, and with them, the feudal customs that strictly divided this people for a thousand years. Whether the Imperial title still lingers in some distant court matters not; here, on German soil, the old order is dead. A new anthem rises from the Rhine to the Oder, celebrating the spark of divinity found in the common man. Thy magic binds again what custom parted; all men become brothers where the gentle wing of the Republic abides."
 mop_frankfurt_title: "The Federal Exchange"
 mop_frankfurt_desc: "Frankfurt sits at the crossroads of Europe. We must expand its markets, pave its roads, and fortify its vaults. By transforming this city into a metropolis of trade and law, we ensure that the Federation's economy is as unassailable as its armies."
 exemplarists_architect_boost_tt: "§YArchitect§! advisors are now §G5x§! more likely to appear if the §YExemplarists§! are the leading faction."
 internationalist_mandate_buff_tt: "The §OInternationalist Mandate§! §YRazesi§! estate privilege now grants §G+20.0%§! Ship Trade Power"
 mop_hamburg_title: "The Gate of the North"
 mop_hamburg_desc: "We must transform Hamburg into the premier port of the North Sea. By dredging the Elbe, expanding the shipyards, and fortifying the coastline, we will create a maritime hub capable of projecting the Federation's commercial power across the globe."
 integrated_commune_cosmopolitan_french_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YFrancien§! culture will grant us §G+7.5%§! Morale of Armies if they have at least §Y400§! total development."
 integrated_commune_gascon_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YGascon§! culture will grant us §G+0.1§! Infantry Fire if they have at least §Y400§! total development."
 integrated_commune_occitain_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YOccitan§! culture will grant us §G+5.0%§! Trade Efficiency if they have at least §Y400§! total development."
 integrated_commune_burgundian_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YBurgundian§! culture will grant us §G+10.0%§! Cavalry Flanking Ability if they have at least §Y400§! total development."
 integrated_commune_wallonian_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YWaloon§! culture will grant us §G-10.0%§! Artillery Cost if they have at least §Y400§! total development."
 integrated_commune_breton_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YBreton§! culture will grant us §G-10.0%§! Heavy Ship Cost if they have at least §Y400§! total development."
 integrated_commune_normand_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YNorman§! culture will grant us §G+10.0%§! Global Tax Modifier if they have at least §Y400§! total development."
 mop_tunisia_title: "The Barbary Coast"
 mop_tunisia_desc: "For centuries, the corsairs of Tunis have preyed upon the weak. We shall storm their citadels and break the chains of their galley slaves. By seizing this coast, we transform a nest of pirates into a shield for our merchant marine."
 mop_dev_tunisia_title: "The Pearl of the Maghreb"
 mop_dev_tunisia_desc: "Tunis must be rebuilt into a modern metropolis, eclipsing its Carthaginian ancestors. By expanding the port and fortifying the city, we create a secure base of operations. From this stronghold, we shall project our power southwards, seizing the ancient salt routes of the Sahara and bringing the desert itself under Federal administration."
 mop_maghreb_title: "Liberate the Maghreb"
 mop_maghreb_desc: "The Sultans of Morocco and the Emirs of the Atlas have long guarded the gates to the Atlantic. We must dismantle their dynasties and unite the Berber tribes under the red banner. From the peaks of the High Atlas to the shores of the Ocean, the Revolution shall reign supreme."
 mop_demnat_title: "The Atlas Citadel"
 mop_demnat_desc: "Demnat stands as the gateway between the Atlantic coast and the vast Sahara. We must expand its ancient kasbahs into a modern mountain fortress and pave the treacherous passes of the High Atlas. From this eagle's nest, our administration will oversee the entirety of Northwest Africa."
 mop_southern_france_title: "Liberate Occitania"
 mop_southern_france_desc: "The Frankish crown has long suppressed the independent spirit of the South. From the Alps to the Pyrenees, the Occitan and Gascon people wait for a spark. We must drive the royal armies from Languedoc and Guyenne, breaking the chains of Paris and restoring the ancient liberties of the Midi."
 integrated_commune_frisian_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YFrisian§! culture will grant us §G+0.15§! Yearly Republican Tradition if they have at least §Y300§! total development."
 integrated_commune_dutch_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YDutch§! culture will grant us §G-5.0%§! Development Cost if they have at least §Y300§! total development."
 integrated_commune_flemish_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YFlemish§! culture will grant us §G-7.5%§! Construction Cost if they have at least §Y300§! total development."
 mop_low_countries_title: "Liberate the Lowlands"
 mop_low_countries_desc: "The wealth of the Low Countries is legendary, built on the backs of weavers and sailors but hoarded by merchant princes. We must sweep through the polders and seize the great ports. By nationalizing the Dutch trade network, we ensure the Revolution will never want for gold."
 unlock_UNN_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @UNN §YBatavia§! in one of your £integrated_commune£§YIntegrated Communes§! that is of §YDutch§!, §YFlemish§!, or §YFrisian§! culture. Once @UNN §YBatavia§! is established, you will be able to transfer §YDutch§!, §YFlemish§!, and §YFrisian§! provinces, as well as provinces in the §YLow Countries Region§!, from your other £integrated_commune£§YIntegrated Communes§! to @UNN §YBatavia§!."
 isolationist_mandate_buff_tt: "The §OIsolationist Mandate§! §YRazesi§! estate privilege will now grant us §G-50.0%§! Expand Infrastructure Cost Modifier."
 mop_amsterdam_title: "The World's Warehouse"
 mop_amsterdam_desc: "Amsterdam must rise as the supreme model of urban planning. We shall expand the canal network and drain the surrounding marshlands until the city stands as a monument to human ingenuity. The mastery of nature demonstrated here will serve as a blueprint for the entire Federation."
 unlock_FRP_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @FRP §YLa Fédération§! in one of your £integrated_commune£§YIntegrated Communes§! that is of the §YFrench§! culture group. Once @FRP §YLa Fédération§! is established, you will be able to transfer §YFrench§! culture group provinces and provinces in the §YFrance region§! from your other £integrated_commune£§YIntegrated Communes§! to @FRP §YLa Fédération§!."
