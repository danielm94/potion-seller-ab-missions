 mop_win_civil_war_title: "Crush the Boieri"
 mop_win_civil_war_desc: "$TODO$"
 no_coring_penalty_in_perma_claim_provinces: "The insane core creation cost penalty will be §Gnegated§! in provinces we have a §Ypermanent claim§! on until the end of the game."
 mop_cossack_relations_title: "Courting the Steppe"
 mop_cossack_relations_desc: "$TODO$"
 improved_relations_with_zaz_tt: "@ZAZ §Y[ZAZ.GetName]§! has an §YImproved Relations§! value of §G+100§! with us."
 if_we_allied_with_zaz_tt: "If we allied with @ZAZ §Y[ZAZ.GetName]§!:"
 if_we_improved_relations_with_zaz_tt: "If we improved relations with @ZAZ §Y[ZAZ.GetName]§!:"
 if_zaz_no_longer_exists_and_we_conquered_zaz_tt: "If @ZAZ §Y[ZAZ.GetName]§! no longer exists and we conquered their starting provinces:"
 mop_deepen_cossack_ties_title: "Deepen Cossack Ties"
 mop_deepen_cossack_ties_desc: "The steppe is a dangerous borderland, and neither the Sfatul Tarii nor the Zaporizhian Host can stand alone. Surrounded by boyar princedoms and the hungry gaze of the Horde, we must bind ourselves to the Cossacks through shared trust and purpose. They will guard the frontier, and we will see that their supply lines never run dry."
 zaz_will_be_released_again_lmao_tt: "@ZAZ §Y[ZAZ.GetName]§! will be released."
 so_as_long_as_zaz_remains_our_subject_tt: "§gThis modifier will be active as long as @ZAZ §Y[ZAZ.GetName]§! or @HTM §Y[HTM.GetName]§! are our subjects.§!"
 mop_expand_the_host_anti_confusion_trigger_tt: "§gNote that @ZAZ §Y[ZAZ.GetName]§! needs to own these provinces, §RNOT YOU§!.§!"
 mop_western_ukraine_title: "Unleash the Host"
 mop_western_ukraine_desc: "In the lands of Ruthenia, our merchants are stripped and hanged from the gates, our pilgrims robbed, our envoys mocked as serfs who forgot their place. The boyars preach that Moldavians are no better than beasts, fit only for the lash. Every caravan that crosses their borders is bled dry by tolls and extortion.\n\nWe have pleaded for peace and received only corpses in return. So be it. Zaporizhia shall have free rein to pacify the western marches. Let the boyars learn the price of their hatred."
 mop_enclave_in_kiev_tt: "We will take control of §Y[280.GetName]§! and the surrounding area and establish a commune."
 mop_secure_crimea_title: "Secure the Black Sea"
 mop_secure_crimea_desc: "The Golden Horde still festers upon the steppe, raiding our frontiers and chaining free men for the slave markets of Azov. So long as they endure, neither the communes nor the Host will know peace. We must strike south, shatter the Horde’s hold on the coast, and seize their port before another generation is sold into bondage."
 azov_commune_tt: "We will take control of §Y[286.GetName]§! and the surrounding area and establish a commune."
 abolitionists_ban_black_sea_slave_tt: "The Abolitionists will see to it that the Black Sea slave trade is abolished. As a result, §YSlaves§! will no longer be produced in §Y[286.GetName]§!."
 mop_develop_kiev_title: "Kiev the Great"
 mop_develop_kiev_desc: "Kyiv must become the beating heart of our northern trade and the surest sign of our good order in Ruthenia. Expand its streets and storehouses, strengthen its councils, and endow the Kyievo-Pecherska Lavra so that faith and craft flourish side by side."
 mop_march_to_sarai_title: "March to Sarai"
 mop_march_to_sarai_desc: "The Horde’s capital has long been the beating heart of raids and slave markets that torment our lands. With Azov secured and the Host at our side, we can cut the head from the beast."
 astrakhan_commune_tt: "We will take control of §Y[464.GetName]§! and the surrounding area and establish a commune."
 mop_east_ukraine_title: "Seize the Left Bank"
 mop_east_ukraine_desc: "The western marches are quieted; now the Host must ride across the Dnieper. Sloboda Ukraine, the Left Bank, and Chernihiv are the keystone of Ruthenia’s heartland. With our backing and their banners, Zaporizhia will break the boyar cordon, bind the frontier to our trade, and carry Moldavian law to the far bank."
 conssack_conquest_cb_enabled_tt: "@HTM §Y[HTM.GetName]§! will unlock the §YCossack Conquest§! casus belli, which allows them to attack neighboring countries in the regions of §YRussia§!, §YRuthenia§!, the §YPontic Steppe§!, the §YUrals§!, §YCentral Asia§!, §YWest Siberia§!, §YEast Siberia§!, §YMongolia§!, and §YManchuria§!. We can use this casus belli against their neighbors on their behalf."
 mop_proclaim_the_hetmanate_title: "Rise of the Hetmanate"
 mop_proclaim_the_hetmanate_desc: "From a band of free riders on the Lower Dnieper to the stewards of Ruthenia and the tamers of the southern steppes — our Cossack brothers have risen beside us in triumph. Together we shattered the Golden Horde’s yoke, humbled the proud Ruthenian princes, and turned the wild frontier into a bastion of liberty and discipline. Now, as we proclaim the Hetmanate, the Host stands as a sovereign arm of our League — a living testament to the power of common men who would not bow."
 cossack_protectorate_tt: "§gA §YCossack Protectorate§! is a very loyal subject that can fight its own wars. Although it doesn't give you any vassal income, it gives you plenty of §Ymanpower§!, §Yforce limit§!, and §Yunique bonuses§! to your military depending on how much total development it has.§!"
 mop_the_caspian_gates_title: "The Caspian Gates"
 mop_the_caspian_gates_desc: "With Azov and Astrakhan in our hands, we must invest in docks, shipyards, forts, and markets to turn these river mouths into thriving hubs and draw the Silk Road’s riches through our coffers."
 mop_wallachia_title: "[mop_wallachia_title_loc]"
 mop_wallachia_desc: "[mop_wallachia_desc_loc]"
 if_bogdan_razesul_is_ruling_tt: "If §VBogdan Razesul§! is ruling §Y[Root.GetName]§!:"
 if_bogdan_razesul_isnt_ruling_tt: "If §VBogdan Razesul§! isn't ruling §Y[Root.GetName]§!:"
 if_the_butcher_has_already_purged_the_ten_houses_tt: "If the Butcher of Tirgoviste has already purged the Ten Houses of Wallachia:"
 if_the_butcher_hasnt_already_purged_the_ten_houses_tt: "If the Butcher of Tirgoviste hasn't already purged the Ten Houses of Wallachia:"
 if_bulgaria_is_our_rival_tt: "If @BUL [BUL.GetName] is our rival, we will gain:"
 mop_liberate_dobruja_title: "Liberate Dobruja"
 mop_liberate_dobruja_desc: "For nearly a millennium, the Bulgar yoke has weighed upon our people. Their recent war against the Romans has left them overextended, their armies drained. An opportunity to settle old scores and secure our future now presents itself. We must strike across the Danube and liberate our kin in Dobruja."
 mop_liberate_transylvania_title: "Liberate Transylvania"
 mop_liberate_transylvania_desc: "For centuries, the Vlachs have been the subject of heathens, but this ends now. We must liberate our kin in Transylvania from the oppressive yoke of the Magyar invaders before they regain their strength and seek to conquer [Root.GetName] once more."
 mop_vlach_emancipation_title: "Emancipation of the Vlachs"
 mop_vlach_emancipation_desc: "Wallachia, Transylvania, Dobruja, and Moldavia now stand free of the yoke of the boieri. From the Carpathians to the Black Sea, the fields belong to those who till them, and Sfatul Tarii speaks for all our kin. Let the world know the peasants of Dacia are one people: we bind our communes into a single cause and raise a new banner over the mountains and the Danube."
 tuc_unlock_new_renames_tt: "Unlock new country names to rename yourself to in the §YRename Our Country§! event. The first rename is free."
 unlock_dacian_commune_reform_tt: "We will replace the §YMoldavian Commune§! Tier 1 government reform with the more powerful §YDacian Commune§! reform"
 ruler_has_protector_of_the_little_folk_personality_tt: "If our ruler has the §YProtector of the Little Folk§! personality trait:"
 ruler_doesnt_have_protector_of_the_little_folk_personality_tt: "If our ruler doesn't have the §YProtector of the Little Folk§! personality trait:"
 mop_rouse_the_bulgar_peasants_title: "Rouse the Bulgars"
 mop_rouse_the_bulgar_peasants_desc: "The Vlachs are free; now the peasants south of the Danube look to us for a sign. Our riders carry bread, letters, and quiet oaths into the valleys of Moesia and Thrace, stirring the Bulgarian villages against their lords."
 mop_rouse_the_bulgar_peasants_trigger_tt: "We have used the §YIncite the Peasants§! covert diplomatic action against any country that:\n- Owns §YBulgarian§! provinces in the §YBalkans§!.\n- Isn't our subject."
 bulgarian_peasants_send_contact_tt: "§gThe Bulgarian ringleader will send one of his best operatives to work at our court in §Y[Root.Capital.GetName]§! as a token of his gratitude...§!"
 if_we_incited_peasants_against_bulgaria_itself_tt: "If we incited peasants against @BUL §Y[BUL.GetName]§! and they are our §Yrival§! or §Yenemy§!:"
 mop_arm_the_bulgar_peasants_title: "Arm the Bulgar Peasants"
 mop_arm_the_bulgar_peasants_desc: "Our whispers have turned to oaths, and oaths now need steel. The Bulgarian villages have risen in secret, hammering ploughshares into pikes and hiding powder beneath their granaries. Our agents cross the Danube under night, smuggling coin and arms through the monasteries and wine caravans. Let them take what they need from the boyars’ own purses—those riches will soon return to the people one way or another."
 mop_arm_the_bulgar_peasants_target_expired_tt: "You need to use the §YIncite the Peasants§! covert diplomatic action on a country that owns §YBulgarian§! provinces in the §YBalkans§!. The effects of §YIncite the Peasants§! only last for §Y10 years§!."
 is_supporting_peasant_rebels_against_target_tt: "We are supporting §YPEASANT§! rebels against §Y[mop_peasant_subject_tutorial_mission_target.GetName]§!"
 mop_robbed_target_tt: "§gOur agents intercept supply caravans and extort local magnates loyal to the oppressor, seizing §Y100¤§! to arm the Bulgarian communes.§!"
 get_read_to_invade_with_peasants_tt: "§gBe sure to keep an eye on the rebel progress. Once the peasant rebels rise up, you will gain access to the §YGreat Peasant Uprising§! casus belli against §Y[mop_peasant_subject_tutorial_mission_target.GetName]§!. If the rebels are destroyed before you declare war on them, §Ryou will have to go through this whole song and dance all over again.§!§!"
 mop_war_for_the_bulgars_title: "War for the Bulgars"
 mop_war_for_the_bulgars_desc: "The spark has caught; the Bulgar villages now stand on the edge of open revolt. Our agents have armed them, our whispers have turned to war cries, and the boyars now beg for mercy."
 some_of_the_bulgars_join_our_ranks_tt: "§gSome of the Bulgarian peasants join our ranks!§!"