 mop_england_north_series_title: "Shatter the Witan"
 mop_england_north_series_desc: "The Ænglish suffer a unique tyranny: the illusion of choice. Their Parliament is a theater where Earls trade lives for gold. We must march south and burn down their house of lies."
 can_use_tower_of_london_tt: "We can now use the §YTower of London§! great project."
 spy_network_for_soldiers_killed_enabled_tt: "Gain §Y+1§! Spy Network against a country you won a battle against for every §Y1000 soldiers§! killed."
 mop_londra_north_series_title: "The Purse of the Revolution"
 mop_londra_north_series_desc: "Wintanceastre gave orders, but Lundenwic counted the coin. The Guilds here hoarded the wealth of the Channel while the shires bled. We shall seize their ledgers and expand their docks. The gold of the Thames will no longer line the pockets of the elites; it will buy the black powder that liberates Europe."
 integrated_commune_irish_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YIrish§! culture will grant us §G+10§! Global Settler Increase if they have at least §Y300§! total development."
 mop_ireland_north_series_title: "Shatter the High King"
 mop_ireland_north_series_desc: "The Ruirech bow to Tara. The peasants bow to the Ruirech. It is a pyramid of parasites built on the backs of the poor. We shall cross the Irish Sea and prove that no man stands higher than his brothers."
 mop_pale_north_series_title: "Weaponize the Irish"
 mop_pale_north_series_desc: "The Irish have a natural talent for resisting authority. We must refine this instinct into a science. Expand the local infrastructure to support the mass training of professional saboteurs."
