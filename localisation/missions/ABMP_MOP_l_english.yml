 if_we_complete_this_mission_by_conquering_them_tt: "If we completed this mission through direct conquest:"
 mop_wallachia_negate_ccr_penalties_tt: "The §Oinsane coring cost penalty§! will be negated in §YWallachian§! provinces that we have a §Ypermanent claim§! on.\n§g(Coring will complete at §G14.3%§! progress, or later if you have modifiers which decrease the Core Creation Cost.)§!"
