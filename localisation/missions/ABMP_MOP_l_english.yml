l_english:
 mop_win_civil_war_title: "Crush the Boieri"
 mop_win_civil_war_desc: "$TODO$"
 no_coring_penalty_in_perma_claim_provinces: "The insane core creation cost penalty will be §Gnegated§! in provinces we have a §Ypermanent claim§! on until the end of the game."
 mop_cossack_relations_title: "Courting the Steppe"
 mop_cossack_relations_desc: "$TODO$"
 improved_relations_with_zaz_tt: "@ZAZ §Y[ZAZ.GetName]§! has an §YImproved Relations§! value of §G+100§! with us."
 if_we_allied_with_zaz_tt: "If we allied with @ZAZ §Y[ZAZ.GetName]§!:"
 if_we_improved_relations_with_zaz_tt: "If we improved relations with @ZAZ §Y[ZAZ.GetName]§!:"
 if_zaz_no_longer_exists_and_we_conquered_zaz_tt: "If @ZAZ §Y[ZAZ.GetName]§! no longer exists and we conquered their starting provinces:"
 mop_deepen_cossack_ties_title: "Deepen Cossack Ties"
 mop_deepen_cossack_ties_desc: "The steppe is a dangerous borderland, and neither the Sfatul Tarii nor the Zaporizhian Host can stand alone. Surrounded by boyar princedoms and the hungry gaze of the Horde, we must bind ourselves to the Cossacks through shared trust and purpose. They will guard the frontier, and we will see that their supply lines never run dry."
 zaz_will_be_released_again_lmao_tt: "@ZAZ §Y[ZAZ.GetName]§! will be released."
 so_as_long_as_zaz_remains_our_subject_tt: "§gThis modifier will be active as long as @ZAZ §Y[ZAZ.GetName]§! or @HTM §Y[HTM.GetName]§! are our subjects.§!"
 mop_expand_the_host_anti_confusion_trigger_tt: "§gNote that @ZAZ §Y[ZAZ.GetName]§! needs to own these provinces, §RNOT YOU§!.§!"
 mop_western_ukraine_title: "Unleash the Host"
 mop_western_ukraine_desc: "In the lands of Ruthenia, our merchants are stripped and hanged from the gates, our pilgrims robbed, our envoys mocked as serfs who forgot their place. The boyars preach that Moldavians are no better than beasts, fit only for the lash. Every caravan that crosses their borders is bled dry by tolls and extortion.\n\nWe have pleaded for peace and received only corpses in return. So be it. Zaporizhia shall have free rein to pacify the western marches. Let the boyars learn the price of their hatred."
 mop_enclave_in_kiev_tt: "We will take control of §Y[280.GetName]§! and the surrounding area and establish a commune."
 mop_secure_crimea_title: "Secure the Black Sea"
 mop_secure_crimea_desc: "The Golden Horde still festers upon the steppe, raiding our frontiers and chaining free men for the slave markets of Azov. So long as they endure, neither the communes nor the Host will know peace. We must strike south, shatter the Horde’s hold on the coast, and seize their port before another generation is sold into bondage."
 azov_commune_tt: "We will take control of §Y[286.GetName]§! and the surrounding area and establish a commune."
 abolitionists_ban_black_sea_slave_tt: "The Abolitionists will see to it that the Black Sea slave trade is abolished. As a result, §YSlaves§! will no longer be produced in §Y[286.GetName]§!."
 mop_develop_kiev_title: "Kiev the Great"
 mop_develop_kiev_desc: "Kyiv must become the beating heart of our northern trade and the surest sign of our good order in Ruthenia. Expand its streets and storehouses, strengthen its councils, and endow the Kyievo-Pecherska Lavra so that faith and craft flourish side by side."
 mop_march_to_sarai_title: "March to Sarai"
 mop_march_to_sarai_desc: "The Horde’s capital has long been the beating heart of raids and slave markets that torment our lands. With Azov secured and the Host at our side, we can cut the head from the beast."
 astrakhan_commune_tt: "We will take control of §Y[464.GetName]§! and the surrounding area and establish a commune."
 mop_east_ukraine_title: "Seize the Left Bank"
 mop_east_ukraine_desc: "The western marches are quieted; now the Host must ride across the Dnieper. Sloboda Ukraine, the Left Bank, and Chernihiv are the keystone of Ruthenia’s heartland. With our backing and their banners, Zaporizhia will break the boyar cordon, bind the frontier to our trade, and carry Moldavian law to the far bank."
 conssack_conquest_cb_enabled_tt: "@HTM §Y[HTM.GetName]§! will unlock the §YCossack Conquest§! casus belli, which allows them to attack neighboring countries in the regions of the §YPontic Steppe§!, the §YUrals§!, §YCentral Asia§!, §YWest Siberia§!, §YEast Siberia§!, §YMongolia§!, and §YManchuria§!.\n§GWe can use this casus belli against their neighbors on their behalf§!."
 mop_proclaim_the_hetmanate_title: "Rise of the Hetmanate"
 mop_proclaim_the_hetmanate_desc: "From a band of free riders on the Lower Dnieper to the stewards of Ruthenia and the tamers of the southern steppes — our Cossack brothers have risen beside us in triumph. Together we shattered the Golden Horde’s yoke, humbled the proud Ruthenian princes, and turned the wild frontier into a bastion of liberty and discipline. Now, as we proclaim the Hetmanate, the Host stands as a sovereign arm of our League — a living testament to the power of common men who would not bow."
 cossack_protectorate_tt: "§gA §YCossack Protectorate§! is a very loyal subject that can fight its own wars. Although it doesn't give you any vassal income, it gives you plenty of §Ymanpower§!, §Yforce limit§!, and §Yunique bonuses§! to your military depending on how much total development it has.§!"
 mop_wallachia_title: "[mop_wallachia_title_loc]"
 mop_wallachia_desc: "[mop_wallachia_desc_loc]"
 if_bogdan_razesul_is_ruling_tt: "If §VBogdan Razesul§! is ruling §Y[Root.GetName]§!:"
 if_bogdan_razesul_isnt_ruling_tt: "If §VBogdan Razesul§! isn't ruling §Y[Root.GetName]§!:"
 if_the_butcher_has_already_purged_the_ten_houses_tt: "If the Butcher of Tirgoviste has already purged the Ten Houses of Wallachia:"
 if_the_butcher_hasnt_already_purged_the_ten_houses_tt: "If the Butcher of Tirgoviste hasn't already purged the Ten Houses of Wallachia:"
 if_bulgaria_is_our_rival_tt: "If @BUL [BUL.GetName] is our rival, we will gain:"
 mop_liberate_dobruja_title: "Liberate Dobruja"
 mop_liberate_dobruja_desc: "For nearly a millennium, the Bulgar yoke has weighed upon our people. Their recent war against the Romans has left them overextended, their armies drained. An opportunity to settle old scores and secure our future now presents itself. We must strike across the Danube and liberate our kin in Dobruja."
 mop_liberate_transylvania_title: "Liberate Transylvania"
 mop_liberate_transylvania_desc: "For centuries, the Vlachs have been the subject of heathens, but this ends now. We must liberate our kin in Transylvania from the oppressive yoke of the Magyar invaders before they regain their strength and seek to conquer [Root.GetName] once more."
 mop_vlach_emancipation_title: "Emancipation of the Vlachs"
 mop_vlach_emancipation_desc: "Wallachia, Transylvania, Dobruja, and Moldavia now stand free of the yoke of the boieri. From the Carpathians to the Black Sea, the fields belong to those who till them, and Sfatul Tarii speaks for all our kin. Let the world know the peasants of Dacia are one people: we bind our communes into a single cause and raise a new banner over the mountains and the Danube."
 tuc_unlock_new_renames_tt: "Unlock new country names to rename yourself to in the §YRename Our Country§! event. The first rename is free."
 unlock_dacian_commune_reform_tt: "We will replace the §YMoldavian Commune§! Tier 1 government reform with the more powerful §YDacian Commune§! reform"
 ruler_has_protector_of_the_little_folk_personality_tt: "If our ruler has the §YProtector of the Little Folk§! personality trait:"
 ruler_doesnt_have_protector_of_the_little_folk_personality_tt: "If our ruler doesn't have the §YProtector of the Little Folk§! personality trait:"
 mop_arm_the_bulgar_peasants_title: "Arm the Bulgar Peasants"
 mop_arm_the_bulgar_peasants_desc: "Our whispers have turned to oaths, and oaths now need steel. The Bulgarian villages have risen in secret, hammering ploughshares into pikes and hiding powder beneath their granaries. Our agents cross the Danube under night, smuggling coin and arms through the monasteries and wine caravans. Let them take what they need from the boyars’ own purses—those riches will soon return to the people one way or another."
 mop_no_tutorial_mission_target_tt: "Use the §YSupport Rebels§! covert action to support §YPeasant Rebels§! on a country that meets two conditions:\n1. Owns §YBulgarian§! provinces in the §YBalkans§!.\n2. Owns at least one province §Yanywhere§! with the §YRadicalized Peasants§! modifier.\n\n§gIf the target lacks the modifier, use the §YIncite Peasants§! covert action to apply it.§!\n\n§gTip: Use the Trade Mapmode to see which province have the modifier. Look for this icon: £radicalized_peasantry£§!"
 is_supporting_peasant_rebels_against_target_tt: "We are supporting §YPEASANT§! rebels against §Y[mop_peasant_subject_tutorial_mission_target.GetName]§!"
 mop_robbed_target_tt: "§gOur agents intercept supply caravans and extort local magnates loyal to the oppressor, seizing §Y100¤§! to arm the Bulgarian communes.§!"
 get_ready_to_invade_with_peasants_tt: "§gMonitor the rebel progress in the §YDiplomacy§! window.\n\nThe §YGreat Peasant Uprising§! Casus Belli unlocks when §YPeasant Rebels§! reach a specific progress threshold. Higher §YRebel Support Efficiency§! lowers this threshold.\n\nFormula:\n§O100% - (Rebel Support Efficiency / 10)§!\n\nBased on your current efficiency, the Casus Belli against the target will unlock at:\n§Y[This.required_progress_for_early_great_peasant_uprising_cb.GetValue]% Progress§!\n\n§RWARNING: If the rebels rise up and are destroyed before you declare war, you must find a new target or wait 10 years to restart the process with the current target!§!§!"
 mop_war_for_the_bulgars_title: "War for the Bulgars"
 mop_war_for_the_bulgars_desc: "The spark has caught; the Bulgar villages now stand on the edge of open revolt. Our agents have armed them, our whispers have turned to war cries, and the boyars now beg for mercy."
 some_of_the_bulgars_join_our_ranks_tt: "§gSome of the Bulgarian peasants join our ranks!§!"
 mop_liberate_the_bulgars_title: "Liberate the Bulgars"
 mop_liberate_the_bulgars_desc: "We have armed the villages and marched beneath the banner of revolt; now we must see the work finished. The Bulgar peasants have cast down their lords with our aid, and look to us as guarantors of their freedom."
 mop_liberate_the_bulgars_subject_trigger_tt: "@[mop_peasant_subject_tutorial_mission_target.GetTag] §Y[mop_peasant_subject_tutorial_mission_target.GetName]§! is either:\n£allied_commune£ An §YAllied Commune§! subject of ours.\n£sister_commune£ A §YSister Commune§! subject of ours.\n£integrated_commune£ An §YIntegrated Commune§! subject of ours."
 mop_liberate_the_bulgars_BUL_core_on_all_bulgarian_provinces_tt: "@BUL §Y[BUL.GetName]§! will gain a core on all §YBulgarian§! provinces in the §YBalkans§!"
 mop_crush_the_magyars_title: "Crush the Magyars"
 mop_crush_the_magyars_desc: "The Magyar yoke has oppressed our people for centuries. Though we have driven them from Transylvania, the serpent's head remains. So long as they hold the Pannonian Plain, they will plot their vengeance. We must crush them utterly before they can strike again."
 mop_carpathian_fortifications_title: "The Gates of Carpathia"
 mop_carpathian_fortifications_desc: "Our brethren in Transylvania are free, but the Magyar threat remains. The Carpathian Mountains, our ancestral shield, must be forged into an unbreakable wall. By fortifying the crucial mountain passes, we will transform them into gates of steel, locking the region against any invader. Transylvania will become an impenetrable bastion, a graveyard for any army foolish enough to test its strength."
 mop_seal_the_carpathians_title: "Seal the Carpathians"
 mop_seal_the_carpathians_desc: "With the Magyars shattered, our dominion over the Pannonian Basin is nearly complete. A new vulnerability has been exposed, however, along the western mountain passes. The German princes and the Polish crown watch our ascent with avarice. Our nation's security cannot be guaranteed while these gateways remain in foreign hands. We must seize the lands of Transdanubia, Slovakia, and Moravia to establish an unbreachable frontier, turning the Carpathians into the impenetrable spine of our kingdom."
 mop_carpathia_cultural_hegemon_title: "An Exemplary Society"
 mop_carpathia_cultural_hegemon_desc: "The Carpathian Basin still bears the marks of the old Magyar clans: scattered settlements, tribal strongholds, and lands left fallow by the swords of wayward lords. If we are to prove the strength of our communal order, then we must do more than conquer it. We must transform it.\n\nEvery valley must be raised to the standard of our heartland, every town strengthened and enriched, every people brought into the Romanian cultural fold. The plains must bustle with trade and craft, the passes must shine with fortified communes, and Pest must be rebuilt as the crowning proof of our achievement—a city to rival Paris or Prague."
 mop_recover_from_civil_war_title: "Recover From the Civil War"
 mop_recover_from_civil_war_desc: "Our victory has saved the land, but Moldavia still bleeds. Villages lie in ash, fields bear the scars of marching hosts, and the people mourn sons and fathers lost in the struggle. To restore the strength of the communes, we must bring stability back to the realm, clear the devastation from our heartlands, and raise a church in [Root.Capital.GetCapitalName] to honor the fallen. Only when the wounds of the civil war are tended will Moldavia stand whole once more."
 mop_rebuild_wallachia_title: "Rebuild Wallachia"
 mop_rebuild_wallachia_desc: "The fires of conquest and the Butcher’s cruelty left Wallachia battered, fearful, and unsure of our intent. Its towns were scarred, its fields plundered, and its people caught between tyrants and uprisings. Now that the dust has settled, it falls to us to prove that we did not cross the Olt as ravagers, but as liberators.\n\nWe must cleanse the last traces of devastation, restore the markets of Tirgoviste, repair the roads and guildhalls, and raise every Wallachian commune to prosperity. Only by rebuilding what was broken, brick by brick, can we show the Wallachian people that the peasant republic seeks not dominion, but the flourishing of all Vlachs beneath a just and common banner."
 control_of_trade_to_black_sea_desc: "We Control the Flow of Trade Into the Black Sea"
 mop_the_gates_of_the_danube_title: "Gates of the Danube"
 mop_the_gates_of_the_danube_desc: "With Basarabia and Dobruja in our hands, we stand astride the lower Danube. If we raise proper docks, shipyards, markets, and forts at Kilia and along the coast, we can turn these river mouths into true gates—counting every hull that passes and taxing every bale of grain and timber bound for the Black Sea. Let the merchants grumble; they will still come, for there is no cheaper road to the sea than the river we now command."
 mop_mare_dacia_title: "Mare Dacia"
 mop_mare_dacia_desc: "The Vlach lands are united under a single banner. The work of conquest is done; the work of construction begins. We must now forge these disparate regions into a single, thriving, and interconnected heartland. Every road paved, every workshop built, and every field developed strengthens the whole. This is the vision of Mare Dacia: a powerful and prosperous nation, the solid foundation upon which all our future ambitions will be built."
 mop_the_black_sea_gate_title: "The Black Sea Gate"
 mop_the_black_sea_gate_desc: "With Crimea secured and the mouths of the Danube under our watch, only one opening remains for the trade of the northern steppes into the Black Sea: Azov. If we are to master this sea, we must raise Azov into a true gate—fortified, well-provisioned, and busy with docks, shipyards, and markets. Let every caravan and river barge that seeks the Black Sea first pass beneath our guns and pay its due."
 mop_the_caspian_gate_title: "The Caspian Gate"
 mop_the_caspian_gate_desc: "Beyond the lower Volga lies Astrakhan, the key by which the riches of the steppe and the East pour into the Caspian. Having marched to Sarai and secured our hold on the Black Sea, we must now do the same here: strengthen Astrakhan’s walls, expand its quays, and turn it into a bustling mart where all trade between the steppe and the southern seas can be watched and weighed. When both Azov and Astrakhan stand as our gates, few routes will remain that do not pass through our hands."
 mop_bulgars_are_free_title: "The Bulgars Are Free"
 mop_bulgars_are_free_desc: "Across the valleys and mountains of the Balkans, the Bulgarian peasantry has long laboured under crowns not their own. By bringing every Bulgarian village in the region under the protection of our federation—either as direct communes or as allied communes, we can finally say that the Bulgars are no longer subjects of kings, but comrades of the Communes."
 mop_control_all_bulgarian_balkan_provinces_tt: "All the provinces of §YBulgarian§! culture in the §YBalkans§! are owned by us or a £allied_commune£§YCommune Subject§!."
 bulgarian_integrated_commune_bonus_tt: "£integrated_commune£§YIntegrated Commune§!£integrated_commune£ subjects of §YBulgarian§! culture will grant us §G-5.0%§! Shock Damage Received if they have over §Y300§! total development."
 mop_control_all_thrace_provinces_tt: "All provinces in the §YThrace§! area are either controlled by us, a £allied_commune£§YCommune Subject§!, or a non-sovereign subject of our £allied_commune£§YCommune Subject§!."
 if_constantinople_is_owned_by_commune_subject_tt: "If §Y[151.GetName]§! is owned by a £allied_commune£§YCommune Subject§!:"
 mop_liberate_thrace_title: "Liberate Thrace"
 mop_liberate_thrace_desc: "The plains and coasts of Thrace have long been trampled by imperial armies and ruled from the gilded halls of [151.GetName]. If our revolution is to endure, the straits and the city at their heart must no longer answer to emperors or stratocrats, but to the communes themselves. By bringing every village and town in Thrace under the protection of our federation, we will free the peasants of the region and seize the City of the World’s Desire for the common cause."
 mop_liberate_the_serbs_title: "Liberate the Serbs"
 mop_liberate_the_serbs_desc: "From the Drina to the Morava, the Serbian peasantry toils beneath crowns and warlords who claim their labor and their land. Our allies among the Bulgars now stand free; the time has come to carry the banner of liberation westward. By breaking the chains of the Serbian villagers and bringing their communes into our federation, we will forge a solid wall of free peasants across the central Balkans and deny the monarchs a base from which to threaten our revolution."
 mop_conquer_ragusa_title: "Seize Dubrovnik"
 mop_conquer_ragusa_desc: "The proud port of Dubrovnik stands as an oligarchic enclave on the Adriatic, ruled by merchant families who grow rich off the toil of Balkan peasants and the trade that passes through our lands. As long as this patrician republic endures, Venice and the Italian princes will have a friendly harbor from which to threaten our communes. By taking Dubrovnik into our hands and reorganizing it under communal principles, we will secure a vital Adriatic outpost, safeguard the trade of the Balkans, and open a forward base for future operations against the tyrants across the sea."
 mop_liberate_the_serbs_tt: "All provinces of §YSerbian§! culture in the §YBalkans§! are either controlled by us, a £allied_commune£§YCommune Subject§!, or a non-sovereign subject of our £allied_commune£§YCommune Subject§!."
 if_we_have_completed_naval_ideas_tt: "If we have completed §YNaval Ideas§!:"
 mop_liberate_the_greeks_title: "Liberate the Greeks"
 mop_liberate_the_greeks_desc: "The fall of the imperial city was only the first step. From the hills of Hellas to the harbors of the Aegean, Greek peasants, sailors, and craftsmen still bend the knee to princes, stratocrats, and merchant elites who claim the legacy of empires long dead. If our victory in Thrace is to mean anything, we must carry the revolution southward and across the islands, breaking the last chains that bind the Greek people."
 mop_liberate_the_greeks_tt: "All provinces of §YGreek§! culture in the §YBalkans§! or §YAegean Archipelago§! are either controlled by us, a £allied_commune£§YCommune Subject§!, or a non-sovereign subject of our £allied_commune£§YCommune Subject§!."
 mop_great_port_of_dubrovnik_title: "The Great Port of Dubrovnik"
 mop_great_port_of_dubrovnik_desc: "We have seized Dubrovnik from its patrician masters, but for now it remains only a promising harbor on the Adriatic. If this city is to become the spearhead of our maritime ambitions, we must pour our strength into its docks, shipyards, walls, and markets. By expanding its infrastructure, strengthening its fortifications, and restoring the Walls of Ston, we can transform Dubrovnik into the foremost commune-port of the Adriatic: an arsenal, marketplace, and bastion from which to defy the oligarchs of Venice and the princes beyond the sea."
 if_albania_is_an_allied_commune_tt: "If @ALB §Y[ALB.GetName]§! is our £allied_commune£§YAllied Commune§! subject:"
 albania_integrated_commune_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YAlbanian§! culture will grant us §G+1§! Land Leader Shock if they have more than §Y150§! total development."
 mop_protect_the_albanians_title: "Protect the Albanians"
 mop_protect_the_albanians_desc: "Between the mountains and the sea, the Albanian villages stand exposed to the ambitions of kings, beys, and merchants alike. Though small in number, their highland communes and coastal towns sit astride the routes between Greece, Illyria, and Italy. If we secure Albania under our protection, whether directly or through loyal communes, we will not only shield its peasants from conquest, but also close another door through which our enemies might strike at the Balkans."
 mop_liberate_illyria_title: "Liberate Illyria"
 mop_liberate_illyria_desc: "From the valleys of Bosnia to the coasts of Dalmatia and the rivers of Croatia and Slavonia, the lands once called Illyria form the western wall of the Balkans. For centuries, kings, bans, and foreign republics have carved these provinces into marches and borderlands, treating their peasants as little more than fodder for their wars. Now that Dubrovnik stands as a commune-port of our federation, we are in a position to sweep inland and bind these scattered peoples into a belt of free communes."
 serbian_integrated_commune_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YSerbian§! culture will grant us §G-5.0%§! Aggressive Expansion Impact if they have more than §Y250§! total development."
 unlock_ILR_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @ILR §YThe Illyrian Communes§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YSouth Slavic§! culture. Once @ILR §YThe Illyrian Communes§! is established, you will be able to transfer §YSouth Slavic§! provinces from your other £integrated_commune£§YIntegrated Communes§! to @ILR §YThe Illyrian Communes§!."
 croatian_integrated_commune_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YCroatian§! culture will grant us §G-10.0%§! Cavalry Cost if they have more than §Y250§! total development."
 bosnian_integrated_commune_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YBosnian§! culture will grant us §G+5.0%§! Artillery Combat Ability if they have more than §Y200§! total development."
 mop_liberate_the_balkans_title: "Liberate the Balkans"
 mop_liberate_the_balkans_desc: "From the Carpathians to the Adriatic, the peoples of the Balkans have long suffered under feudal oppression, foreign dynasties and the whims of distant courts. Our communes have shattered the old order in our own lands; now we must finish the work we began and tear down every last tyrant from the Danube to the Aegean. Only when every village, town and city in the Balkans stands free will our struggle be complete."
 mop_dismantle_the_stratocracy_title: "Dismantle the Stratocracy"
 mop_dismantle_the_stratocracy_desc: "Across the Bosphorus lies the militarized state of Nicaea, a fortress-kingdom ruled by a hardened caste of officers who command through discipline and fear. Their citadels dominate the Asian shore of the strait, their galleys guard its currents, and their generals dream of restoring the old order by force. If we are to secure the Bosphorus and ensure that its waters serve the communes rather than a warlord elite, the stratocracy must be broken."
 mop_gates_of_the_bosprous_title: "Gates of the Bosporus"
 mop_gates_of_the_bosprous_desc: "We have torn down the stratocracy on the Asian shore and brought Chalcedon into the fold, but to truly command the Bosporus we must do more than merely hold its banks. Stanboli and Chalcedon must be remade into twin gates of stone and timber: deep harbors for our fleets, fortified batteries to command the currents, and great communal customs houses to tally every cargo that dares pass between the Black Sea and the Mediterranean.\n\nOnce the docks are expanded, the markets organized and the fortifications raised on both sides of the strait, the Bosporus will cease to be a vulnerability and become the beating heart of our trade empire. Let merchants and princes alike learn that passage through these waters is granted only by the will of the communes."
 control_of_the_bosporus_desc: "We control the Bosporus."
 unlock_HLE_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @HLE §YThe Hellenic Communes§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YGreek§! culture. Once @HLE §YThe Hellenic Communes§! is established, you will be able to transfer §YGreek§! provinces from your other £integrated_commune£§YIntegrated Communes§! to @HLE §YThe Hellenic Communes§!."
 greek_integrated_commune_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YGreek§! culture will grant us §G-10.0%§! Great Project Upgrade Cost if they have more than §Y300§! total development."
 mop_free_anatolia_title: "Free Anatolia"
 mop_free_anatolia_desc: "Anatolia remains divided between beyliks, emirs, and ancient rivalries. To secure lasting stability, we must end the rule of tyrants throughout the peninsula and place its many peoples under the protection of the communes. When Anatolia is fully liberated, its councils can finally stand beside ours as partners in a shared future."
 unlock_RUM_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @RUM §YThe Turk Communes§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YTurkish§! culture. Once @RUM §YThe Turk Communes§! is established, you will be able to transfer §YTurkish§! provinces from your other £integrated_commune£§YIntegrated Communes§! to @RUM §YThe Turk Communes§!."
 unlock_ARM_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @ARM §YThe Armenian Communes§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YArmenian§! culture. Once @ARM §YThe Armenian Communes§! is established, you will be able to transfer §YArmenian§! provinces from your other £integrated_commune£§YIntegrated Communes§! to @ARM §YThe Armenian Communes§!."
 integrated_commune_turkish_orthodox_bonus_tt: "§YOrthodox§! £integrated_commune£§YIntegrated Commune§! subjects of §YTurkish§! culture will grant us §G+1.00§! Tolerance of the True Faith if they have more than §Y300§! total development."
 integrated_commune_turkish_muslim_bonus_tt: "§YMuslim§! £integrated_commune£§YIntegrated Commune§! subjects of §YTurkish§! culture will grant us §G+1.00§! Tolerance of Heathens if they have more than §Y300§! total development."
 integrated_commune_armenian_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YArmenian§! culture will grant us §G+1.00§! Tolerance of Heretics if they have more than §Y200§! total development."
 mop_free_the_lechites_title: "Free the Lechites"
 mop_free_the_lechites_desc: "From Kraków to the Vistula and the Oder, the Lechitic lands are broken into petty princedoms: Polan kings, Silesian dukes, Vistulan warlords, Mazovian and Lendian princes, all ruling over the same weary peasants in the name of rival gods. If our commune is to bring true freedom to these peoples, we must sweep aside their princelings and bind every Lechitic land into a federation of councils."
 unlock_PLC_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @PLC §YThe Commonwealth§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YArmenian§! culture. Once @PLC §YThe Commonwealth§! is established, you will be able to transfer §YPolan§!, §YSilesian§!, §YVistulan§!, §YLendian§!, §YMazovian§!, and §YPolish§! provinces from your other £integrated_commune£§YIntegrated Communes§! to @PLC §YThe Commonwealth§!."
 integrated_commune_polish_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YPolan§!, §YSilesian§!, §YVistulan§!, §YLendian§!, §YMazovian§!, or §YPolish§! culture will grant us §G+5.0%§! Cavalry Combat Ability if they have more than §Y300§! total development."
 mop_destroy_the_princes_title: "Destroy the Princes"
 mop_destroy_the_princes_desc: "The lands of Rus' groan under a patchwork of petty crowns and self-styled grand princes, each clinging to his throne while the peasantry bleeds. If our revolution is to be secure, the princely order itself must be swept away. By seizing Moscova and ensuring that no East Slavic monarchy in Europe remains outside our commune system, we will prove that crowns and dynasties can be broken, but the will of the people endures."
 no_east_slavic_monarchies_europe_tt: "There are no §YEast Slavic§! monarchies in §YEurope§!, unless they are subjects of £allied_commune£§YCommune Subject§!."
 every_east_slavic_commune_subject_ld_tt: "Every £allied_commune£§YCommune Subject§! of §YEast Slavic§! culture will lose §G-20.0%§! Liberty Desire."
 mop_fortify_moscow_title: "Fortify Moscova"
 mop_fortify_moscow_desc: "Having torn down the princes’ rule in Moscova, we must now ensure that no new tyrant can so easily seize it again. By expanding the Kremlin, lining the city with new redoubts and barracks, and turning Moscova into a vast armoury and depot for the communes’ armies, we will forge a bulwark that can weather any storm from steppe or West alike."
 mop_grand_captain_bonus_tt: "§YGrand Captain§! advisors now grant §G-5.0%§! to Reinforce Cost per skill level."
 mop_saltworks_of_cracovia_title: "Saltworks of Cracovia"
 mop_saltworks_of_cracovia_desc: "We need a strong economy to support our armies. Krakow sits on valuable salt deposits. By developing the city and its infrastructure, we can turn these mines into the republic's primary treasury."
 mop_completed_great_cracovia_mission_tt: "Completed Mission §YSaltworks of Cracovia§!."
 unlock_krakow_salt_mine_bonus_tt: "We will §Gunlock§! the Production Efficiency bonus for the §YWieliczka Salt Mine§!"
 enable_establish_consulate_po_tt: "Unlock the ability to create §YConsulate§! subjects.\n\n§g§YConsulates§! are unique subjects that provide yearly £allmana£ §GTribute§! and §G+5.0%§! Trade Steering instead of tax.\n\nStrategically, they act as forward operating bases. They spread §YRadicalized Peasantry§! to neighbors, allowing you to establish £integrated_commune£§YCommune Subjects§! in distant regions.\n\n§YHow to establish a Consulate:§!\n1. Target a country on a §Ydifferent continent§! with §Y125§! or less Total Development.\n2. Declare war using §YANY§! Trade Casus Belli (e.g., §YTrade Conflict§!, §YTrade Dispute§!, or §YTrade League Dispute§!).\n3. Select the §YEstablish Consulate§! peace offer.§!"
 mop_urals_title: "Secure the Urals"
 mop_urals_desc: "The open steppe is a highway for reactionaries and raiders. To permanently secure the revolution in the East, we must push our frontier to the natural barrier of the Ural Mountains. We will break the last remnants of the Khanates and transform the city of Kazan from a seat of Khans into a fortress of the people."
 mop_urals_trigger_tt: "Every province in the §YUral§! region is owned by us, our £allied_commune£§YCommune Subject§!, a non-sovereign subject of our £allied_commune£§YCommune Subject§!, or our @HTM §YCossack Protectorate§!."
 mop_unlock_krepost_system_tt: "Every province owned by us or a subject with a §Yfortification building§!, and all built in the future by us or a subject in the following regions:\n- §YPontic Steppe§!\n- §YUral§!\n- §YCentral Asia§!\n- §YWest Siberia§!\n- §YEast Siberia§!\n- §YMongolia§!\n- §YManchuria§!\n- §YAlania Area§!\n- §YCumania Area§!\nwill receive:"
 integrated_commune_tartar_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YTartar§! culture will grant us §G+5.0%§! Shock Damage if they have more than §Y250§! total development."
 mop_kazan_title: "The Eastern Bastion"
 mop_kazan_desc: "Cazan is the keystone of our domination over the steppes. To maintain our grip on the vast frontier, we must transform the city into a self-sufficient military metropolis. The Kremlin must be expanded, the population drilled, and the infrastructure built to sustain a massive army thousands of miles from the capital."
 mop_russia_title: "Sloboda"
 mop_russia_desc: "The concept of the 'Sloboda' (the free settlement) must be expanded from a frontier curiosity into a national reality. We must drive out the last of the Boyars and Oligarchs from the Russian heartland and transform the entire region into a single, vast union of free communities."
 mop_russia_trigger_tt: "Every province in the §YRussia§! region is owned by us, our £allied_commune£§YCommune Subject§!, a non-sovereign subject of our £allied_commune£§YCommune Subject§!, or our @HTM §YCossack Protectorate§!."
 unlock_UKR_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @UKR §YSloboda Rus§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YEast Slavic§! culture. Once @UKR §YSloboda Rus§! is established, you will be able to transfer §YEast Slavic§! or §YUgric§! provinces from your other £integrated_commune£§YIntegrated Communes§! to @UKR §YSloboda Rus§!."
 integrated_commune_east_slavic_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YEast Slavic§! culture will grant us §G-10.0%§! Infantry Cost if they have more than §Y400§! total development."
 mop_arhanghel_title: "Gateway to the White Sea"
 mop_arhanghel_desc: "The Baltic is a lake of enemies, strangled by tolls and blockades. To free our trade, we must kick open the back door to the Atlantic. Arhanghel must be expanded from a frozen outpost into a world-class harbor, capable of hosting the merchant fleets of the Dutch and English regardless of the winter freeze."
 mop_arctic_provinces_dock_bonus_tt: "Constructing §YDock§! or §YDrydock§! buildings in §Yarctic§! provinces §Gnegates§! all the penalties of the arctic climate. This also applies to our subjects."
 mop_baltic_title: "Secure the Baltic"
 mop_baltic_desc: "The Baltic shores are rich in amber and strategic harbors, yet they remain divided between ancient tribes and foreign crusaders. We must drive out the German orders, seize the key ports of Danzig and Riga, and unite the region into a single, cohesive federation of free communes."
 unlock_BLT_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @BLT §YThe Baltic Communes§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YBaltic§! culture. Once @BLT §YThe Baltic Communes§! is established, you will be able to transfer §YBaltic§! provinces from your other £integrated_commune£§YIntegrated Communes§! to @BLT §YThe Baltic Communes§!."
 integrated_commune_baltic_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YBaltic§! culture will grant us §G+1.00§! Max General Shock if they have more than §Y200§! total development."
 mop_baltic_ports_title: "Dominion of the Baltic"
 mop_baltic_ports_desc: "The twin cities of the Baltic must serve the dual pillars of our Republic: Wealth and Faith. Gdansc shall be forged into an unsinkable fortress of trade, funneling the grain of the Vistula to the world. Riga, the former seat of the Crusades, must be purged of its Latin heresy and consecrated as the spiritual capital of the North."
 control_danzig_and_riga_desc: "Controls the key Baltic ports of Gdansc and Riga."
 mop_central_asia_title: "Taming the Silk Road"
 mop_central_asia_desc: "The fabled cities of the Silk Road—Samarkand, Khiva, Bukhara—are the beating heart of Asian commerce. Yet, they are ruled by petty Khans and tribal warlords. The Hetmanate must ride south to break their power. We will seize the key nodes of the Silk Road and redirect its wealth exclusively towards the Republic."
 mop_central_asia_trigger_tt: "Every province in the §YCentral Asia§! region is owned by us, our £allied_commune£§YCommune Subject§!, a non-sovereign subject of our £allied_commune£§YCommune Subject§!, or our @HTM §YCossack Protectorate§!."
 change_bessarabia_to_silk_tt: "§gMaster weavers from Khiva have been relocated to our heartland to revolutionize our textile industry.§!\n§Y[1756.GetName]§! will now produce §YSilk§!."
 mop_silk_road_infrastructure_title: "The Silk Road Portage"
 mop_silk_road_infrastructure_desc: "The old river route to the Caspian is long dead, but the Republic's ingenuity will build a new one. We must construct a fortified overland highway from the Aral Sea to the Caspian coast, bridging the gap with stone, steel, and logistical precision. Khiva, once an isolated oasis, will become the beating heart of this new trade artery."
 mop_push_into_siberia_title: "Push Beyond the Urals"
 mop_push_into_siberia_desc: "The Grey Horde dominates the southern steppes, blocking the path to the Silk Road, but the vast taiga of the north lies empty and waiting. We must cross the mountains and establish a permanent foothold in the West Siberian basin. The new settlement of Tiumen shall serve as the logistic hub for our pioneers."
 mop_push_into_siberia_tt: "Every province in the §YWest Siberia§! region is owned by us, our £allied_commune£§YCommune Subject§!, a non-sovereign subject of our £allied_commune£§YCommune Subject§!, or our @HTM §YCossack Protectorate§!."
 if_sloboda_rus_is_subject_tt: "If @UKR §YSloboda Rus§! is our £allied_commune£§YCommune Subject§!:"
 mop_mongolia_title: "Pacify the Mongols"
 mop_mongolia_desc: "The Eurasian steppe offers no natural borders, only an endless highway for potential invaders. To stop now is to leave our eastern flank exposed. The frontier must be pushed east until there is nothing left to conquer."
 mop_mongolia_trigger_tt: "Every province in the §YMongolia§! region is owned by us, our £allied_commune£§YCommune Subject§!, a non-sovereign subject of our £allied_commune£§YCommune Subject§!, or our @HTM §YCossack Protectorate§!."
 integrated_commune_mongolian_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of the §YMonoglian§! culture group will grant us §G-5.0%§! Province Warscore Cost if they have more than §Y300§! total development."