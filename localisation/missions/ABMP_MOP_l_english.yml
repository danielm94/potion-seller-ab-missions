 mop_northern_france_northern_series_title: "Topple the Franks"
 mop_northern_france_northern_series_desc: "The Emperor claims a divine mandate from Charlemagne. We have proven, time and again, that kings who claim to speak for the Almighty are nothing but blasphemers. It is time to expose the Empire for the farce it truly is."
 mop_southern_france_northern_series_title: "Liberate the Midi"
 mop_southern_france_northern_series_desc: "We shattered the Emperor, and in his place a power vacuum forms. From Qurtuba, the Sultan's gaze turns northward to claim the spoils. We must win the race for the south and deny him a launch pad into the heart of Europe."
 unlocked_mop_france_series_tt: "§GUnlocks§! the §YFrench§! series of missions."
