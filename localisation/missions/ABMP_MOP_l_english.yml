 mop_scotland_north_series_title: "Shatter the Clans"
 mop_scotland_north_series_desc: "The winds of the north carry the seeds of revolution. The clans and crofters of Scotland have long suffered under distant kings. We shall descend from the isles, shatter the feudal yoke, and turn Edinburgh into a beacon of communal liberty."
 integrated_commune_scottish_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YScottish§! culture will grant us §G+5.0%§! Production Efficiency if they have at least §Y300§! total development."
