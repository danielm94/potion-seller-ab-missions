 unlock_ABO_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @ABO §YThe United Clans§! in one of your £integrated_commune£§YIntegrated Communes§! that has §YScottish§! or §YÆnglish§! primary culture or is located in §YBritain§!. Once @ABO §YThe United Clans§! is established, you will be able to transfer §YScottish§!, §YÆnglish§!, and §YBritain§! region provinces from your other £integrated_commune£§YIntegrated Communes§! to @ABO §YThe United Clans§!."
 unlock_GBR_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @GBR §YCommonwealth of Britania§! in one of your £integrated_commune£§YIntegrated Communes§! that has §YÆnglish§! or §YScottish§! primary culture, or is located in the §YBritain§! region. Once @GBR §YCommonwealth of Britania§! is established, you will be able to transfer provinces matching these criteria from your other £integrated_commune£§YIntegrated Communes§! to @GBR §YCommonwealth of Britania§!."
 mop_unite_britain_north_series_title: "Free Britannia"
 mop_unite_britain_north_series_desc: "The kings of Britain forged their thrones upon the backs of the lowborn, taxing the land bare and drowning each rebellion in blood. No longer. The communes will march across the isles, breaking every banner of noble power until only the free villages remain. Only then will the Britons never be slaves again."
