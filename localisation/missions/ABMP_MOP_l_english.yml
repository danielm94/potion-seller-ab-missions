 every_transylvanian_subject_will_become_orthodox_tt: "Every subject that owns provinces in §YTransylvania§! will become §YOrthodox§!."
 mop_dobruja_negate_ccr_penalties_tt: "The §Oinsane coring cost penalty§! will be negated in §Y[4706.GetName]§! if we have a §Ypermanent claim§! on it.\n§g(Coring will complete at §G14.3%§! progress, or later if you have modifiers which decrease the Core Creation Cost.)§!"
 all_carpathian_subjects_will_become_panonic_tt: "All of our §YCarpathian§! culture subjects will adopt the §YPanonic§! culture. Their country will slowly become §YRomanianized§!. §VThis effect will continue once we integrate them.§!"
 mop_integrate_the_bulgars_title: "Integrate the Bulgars"
 mop_integrate_the_bulgars_desc: "Liberation was merely the first step. While the Bulgarian communes are free from monarchical tyranny, their current status as loose allies leaves them vulnerable to factionalism and counter-revolution. To permanently secure the southern flank, we must bind them to the federal center. We must standardize their administration and bring them fully into the fold, transforming them from autonomous allies into integral components of the Republic."
 mop_integrate_the_bulgars_trigger_tt: "All provinces of §YBulgarian§! culture in the §YBalkans§! are either controlled by us, a £sister_commune£§YSister Commune§!, or an £integrated_commune£§YIntegrated Commune§!.\n\n§gIn order to integrate a £allied_commune£§YCommune Subject§!:\n§Y1.§! Navigate to the §YDiplomacy§! window with the £allied_commune£§YCommune Subject§! selected.\n§Y2.§! Scroll to the bottom until you reach the §YCommune Interactions§!£integrated_commune£  section.\n§Y3.§! Select §YIntegrate Commune§!\n\nYou can easily §Gtrack the progress§! of your £allied_commune£§YCommune Subjects§! by hovering over the §Vmonarch power icons§! (£adm£/£dip£/£mil£) on the §Vtop bar§! while they are being integrated.§!"
 will_be_able_to_integrate_bulgarians_again_immediately_tt: "We will immediately be able to start integrating all £allied_commune£§YCommune Subjects§! that own §YBulgarian§! provinces in the §YBalkans§!."
