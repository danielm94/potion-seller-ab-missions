 unlock_GER_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish the @GER §YGerman Confederation§! in one of your £integrated_commune£§YIntegrated Communes§! that is of §YGermanic§! or §YEast Germanic§! culture. Once the @GER §YGerman Confederation§! is established, you will be able to transfer §YGermanic§! and §YEast Germanic§! provinces, as well as provinces in the §YNorth Germany§! and §YSouth Germany§! regions, from your other £integrated_commune£§YIntegrated Communes§! to the @GER §YGerman Confederation§!."
 germanic_subjects_lose_ld_tt: "All of our §YEast Germanic§! and §YGermanic§! subjects lose §G20§! Liberty Desire and gain §G10§! Trust with us."
 mop_germany_title: "Tochter Aus Elysium"
 mop_germany_desc: "The myriad borders of the German princes have been erased, and with them, the feudal customs that strictly divided this people for a thousand years. Whether the Imperial title still lingers in some distant court matters not; here, on German soil, the old order is dead. A new anthem rises from the Rhine to the Oder, celebrating the spark of divinity found in the common man. Thy magic binds again what custom parted; all men become brothers where the gentle wing of the Republic abides."