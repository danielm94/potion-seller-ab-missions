 mop_lothian_north_series_title: "The Shield of Britannia"
 mop_lothian_north_series_desc: "Liberating the island is one thing; holding it is another. The reactionary fleets of Europe will test our resolve. Edinburg must become the unbreakable shield of Britannia, a fortified port and arsenal to guard the North Sea and ensure the revolution can never be extinguished."
