 mop_france_locked_series_2_1_desc: "You must have completed §YUnify the Peninsula§!, §YLiberate the Lowlands§!, §YShatter the Witan§!, or §YLiberate the North§! to unlock this series of missions."
 mop_france_locked_series_2_2_title: "§g@FRA France: Locked§!"
 mop_france_locked_series_2_2_desc: "You must have completed §YUnify the Peninsula§!, §YLiberate the Lowlands§!, §YShatter the Witan§!, or §YLiberate the North§! to unlock this series of missions."
 orthodox_notre_dame_bonus_tt: "The §YNotre Dame§! great project now grants up to §G+0.5%§! Yearly Patriarch Authority!"
 mop_paris_northern_series_title: "The City of Light"
 mop_paris_northern_series_desc: "Paris is the beating heart of the West. As long as the Latin rite holds sway here, the divine right of kings remains unchallenged. We must claim this metropolis for the true faith. Raise the Orthodox cross above Notre Dame and sanctify the halls of Versailles. Let the world see that God walks with the common man."
 mop_bordeaux_northern_series_title: "Forge Bordeaux"
 mop_bordeaux_northern_series_desc: "Bordeaux sits astride the rivers and sea-roads of Gascogne, a natural arsenal for our armies and a countinghouse for the communes. If we raise its walls, wharves, forges, and drill yards alike, the Gascon musketeers will have powder and pay, and the federation will gain a fortress-port to shield France and project our strength abroad."
 drill_master_fire_damage_buff_tt: "§YDrillmaster§! advisors now grant us §G+2.0%§! Fire Damage per skill level."
 mop_southern_france_southern_series_title: "Liberate the Midi"
 mop_southern_france_southern_series_desc: "The sun-drenched valleys of the south are choked by the grip of petty counts and absentee dukes. From the alpine passes of Savoy to the Atlantic shipyards, the wealth of the land is siphoned off to feed northern decadence. We will storm their mountain strongholds and liberate the vineyards, establishing a chain of communes across Occitania. With the southern flank secured and the resources of the Mediterranean in our hands, the road to Paris lies open."
 mop_northern_france_southern_series_title: "Topple the Franks"
 mop_northern_france_southern_series_desc: "The Emperor claims a divine mandate from Charlemagne. We have proven, time and again, that kings who claim to speak for the Almighty are nothing but blasphemers. It is time to expose the Empire for the farce it truly is."
 mop_france_liberated_southern_series_title: "Le Nouveau Régime"
 mop_france_liberated_southern_series_desc: "The Ancien Régime is a memory. From the vineyards of the south to the docks of Normandy, the estates are dissolved. We have forged a new order in the fires of revolution."
 mop_bordeaux_southern_series_title: "Forge Bordeaux"
 mop_bordeaux_southern_series_desc: "Bordeaux sits astride the rivers and sea-roads of Gascogne, a natural arsenal for our armies and a countinghouse for the communes. If we raise its walls, wharves, forges, and drill yards alike, the Gascon musketeers will have powder and pay, and the federation will gain a fortress-port to shield France and project our strength abroad."
 mop_paris_southern_series_title: "The City of Light"
 mop_paris_southern_series_desc: "Paris is the beating heart of the West. As long as the Latin rite holds sway here, the divine right of kings remains unchallenged. We must claim this metropolis for the true faith. Raise the Orthodox cross above Notre Dame and sanctify the halls of Versailles. Let the world see that God walks with the common man."
