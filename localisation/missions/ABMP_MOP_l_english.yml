 mop_south_iberia_south_series_title: "Purge the Caliphate"
 mop_south_iberia_south_series_desc: "For countless generations, the peoples of Iberia have lived under the heel of foreign dominion, from Phoenicians and Carthaginians to Romans and Vandals. Now, the people languish under the Moorish invaders. Though the Iberians cling to the Latin heresies, they are still children of the Cross, and we cannot stand idly by while the light of God is snuffed out by heathens. Where the knights of the Holy Roman Empire failed, the righteous fury of the free shall succeed. It is our holy and revolutionary duty to purge the Caliphate and end this cycle of occupation once and for all."
 mop_south_iberia_north_series_title: "Purge the Caliphate"
 mop_south_iberia_north_series_desc: "For countless generations, the peoples of Iberia have lived under the heel of foreign dominion, from Phoenicians and Carthaginians to Romans and Vandals. Now, the people languish under the Moorish invaders. Though the Iberians cling to the Latin heresies, they are still children of the Cross, and we cannot stand idly by while the light of God is snuffed out by heathens. Where the knights of the Holy Roman Empire failed, the righteous fury of the free shall succeed. It is our holy and revolutionary duty to purge the Caliphate and end this cycle of occupation once and for all."
 spanish_inquisition_kek_tt: "§gA Hispanic inquisitor unexpectedly joins our court...§!"
 developing_iberian_provinces_gives_tercio_tt: "Developing owned or subject §YChristian§! provinces of §YIberian§! culture in §YIberia§! has a §G5.0%§! chance of recruiting a §YTercio Regiment§! in your capital."
 mop_north_iberia_south_series_title: "Liberate the North"
 mop_north_iberia_south_series_desc: "The fertile south is secured, but the rugged mountains of the north remain under the sway of petty kings and displaced nobles. These lands are home to a proud and martial people who have resisted invaders for centuries. We must march north to harness this spirit, dismantling the feudal structures while integrating their fierce local brotherhoods into the Federation. From the Rock of Gibraltar to the Pyrenees, the peninsula shall be free."
 mop_north_iberia_north_series_title: "Liberate the North"
 mop_north_iberia_north_series_desc: "The northern monarchs are failing to hold back the Andalusian Caliphate. The Federation must cross the Pyrenees to dissolve these obsolete kingdoms. Arming the liberated populace is the only way to halt the Caliph's advance and secure the peninsula's northern frontier."
 mop_iberia_liberated_south_series_title: "Libertad"
 mop_iberia_liberated_south_series_desc: "For the first time in their long and troubled history, the peoples of Iberia stand free of caliph and king alike. The nobles have fled, the courts lie silent, and every realm in from Vigo to Valencia is governed by its own councils. What once was a battleground of empires is now a federation of communes, restored to its rightful stewards: the peasants who till the soil."
 mop_iberia_liberated_north_series_title: "Libertad"
 mop_iberia_liberated_north_series_desc: "For the first time in their long and troubled history, the peoples of Iberia stand free of caliph and king alike. The nobles have fled, the courts lie silent, and every realm in from Vigo to Valencia is governed by its own councils. What once was a battleground of empires is now a federation of communes, restored to its rightful stewards: the peasants who till the soil."
 unlock_IBE_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @IBE §YLos Comuneros§! in one of your £integrated_commune£§YIntegrated Communes§! that has a primary culture in the §YIberian§! group or is located in the §YIberia§! region. Once @IBE §YLos Comuneros§! is established, you will be able to transfer provinces matching these criteria from your other £integrated_commune£§YIntegrated Communes§! to @IBE §YLos Comuneros§!."
 mop_granada_south_series_title: "The Jewel of Andalusia"
 mop_granada_south_series_desc: "The Alhambra complex offers a substantial foundation for regional governance. We should restore the structure and expand the surrounding city's infrastructure to support a high density of trade and administration. Consecrating the site to the Orthodox faith and modernizing its facilities will transform the former palace into an efficient administrative center for the region."
 mop_granada_north_series_title: "The Jewel of Andalusia"
 mop_granada_north_series_desc: "The Alhambra complex offers a substantial foundation for regional governance. We should restore the structure and expand the surrounding city's infrastructure to support a high density of trade and administration. Consecrating the site to the Orthodox faith and modernizing its facilities will transform the former palace into an efficient administrative center for the region."
 negate_revolutionary_mandate_improve_relations_penalty_tt: "§GNegates§! the Improve Relations Modifier penalty of the §ORevolutionary Mandate§! §YRazesi§! estate privilege."
 mop_barcelona_south_series_title: "The Consulate of the Sea"
 mop_barcelona_south_series_desc: "Barcelona competes with the Italian republics for dominance in Mediterranean commerce. Developing the city into a world-class port and industrial hub directs trade value into the federal economy."
 mop_barcelona_north_series_title: "The Consulate of the Sea"
 mop_barcelona_north_series_desc: "Barcelona competes with the Italian republics for dominance in Mediterranean commerce. Developing the city into a world-class port and industrial hub directs trade value into the federal economy."
 unlocked_mop_iberia_tt: "§GUnlocks§! the §YIberia§! series of missions."
 mop_scroll_down_mt_tt: "§gYou can find the missions at the bottom of the mission tree.§!"
 mop_khorasan_title: "Seize Khorasan"
 mop_khorasan_desc: "The path to the subcontinent lies through the ancient cities and rugged terrain of Khorasan. For centuries, this region has been the thoroughfare of conquerors, from Alexander to Timur. We must secure this vital corridor, transforming the warlord ruled satrapies into a stable logistical spine for the Federation. At the end of this road lies Kabul, the key to the Khyber Pass and the vast wealth of India beyond."
 integrated_commune_iranian_bonus_tt: "£integrated_commune£§YIntegrated Commune§! subjects of §YIranian§! culture will grant us §G-5.0%§! Development Cost Modifier if they have at least §Y450§! total development."
 mop_kabul_title: "The Gateway to the East"
 mop_kabul_desc: "Kabul is the hinge upon which the gate to India swings. To support the vast operations of the Dacian India Company, a simple outpost is insufficient. We must transform this mountain citadel into a modern metropolis—a fortress of bureaucracy and trade where the riches of the subcontinent are cataloged, taxed, and secured before their journey west."
 mop_renaissance_title: "The Vlach Renaissance"
 mop_renaissance_desc: "A new spirit of art and learning is sweeping across the world. In our lands, this spirit will be channeled through our deep Orthodox faith. Our artists will perfect the sacred art of iconography, and our architects will raise magnificent churches to the heavens. [1756.GetName]  will become the heart of this holy flourishing, a beacon of faith and culture that will define our age."
 mop_establish_league_title: "Establish the League"
 mop_establish_league_desc: "A single revolutionary state is a target; a federation is a force to be reckoned with. To survive the inevitable crusade of the surrounding monarchs, we must prove that our ideology can scale beyond our borders. By liberating our first peasant republics and integrating them into a formal political structure, we lay the foundation of the League: a united front of free peoples standing shoulder to shoulder against the old order."
 commune_subject_amount_trigger_tt: "Countries that are our £allied_commune£§YAllied Commune§!, £sister_commune£§YSister Commune§!, or £integrated_commune£§YIntegrated Commune§! subjects."
 total_commune_development: "Total Development of our Commune Subjects"
 mop_strengthen_league_ties_title: "Strengthen the League"
 mop_strengthen_league_ties_desc: "A loose collection of allies is vulnerable to subversion and drift. To ensure the long-term survival of the revolution, we must weave the isolated strands of our alliance into a single, unbreakable rope."
 peasant_zeal_on_commune_integration_tt: "We will now gain §G+5§! §YPeasant Zeal§! whenever we integrate a £allied_commune£§YCommune Subject§!."
 mop_strengthen_league_ties_tt: "Countries that are our £sister_commune£§YSister Commune§!, or £integrated_commune£§YIntegrated Commune§! subjects."
 mop_develop_moldavia_title: "Develop the Heartland"
 mop_develop_moldavia_desc: "To prove the superiority of the Peasant Republic, we must transform the cradle of the revolution into a model of agrarian prosperity. By expanding infrastructure and investing in the soil of Moldavia and Bessarabia, we shall demonstrate that free men work harder and build stronger than any serf under bondage. Let our homeland be the envy of the feudal world."
 mop_seat_of_the_metropolitan_title: "Seat of the Metropolitan"
 mop_seat_of_the_metropolitan_desc: "For generations, the high clergy have supped at the tables of Boyars while the common folk starved. To secure the spiritual legitimacy of the Republic, we must sever these old chains. By endowing a new Metropolitan seat in Bessarabia and ensuring the consecration of a Patriarch sympathetic to our cause, we create a church that preaches the true gospel: that all men are equal in the eyes of God."
 bonus_development_on_dev_click_basarabia_tooltip: "Developing §Y[1756.GetName]§! has a §Y20%§! chance to grant §G+1§! §Ydevelopment§!."
 mop_new_capital_title: "The New Capital"
 mop_new_capital_desc: "The cobblestones of Suceava are forever stained by the betrayal of the boieri and the blood of the Last Honorable Voivode, [assassinated_moldavian_voivode.GetName]. We cannot build a future in the slaughterhouse of the past. Instead, we shall look to the sea. Basarabia, the fortress that sheltered our fledgling republic during the civil war, will be transformed. Where there were once only barracks and fishing huts, we shall raise a metropolis of marble and brick."
 mop_moldavian_wineries_title: "Moldavian Wineries"
 mop_moldavian_wineries_desc: "The fertile hills of Moldavia have long produced wine, but under the Republic, this local craft will be forged into a grand industry. We will invest heavily in the vineyards, transforming them into state-managed cooperatives. Our goal is to create a vintage so fine that it becomes the drink of choice in every court in Europe."
 mop_mountain_infrastructure_title: "Carpathian Infrastructure"
 mop_mountain_infrastructure_desc: "The Carpathians serve as the natural fortress of our revolution, shielding the free peasantry from monarchist encroachments. Yet, these rugged peaks also isolate our highland brethren and hinder the rapid deployment of the Host. We must carve arteries through the stone to bind the federation together. By bridging the ravines and paving the passes, we ensure that both grain and gunpowder flow freely between the communes, transforming a wild barrier into a unified engine of defense and prosperity."
 mop_romanian_churches_title: "A Church for All of Dacia"
 mop_romanian_churches_desc: "The Metropolitan Church in [1756.GetName] is the heart of our faith, but true belief lives in many thriving parishes. We must now build churches beyond the capital, establishing houses of God in every major Romanian settlement, united by faith from the Danube to the Carpathians under one cross and one crown."
 mop_romanian_churches_province_reward_tooltip: "For every province except §Y[1756.GetName]§! that meets the mission's requirements:"
 isolationist_mandate_buff_2_tt: "The §OIsolationist Mandate§! §YRazesi§! estate privilege will now grant us §G-10.0%§! Development Cost in Primary Culture and §Gno absolutism penalties§!."
 countries_that_are_our_integrated_communes_tt: "Countries that are our £integrated_commune£§YIntegrated Commune§! subjects."
 base_monthly_commune_intergation_rate_increase_tt: "The base monthly commune integration progress is increased by §G+0.5§!"
 mop_league_integration_title: "The League Charter"
 mop_league_integration_desc: "The decade spent implementing the 'Bind the League' plan has prepared the ground for this decisive step. We now ratify the League Charter, a supreme constitution that supersedes local statutes across all Member Republics. This document harmonizes administrative protocols, standardizes currency, and dismantles internal borders. With the legal machinery now fully aligned, the integration of our subjects becomes a seamless bureaucratic formality rather than a diplomatic struggle."
 internationalist_mandate_buff_2_tt: "The §OInternationalist Mandate§! §YRazesi§! estate privilege §Gno longer grants§! §R+3.00§! National Unrest or penalties to Absolutism."
 reduce_sister_commune_annexation_cost_multiplier_tt: "The base annexation cost per point of development for £sister_commune£§YSister Communes§! has been §Greduced§! from §Y5§! to §G4§!."
 mop_internationalism_title: "Center of the League"
 mop_internationalism_desc: "Our capital has evolved from a regional stronghold into the nerve center of a continental movement. By constructing the Grand Consulate and formally recognizing the distinct cultures within our borders, we affirm that the revolution transcends language. This administrative hub ensures that envoys from every Member Republic find a home here, dismantling the cultural friction that slows integration."
 total_leaguist_candidates_elected: "Total number of Leaguist candidates elected"
 total_leaguist_ten_year_plans_enacted: "Total number of Leaguists ten-year plans enacted"
 rally_the_communes_trust_buff_tt: "The §YRally the Communes§! interaction will now grant us §G+5§! trust with all of our £allied_commune£§YCommune Subjects§!."
 mop_giga_league_title: "Pax Communalis"
 mop_giga_league_desc: "Eight decades of planning. Ten administrations. One vision. We have replaced the chaotic wars of princes with a stable, federal peace. The map is no longer a patchwork of dynastic feuds but a cohesive network of Integrated Communes working in concert. We have built an edifice of diplomacy so robust that it will stand for a thousand years."
 total_peasant_elections: "Total number of peasant elections"
 total_exemplarist_candidates_elected: "Total number of Exemplarist candidates elected"
 total_abolitionist_candidates_elected: "Total number of Abolitionist candidates elected"
 issues_passed: "Total number of parliament issues passed"
 mop_stabilize_the_government_title: "Legitimize the Republic"
 mop_stabilize_the_government_desc: "The monarchies of Europe dismiss us as a rabble of pitchforks destined to collapse into anarchy. We must silence them with order. By maintaining a stable administration through several election cycles and successfully passing legislation in the assembly, we prove that the peasantry is capable of self-governance."
 equal_number_of_peasant_faction_candidates_elected_tt: "The total number of §YExemplarist§! (§Y[This.total_exemplarist_candidates_elected.GetValue]§!), §YLeaguist§! (§Y[This.total_leaguist_candidates_elected.GetValue]§!), and §YAbolitionist§! (§Y[This.total_abolitionist_candidates_elected.GetValue]§!) candidates elected is the same."
 mop_strengthen_government_title: "Strengthen the Republic"
 mop_strengthen_government_desc: "Internal friction is the death of republics. We must refine our political machine until it runs without resistance. By carefully managing re-elections to eliminate faction fatigue and ensuring equal representation for all three ideologies, we will create a government capable of enduring for centuries."
 faction_fatigue_min: "Current minimum faction fatigue"
 unlock_peasant_sfatul_tarii_great_project_tt: "We can now construct the §YSfatul Tarii§! great project in §Y[1756.GetName]§!."
 parliament_issues_reduce_faction_fatigue_tt: "Passing parliament issues will now reduce the §YCurrent Faction Fatigue Gain Modifier§! by §G[Root.fatigue_gain_modifier_parliament_on_action_change.GetValue]§! and the §YCurrent Minimum Faction Fatigue§! by §G[Root.min_faction_fatigue_parliament_on_action_change.GetValue]§!."
 unlock_issue_faction_fatigue_issue_tt: "We will unlock §YThe Political Standards Act§! parliament issue."
 mop_gigachad_government_title: "The Grand Sfatul Tarii"
 mop_gigachad_government_desc: "A revolution as vast as requires a proper seat for our administration. We must construct a monumental legislative complex in [1756.GetName] to house the delegates of the Federation. By expanding the bureaucracy, and fully expanding the Sfatul Tarii to its glorious potential, we will forge a legislative engine capable of governing a continent."
 develop_razesi_loyalty_tt: "Developing §YGrain§!, §YLivestock§! and §YWine§! provinces has a §G25%§! chance of granting §G+1%§! Razesi loyalty."
 mop_razesi_title: "Fulfill the Promise"
 mop_razesi_desc: "We swept away the boyars with promises of a government built for the common man. Now, the Razesi wait to see if we are liberators or merely new masters. To legitimize our nascent republic, we must move beyond rhetoric and directly address the grievances of the free peasantry. We must fulfill their agendas and ensure their voice resonates in the halls of power."
 mop_overthrow_title: "Break the Chains"
 mop_overthrow_desc: "Our brothers and sisters across the border groan under the lash of the nobility. We are duty-bound to answer their silent prayers. We must send agents to incite unrest among the foreign serfs and march our armies to liberate them. By toppling the thrones of tyrants and installing peasant councils, we prove the universality of our cause."
 total_peasant_governments_installed: "Commune subjects established"
 total_incited_peasants: "The number of times we have used 'Incite Peasants' covert action"
 has_farm_estate_tt: "Province has a §YFarm Estate§!"
 razesi_farm_estate_bonus_tt: "Building Farm Estate buildings in our provinces or our subjects' provinces now grants us §G+2.5§! §YPeasant Zeal§! and §G+5§! §YRazesi§! loyalty."
 buffed_grain_monopoly_tt: "The §YMonopoly on Grain§! estate privilege no longer grants Absolutism penalties. It will also apply this modifier to every §YGrain§! producing province with a §YFarm Estate§!:"
 buffed_livestock_monopoly_tt: "The §YMonopoly on Livestock§! estate privilege no longer grants Absolutism penalties. It will also apply this modifier to every §YLivestock§! producing province with a §YFarm Estate§!:"
 mop_strong_razesi_title: "Backbone of the State"
 mop_strong_razesi_desc: "Our armies march on the harvest. We must strengthen the Razesi estate until they become the dominant political force in the nation. By constructing modern Farm Estates and codifying their rights through privileges, we ensure a steady supply of food and manpower."
 extra_peasants_spawn_peasants_war_tt: "§GAn extra army§! of §YPeasant Rebels§! will spawn when we declare war with the §YGreat Peasant Uprising§! casus belli. These rebels will fight alongside us."
 total_staged_coups_against_commune: "Total number of times we have used 'Stage Coup in Commune' covert action while integrating our £allied_commune£Commune Subject"
 mop_overthrow_2_title: "Total Liberation"
 mop_overthrow_2_desc: "The time for cautious diplomacy is over. Our existence is an existential threat to every noble on this continent, and they will not stop until we are destroyed. We must strike first and everywhere. We will export our model of governance by the sword, creating a buffer of friendly states deep into enemy territory. Simultaneously, we must police our own sphere of influence, ruthlessly removing any commune leadership that drifts back toward oligarchy. The revolution must be exported, and it must remain pure."
 spymaster_rebel_support_efficiency_buff_tt: "§YSpymaster§! advisors now grant §G+50%§! Rebel Support Efficiency per skill level."
 revolutionary_mandate_buff_tt: "The §ORevolutionary Mandate§! §YRazesi§! estate privilege will now grant §G+25%§! Foreign Spy Detection and no Absolutism penalties."
 mop_overthrow_3_title: "The Architect of Ruin"
 mop_overthrow_3_desc: "We have turned regicide into an administrative process. What began as a local revolt has become a continental machine, churning out fallen dynasties and liberated communes with terrifying regularity. The sheer scale of this operation, with continents set ablaze and dozens of thrones overturned, demands a nerve center worthy of the task."
 mop_establish_army_title: "Forge the Federal Army"
 mop_establish_army_desc: "A riot can burn a castle, but only an army can hold a border. We must take the raw, chaotic energy of the uprising and temper it with iron discipline. By drilling our forces and establishing a centralized command structure, we transform a collection of angry serfs into a professional fighting force capable of standing toe-to-toe with the knightly orders of Europe."
 mop_military_infrastructure_title: "Systematize Conscription"
 mop_military_infrastructure_desc: "Our enemies surround us, waiting for a moment of weakness. We shall give them none. We must transform our major population centers into bastions of military readiness, equipping them with permanent barracks and regimental camps. By embedding the machinery of war directly into the infrastructure of our towns, we ensure that the Republic can mobilize its full strength at a moment's notice."
 blood_tax_privilege_buff_tt: "§YThe Blood Tax§! estate privilege will now grant §G-5.0%§! Regiment Costs and no Absolutism penalties."
 mop_adopt_gunpowder_title: "The Powder Edict"
 mop_adopt_gunpowder_desc: "The age of bow and pike is ending. Victory on the modern battlefield will be decided by disciplined fire and the roar of cannon. We must embrace this revolution, investing in artillery and retraining our soldiers in the art of gunpowder warfare. Under the guidance of a true military innovator, the federal army will master this new technology and wield it to devastating effect." 
 peasant_zeal_reinforcement_buff_tt: "§YPeasant Zealotry§! now grants up to §G+30.0%§! Reinforce Speed."
 mop_peasant_tide_title: "The Peasant Tide"
 mop_peasant_tide_desc: "From the Carpathian passes to the western seas, our banners darken the horizon. No longer a rabble with pitchforks, the communes now field Europe’s mightiest host—drilled in gunpowder, hardened by war, and aflame with zeal. When the dark tide of the people rises to consume the horizon, there is nothing left for kings to do but weep."
 we_will_annex_all_provinces_when_integrating_commune_tt: "We will §Gdirectly annex§! all provinces we have a §Ypermanent claim§! on that our £allied_commune£§YCommune Subjects§! own once they become our £integrated_commune£§YIntegrated Commune§!."
