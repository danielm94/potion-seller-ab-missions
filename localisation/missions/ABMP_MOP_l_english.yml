 mop_france_liberated_northern_series_title: "Le Nouveau Régime"
 mop_france_liberated_northern_series_desc: "The Ancien Régime is a memory. From the vineyards of the south to the docks of Normandy, the estates are dissolved. We have forged a new order in the fires of revolution."
