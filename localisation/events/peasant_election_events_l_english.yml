l_english:
 peasant_election_events.1.t: "Election!"
 peasant_election_events.1.d: "The term is up for $MONARCH$. With enough support [Root.Monarch.GetSheHe] can stay in office, but then [Root.Monarch.GetSheHe] must defeat [Root.Monarch.GetHerHis] three primary competitors...\n\nIt would be prudent to maintain balance in the realm by electing an equal number of candidates from each faction, and to allow candidates to fully realize their visions for our nation rather than constantly cycling through new candidates. Failing to do so will lead the people to distrust our great commune due to the constant political whiplash and factional favoritism.\n\nNewly Elected Exemplarist Candidates: [Root.new_exemplarists_count.GetValue]\nNewly Elected Leaguist Candidates: [Root.new_leaguists_count.GetValue]\nNewly Elected Abolitionist Candidates = [Root.new_abolitionists_count.GetValue]\nCurrent Faction Fatigue Gain Modifier = [Root.current_fatigue_gain_modifier.GetValue]\nCurrent Minimum Faction Fatigue: [Root.faction_fatigue_min.GetValue]"
 peasant_election_events.1.d.death: "The unfortunate passing of $MONARCH$ forces us to hold a premature election. Three primary candidates have been nominated...\n\nIt would be prudent to maintain balance in the realm by electing an equal number of candidates from each faction, and to allow candidates to fully realize their visions for our nation rather than constantly cycling through new candidates. Failing to do so will lead the people to distrust our great commune due to the constant political whiplash and factional favoritism.\n\nNewly Elected Exemplarist Candidates: [Root.new_exemplarists_count.GetValue]\nNewly Elected Leaguist Candidates: [Root.new_leaguists_count.GetValue]\nNewly Elected Abolitionist Candidates = [Root.new_abolitionists_count.GetValue]\nCurrent Faction Fatigue Gain Modifier = [Root.current_fatigue_gain_modifier.GetValue]\nCurrent Minimum Faction Fatigue: [Root.faction_fatigue_min.GetValue]"
 peasant_election_events.1.keep: "Keep [Root.Monarch.GetName]."
 peasant_election_events.1.keep_protector: "[Root.Monarch.GetName] will continue the revolution!"
 protector_of_the_little_folk_bonus_tt: "§gIf our ruler had the §YProtector of the Little Folk§! personality, it would not cost any Republican Tradition to reelect them, and we would also gain §G+5§! Peasant Zeal.§!\n"
 peasant_election_events.1.exemplarists_candidate: "[peasant_exemplarists_candidate.GetName] will be a cool guy"
 stat_gain_from_average_dev_tt: "§Y[peasant_exemplarists_candidate.GetName]§! will gain §G[Root.stat_gain_from_average_dev.GetValue]§! £allmana£ in all stats from our average development."
 stat_gain_from_average_dev_math_tt: "§g- §YExemplarist§! candidates gain §G+1§! £allmana£ in all stats for every §Y10§! development our provinces have §Yon average§!. We have total development of §Y[Root.total_dev.GetValue]§! amongst §Y[Root.number_of_provinces.GetValue]§! provinces, giving us an average development of §Y[Root.average_dev.GetValue]§!§!"
 stat_gain_from_republican_tradition_exemplarist_tt: "§Y[peasant_exemplarists_candidate.GetName]§! will gain §G[Root.stat_gain_from_republican_tradition.GetValue]§! £allmana£ in all stats from our Republican Tradition."
 stat_gain_from_republican_tradition_math_tt: "§g- §YAll§! candidates gain §G+1§! £allmana£ in all stats if we at least §Y95§! Republican Tradition.§!"
 stat_gain_from_peasant_zeal_exemplarist_tt: "§Y[peasant_exemplarists_candidate.GetName]§! will gain §G[Root.stat_gain_from_peasant_zeal.GetValue]§! £allmana£ in all stats from our Peasant Zeal."
 stat_gain_from_peasant_zeal_math_tt: "§g- §YAll§! candidates gain §G+1§! £allmana£ in all stats if we at least §Y90§! Peasant Zeal.§!"
 peasant_election_events.1.leaguists_candidate: "[peasant_leaguists_candidate.GetName] will unite the communes against the tyrants!"
 stat_gain_from_commune_dev_tt: "§Y[peasant_leaguists_candidate.GetName]§! will gain §G[Root.stat_gain_from_commune_development.GetValue]§! £allmana£ in all stats from our commune subject's development."
 stat_gain_from_commune_dev_math_tt: "§g- §YLeaguist§! candidates gain §G+1§! £allmana£ in all stats for every §Y300§! development our commune subjects have §Yin total§!. Our commune subjects have a total development of §Y[Root.total_commune_development.GetValue]§!.§!"
 stat_gain_from_prestige_tt: "§Y[peasant_leaguists_candidate.GetName]§! will gain §G[Root.stat_gain_from_prestige.GetValue]§! £allmana£ in all stats from our Prestige."
 stat_gain_from_prestige_math_tt: "§g- §YLeaguist§! candidates gain §G+1§! £allmana£ in all stats for every §Y33§! Prestige. We have §Y[Root.prestige_var.GetValue]§! Prestige.§!"
 stat_gain_from_republican_tradition_leaguist_tt: "§Y[peasant_leaguists_candidate.GetName]§! will gain §G[Root.stat_gain_from_republican_tradition.GetValue]§! £allmana£ in all stats from our Republican Tradition."
 stat_gain_from_peasant_zeal_leaguist_tt: "§Y[peasant_leaguists_candidate.GetName]§! will gain §G[Root.stat_gain_from_peasant_zeal.GetValue]§! £allmana£ in all stats from our Peasant Zeal."
 peasant_election_events.1.abolitionists_candidate: "[peasant_abolitionists_candidate.GetName] will forge a new order!"
 stat_gain_from_army_prof_tt: "§Y[peasant_abolitionists_candidate.GetName]§! will gain §G[Root.stat_gain_from_army_prof.GetValue]§! £allmana£ in all stats from our Army Professionalism."
 stat_gain_from_army_prof_math_tt: "§g- §YAbolitionist§! candidates gain §G+1§! £allmana£ in all stats for every §Y33§! Army Professionalism. We have §Y[Root.army_prof.GetValue]§! Army Professionalism.§!"
 stat_gain_from_power_proj_tt: "§Y[peasant_abolitionists_candidate.GetName]§! will gain §G[Root.stat_gain_from_power_proj.GetValue]§! £allmana£ in all stats from our Power Projection."
 stat_gain_from_power_proj_math_tt: "§g- §YAbolitionist§! candidates gain §G+1§! £allmana£ in all stats for every §Y25§! Power Projection. We have §Y[Root.power_proj.GetValue]§! Power Projection.§!"
 stat_gain_from_republican_tradition_abolitionist_tt: "§Y[peasant_abolitionists_candidate.GetName]§! will gain §G[Root.stat_gain_from_republican_tradition.GetValue]§! £allmana£ in all stats from our Republican Tradition."
 stat_gain_from_peasant_zeal_abolitionist_tt: "§Y[peasant_abolitionists_candidate.GetName]§! will gain §G[Root.stat_gain_from_peasant_zeal.GetValue]§! £allmana£ in all stats from our Peasant Zeal."
 candidate_gets_exemplarist_trait_tt: "§Y[peasant_exemplarists_candidate.GetName]§! will gain the §YExemplarist§! personality trait."
 candidate_gets_leaguist_trait_tt: "§Y[peasant_leaguists_candidate.GetName]§! will gain the §YLeaguist§! personality trait."
 candidate_gets_abolitionist_trait_tt: "§Y[peasant_abolitionists_candidate.GetName]§! will gain the §YAbolitionist§! personality trait."
 exemplarists_stats_after_tt: "The final stats of §Y[peasant_exemplarists_candidate.GetName]§! will be §V([Root.exemplarist_adm_after.GetValue]/[Root.exemplarist_dip_after.GetValue]/[Root.exemplarist_mil_after.GetValue])§!"
 leaguists_stats_after_tt: "The final stats of §Y[peasant_leaguists_candidate.GetName]§! will be §V([Root.leaguist_adm_after.GetValue]/[Root.leaguist_dip_after.GetValue]/[Root.leaguist_mil_after.GetValue])§!"
 abolitionists_stats_after_tt: "The final stats of §Y[peasant_abolitionists_candidate.GetName]§! will be §V([Root.abolitionist_adm_after.GetValue]/[Root.abolitionist_dip_after.GetValue]/[Root.abolitionist_mil_after.GetValue])§!"
 faction_fatigue_exemplarists_tt: "Faction Fatigue for Exemplarists: §R[Root.faction_fatigue_exemplarists.GetValue]§!"
 faction_fatigue_leaguists_tt: "Faction Fatigue for Leaguists: §R[Root.faction_fatigue_leaguists.GetValue]§!"
 faction_fatigue_abolitionists_tt: "Faction Fatigue for Abolitionists: §R[Root.faction_fatigue_abolitionists.GetValue]§!"
 fatigue_gain_modifier_reelect_candidate_change_tt: "§YFaction Fatigue Gain Modifier§! is decreased by §G[Root.fatigue_gain_modifier_reelect_candidate_change.GetValue]§!."
 min_faction_fatigue_reelect_candidate_change_tt: "§YMinimum Faction Fatigue§! is decreased by §G[Root.min_faction_fatigue_reelect_candidate_change.GetValue]§!."
 faction_fatigue_change_fatigue_gain_modifier_tt: "§YFaction Fatigue Gain Modifier§! is increased by §R[Root.fatigue_gain_modifier_new_candidate_change.GetValue]§!."
 faction_fatigue_change_minimum_faction_fatigue_tt: "§YMinimum Faction Fatigue§! is increased by §R[Root.min_faction_fatigue_new_candidate_change.GetValue]§!."
 exemplarists_excess_tooltip: "§g- §YThe Exemplarists§! have more new candidate victories (§R[Root.new_exemplarists_count.GetValue]§!) than the equilibrium (§Y[Root.new_candidate_equilibrium.GetValue]§!). Because of this imbalance, the §YFaction Fatigue§! for this candidate will be §Rmuch higher§!.§!"
 leaguists_excess_tooltip: "§g- §YThe Leaguists§! have more new candidate victories (§R[Root.new_leaguists_count.GetValue]§!) than the equilibrium (§Y[Root.new_candidate_equilibrium.GetValue]§!). Because of this imbalance, the §YFaction Fatigue§! for this candidate will be §Rmuch higher§!.§!"
 abolitionists_excess_tooltip: "§g- §YThe Abolitionists§! have more new candidate victories (§R[Root.new_abolitionists_count.GetValue]§!) than the equilibrium (§Y[Root.new_candidate_equilibrium.GetValue]§!). Because of this imbalance, the §YFaction Fatigue§! for this candidate will be §Rmuch higher§!.§!"
