l_english:
 peasant_election_events.1.t: "Election!"
 peasant_election_events.1.d: "The term is up for $MONARCH$. With enough support [Root.Monarch.GetSheHe] can stay in office, but then [Root.Monarch.GetSheHe] must defeat [Root.Monarch.GetHerHis] three primary competitors...\n\nIt would be prudent to maintain balance in the realm by electing an equal number of candidates from each faction, and to allow candidates to fully realize their visions for our nation rather than constantly cycling through new candidates. Failing to do so will lead the people to distrust our great commune due to the constant political whiplash and factional favoritism.\n\nNewly Elected Exemplarist Candidates: [Root.new_exemplarists_count.GetValue]\nNewly Elected Leaguist Candidates: [Root.new_leaguists_count.GetValue]\nNewly Elected Abolitionist Candidates = [Root.new_abolitionists_count.GetValue]\nCurrent Faction Fatigue Gain Modifier = [Root.current_fatigue_gain_modifier.GetValue]\nCurrent Minimum Faction Fatigue: [Root.faction_fatigue_min.GetValue]"
 peasant_election_events.1.d.death: "The unfortunate passing of $MONARCH$ forces us to hold a premature election. Three primary candidates have been nominated...\n\nIt would be prudent to maintain balance in the realm by electing an equal number of candidates from each faction, and to allow candidates to fully realize their visions for our nation rather than constantly cycling through new candidates. Failing to do so will lead the people to distrust our great commune due to the constant political whiplash and factional favoritism.\n\nNewly Elected Exemplarist Candidates: [Root.new_exemplarists_count.GetValue]\nNewly Elected Leaguist Candidates: [Root.new_leaguists_count.GetValue]\nNewly Elected Abolitionist Candidates = [Root.new_abolitionists_count.GetValue]\nCurrent Faction Fatigue Gain Modifier = [Root.current_fatigue_gain_modifier.GetValue]\nCurrent Minimum Faction Fatigue: [Root.faction_fatigue_min.GetValue]"
