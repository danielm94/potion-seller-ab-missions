 peasant_election_events.5.abolitionists_rally_the_peasants_plan: "Rally the Commune"
 peasant_election_events.5.abolitionists_global_liberation_plan: "Global Liberation" 
 peasant_election_events.3.d: "A decade stretches before us, and §Y[Root.Monarch.GetName]§! calls the communes to settle upon a course worthy of emulation.\n\nThe §YExemplarists§! urge inward refinement: pave the roads, bind the guilds, tame the banks, reform the councils, and adopt modern methods. Each path promises a more orderly, capable commune.\n\nChoose a single §YTen Year Plan§!. If §Y[Root.Monarch.GetSheHe]§! remains in office for at least §Y10 years§!, the full fruits will be realized."
 peasant_election_events.4.d: "The League gathers under §Y[Root.Monarch.GetName]§!, weighing how best to knit the communes together.\n\nThe §YLeaguists§! present five avenues: deepen integration with our partners, expand the diplomatic corps, polish our communal image, coordinate trade across the lanes, or establish gentle spheres of influence around our neighbors.\n\nChoose a single §YTen Year Plan§!. If §Y[Root.Monarch.GetSheHe]§! remains in office for at least §Y10 years§!, the full fruits will be realized."
 peasant_election_events.5.d: "War drums and whispers alike reach §Y[Root.Monarch.GetName]§!'s council.\n\nThe §YAbolitionists§! argue for action: strengthen our spy networks, establish firm military standards, professionalize the peasant levies, rally the communes to the banner, or carry the struggle for freedom beyond our borders.\n\nChoose a single §YTen Year Plan§!. If §Y[Root.Monarch.GetSheHe]§! remains in office for at least §Y10 years§!, the full fruits will be realized."
 peasant_election_events.plan_success_title: "[Root.Monarch.GetName]'s Plan Has Been Realized!" 
 peasant_election_events.6.d: "After a decade of steady labor, the Roads Act stands complete. Paved routes now bind communes together, speeding travel, trade, and administration."
 peasant_election_events.7.d: "The Common Guild now links masters and apprentices across every commune, standardizing craft and sending skilled hands where they are most needed."
 peasant_election_events.8.d: "Our banking reforms have broken predatory lending and harnessed credit for the common good. Inflation eases, and the people hold the purse."
 peasant_election_events.9.d: "Our communal reforms have codified councils and procedures; change now builds upon itself, guided by petition and reason."
 peasant_election_events.10.d: "Modernization has taken root in workshops and schools alike; new methods spread and practical innovation is rewarded."
 peasant_election_events.11.d: "Our plan has harmonized statutes and oaths; allies sit as sisters in council, and our voice carries further."
 peasant_election_events.12.d: "The diplomatic corps is trained and deployed; couriers and envoys tend relations with growing skill and reach."
 peasant_election_events.13.d: "Efforts to polish our image have reshaped how the world sees us; suspicion fades, and sympathy grows."
 peasant_election_events.14.d: "Our new trade policy has coordinated markets and routes; caravans and merchants now move under common schedules and standards."
 peasant_election_events.15.d: "Spheres of influence now encircle our borders; lesser councils gravitate to our protection and counsel."
 peasant_election_events.16.d: "Eyes of the commune watch from alley and field; resistance is organized, and tyrants grow unsettled."
 peasant_election_events.17.d: "Professional standards now guide drill fields and forges alike; shared methods raise discipline across the host."
 peasant_election_events.18.d: "The Military Standards Act has transformed levy into line; routine practice turns peasants into reliable soldiers."
 peasant_election_events.19.d: "Rallying the communes has woven banners to every village; men return to the ranks faster, willing and ready."
 peasant_election_events.20.d: "The work of global liberation tempers conquest with purpose; the freed remember, and the fearful reconsider."
 peasant_election_events.plan_success_ok: "Excellent."
 peasant_election_events.4.leaguists_colonialism_plan: "Establish Overseas Communes"
 peasant_election_events.21.d: "We have seized the fleets necessary to voyage into the unknown. This is an age of untold opportunity for the common man."