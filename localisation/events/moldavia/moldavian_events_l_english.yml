l_english:
 moldavian_events.1.t: "A Nation Reborn"
 moldavian_events.1.civil_war_ended_desc: "The civil war has ended. The Sfatul Tarii stands victorious, and the peasant republic is secure. Yet the matter of what we shall call our nation remains unsettled. Shall we reclaim the old name, or forge a new one for the world to know?"
 moldavian_events.1.regular_desc: "Our nation’s name still carries the weight of choice. Shall we stand as Moldavia reborn, the Moldavian Commune of equals, or as the proud Razesi Republic of freeholders?"
 moldavian_events.1.moldavia: "Reclaim the name of Moldavia"
 moldavian_events.1.moldavian_commune_EN: "Proclaim the Moldavian Commune"
 moldavian_events.1.moldavian_commune_RO: "Proclama Comuna Moldoveneasca"
 moldavian_events.1.razesi_republic_EN: "Declare the Razesi Republic"
 moldavian_events.1.razesi_republic_RO: "Declara Republica Razeseasca"
 romanian_equivalent_of_moldavian_commune_tt: "§gThis is the Moldavian Commune in Romanian.§!"
 romanian_equivalent_of_razesi_republic_tt: "§gThis is the Razesi Republic in Romanian.§!"
 moldavia_name_change_first_one_free_tt: "§gThis name change is free, but all subsequent name changes will cost §R1§! Prestige.§!"
 unlock_decision_to_rename_mop_tt: "We will unlock a decision to rename this country again."