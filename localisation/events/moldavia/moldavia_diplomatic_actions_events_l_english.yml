l_english:
 moldavia_diplomatic_actions_events.1.t: "[From.GetName] Incited the Peasants"
 moldavia_diplomatic_actions_events.1.d: "$TODO$"
 moldavia_diplomatic_actions_events.1.a: "Get back to your fields! Who told you to stop ploughing?"
 integrating_commune_requirements_tt: "We will start integrating @[From.GetTag] §Y[From.GetName]§! if all of the following is true:\n[can_integrate_commune_has_diplomats] We have at least §Y2§! diplomats available.\n[can_integrate_commune_at_peace]Both we and @[From.GetTag] [From.GetName] are at peace.\n[can_integrate_commune_loyal] @[From.GetTag] [From.GetName] has less than §Y10§! Liberty Desire\n[can_integrate_commune_no_truce] Neither we nor @[From.GetTag] [From.GetName] hold a truce with the other.\n[can_integrate_commune_opinion] @[From.GetTag] §Y[From.GetName]§! has at least §Y190§! opinion of us.\n[can_integrate_commune_trust] @[From.GetTag] §Y[From.GetName]§! has at least §Y50§! trust with us."
 integrating_commune_requirements_not_met_tt: "§gSelecting this option will do nothing if all the requirements above are not met.§!"
 moldavia_diplomatic_actions_events.6.t: "[From.GetName] is Ready to be Integrated!"
 moldavia_diplomatic_actions_events.6.d: "The mandatory transitional period following the establishment of the [From.GetAdjective] Commune has finally elapsed. Local peasant councils report that their administrative structures are now compatible with Federal standards, and the populace is sufficiently radicalized to accept closer alignment with the homeland. While specific diplomatic hurdles may still remain, the structural barriers to full integration have been removed."
 moldavia_diplomatic_actions_events.6.start_integrating: "Begin the integration process."
 moldavia_diplomatic_actions_events.6.dont_integrate: "Now is not the time."
 moldavia_diplomatic_actions_events.2.t: "[From.GetName] has Been Integrated!"
 moldavia_diplomatic_actions_events.2.d: "The artificial borders drawn by ancient kings have finally been erased. The [From.GetAdjective] councils have formally ratified the Act of Union, dissolving their separate charter to join the greater assembly. From the fields to the cities, the administrative barriers between our peoples have fallen. We are no longer merely allies in the struggle against tyranny, but one indivisible republic."
 moldavia_diplomatic_actions_events.2.a: "It is a glorious day for the [From.Culture.GetName] people, and all free men!"