l_english:
 balkanization_events.0.t: "Balkanize [new_peasant_subject.GetName]?"
 balkanization_events.0.d: "With their nobles overthrown and their armies broken, the land has been freed from aristocratic rule. Yet liberation brings its own question: shall the communes of these regions stand as independent brothers in our federation, or shall we entrust them all to the guidance of §Y[new_peasant_subject.GetName]§!, ruling from §Y[new_peasant_subject.Capital.GetCapitalName]§!? The future of this land now rests on how we choose to shape its newfound freedom.\n\nBalkanizing [new_peasant_subject.GetName] has its benefits. By balkanizing [new_peasant_subject.GetName], you can gain the benefits of Integrated Communes sooner, since you only have to integrate parts of the country rather than the entire country. Additionally, the released countries may have cores on other nations that aren't yet our subjects, which can give us some easy reconquest wars. You also gain more Peasant Zeal per month, as each Commune Subject generates a fixed amount.\n\nBalkanizing [new_peasant_subject.GetName] also comes with its costs. You will worsen relations immediately with [new_peasant_subject.GetName], making them more difficult to integrate. They may even leave our Peasant League if you fail to improve relations and keep them loyal by the time your truce with them ends. Allied Communes consume diplomatic relation slots, so you may quickly find yourself overwhelmed with many new subjects. Additionally, having many small subjects creates unpredictability: they may conquer each other, defeating the whole purpose of balkanization, and they can be annexed more easily if they start or join a losing war.\n\nConsider your nation’s situation and needs carefully."
 balkanization_events.0.balkanize: "Divide and conquer, that's what I always say."
 balkanization_events.0.no: "No, it would be unwise to anger [new_peasant_subject.GetName] this soon."
 balkanize_overlap_disclaimer_tt: "§gDisclaimer: The countries listed will be released in the order they appear. The information below assumes that the countries listed §Ydo not§! share the §Yexact same core provinces§!. In the event that two or more countries share the §Yexact same core provinces§!, the country listed §Gfirst§! will be §Greleased§!, and the others will be §Yskipped§!. Any effects that would have happened from releasing them will also be §Yskipped§!.§!"
 balkanize_effect_tt: "All of the countries released will become our £allied_commune£§YAllied Commune§!. Each released nation will gain:\n  §G+50§! opinion of us\n  §G-10.0%§! Liberty Desire.\n\n§Y[new_peasant_subject.GetName]§! will not approve of this arrangement. For each nation that is released, they will gain:\n  §R-20§! opinion of us\n §R+5.0%§! Liberty Desire\n\nWith §Y[new_peasant_subject.temp_releasable_countries.GetValue]§! releasable nation(s), we stand to lose §R[new_peasant_subject.opinion_loss_from_balkanization.GetValue]§! opinion and gain §R[new_peasant_subject.liberty_desire_gain_from_balkanization.GetValue].0%§! Liberty Desire with §Y[new_peasant_subject.GetName]§!, assuming all of them can be released simultaneously."
 cant_balkanize_again_tt: "§RYou will not get another opportunity to balkanize §Y[new_peasant_subject.GetName]§!.§!"
 balkanization_events.0.set_all: "§GSet All§!"
 balkanization_events.0.clear_all: "§RClear All§!"
