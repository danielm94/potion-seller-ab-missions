l_english:
 moldavian_peasant_events.1.t: "A Nation Reborn"
 moldavian_peasant_events.1.civil_war_ended_desc: "The civil war has ended. The Sfatul Tarii stands victorious, and the peasant republic is secure. Yet the matter of what we shall call our nation remains unsettled. Shall we reclaim the old name, or forge a new one for the world to know?"
 moldavian_peasant_events.1.regular_desc: "Our nation's name still carries the weight of choice. Shall we stand as Moldavia reborn, the Moldavian Commune of equals, or as the proud Razesi Republic of freeholders?"
 moldavian_peasant_events.1.moldavia: "Reclaim the name of Moldavia"
