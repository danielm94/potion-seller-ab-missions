l_english:
 moldavia_peasant_events.1.t: "A Nation Reborn"
 moldavia_peasant_events.1.civil_war_ended_desc: "The civil war has ended. The Sfatul Tarii stands victorious, and the peasant republic is secure. Yet the matter of what we shall call our nation remains unsettled. Shall we reclaim the old name, or forge a new one for the world to know?"
 moldavia_peasant_events.1.regular_desc: "Our nation's name still carries the weight of choice. Shall we stand as Moldavia reborn, the Moldavian Commune of equals, or as the proud Razesi Republic of freeholders?"
 moldavia_peasant_events.1.moldavia: "Reclaim the name of Moldavia"
 moldavia_peasant_events.1.moldavian_commune_EN: "Proclaim the Moldavian Commune"
 moldavia_peasant_events.1.moldavian_commune_RO: "Proclama Obstea Moldovei"
 moldavia_peasant_events.1.razesi_republic_EN: "Declare the Razesi Republic"
 moldavia_peasant_events.1.razesi_republic_RO: "Declara Republica Razeseasca"
 moldavia_peasant_events.1.united_communes_EN: "Proclaim the United Communes"
 moldavia_peasant_events.1.united_communes_RO: "Proclama Comunele Unite"
 moldavia_peasant_events.1.dacian_league_EN: "Form the Dacian League"
 moldavia_peasant_events.1.dacian_league_RO: "Intemeia Liga Dacica"
 moldavia_peasant_events.1.vlach_federation_EN: "Found the Vlach Federation"
 moldavia_peasant_events.1.vlach_federation_RO: "Intemeia Federatia Valaha"
 romanian_equivalent_of_united_communes_tt: "§gThis is the United Communes in Romanian.§!"
 romanian_equivalent_of_dacian_league_tt: "§gThis is the Dacian League in Romanian.§!"
 romanian_equivalent_of_vlach_federation_tt: "§gThis is the Vlach Federation in Romanian.§!"
 romanian_equivalent_of_moldavian_commune_tt: "§gThis is the Moldavian Commune in Romanian.§!"
 romanian_equivalent_of_razesi_republic_tt: "§gThis is the Razesi Republic in Romanian.§!"
 moldavia_name_change_first_one_free_tt: "§gThis name change is free, but all subsequent name changes will cost §R1§! Prestige.§!"
 unlock_decision_to_rename_mop_tt: "We will unlock a decision to rename this country again."
 moldavia_peasant_events.2.t: "New Dacian Tradition and Ambitions"
 moldavia_peasant_events.2.d: "Shall we bind this new realm together with a fresh body of §YDacian Peasant Ideas§!, or remain true to the Moldavian Commune ideals?\n\n§YNew Traditions:§!\nMorale of Armies: §G+20.0%§!\nSpy Network Constructions: §G+50.0%§!\n\n§YNew Ambition:§!\nDevelopment Cost: §G-10.0%§!\n\n§YFirst New Idea: Hidden Footpaths§!\nRebel Support Efficiency: §G+100.0%§!\nSpy Action Cost Modifier: §G-25.0%§!\n\n§YSecond New Idea: Free Men's Resolve§!\nMorale Damage Received: §G-5.0%§!\nRecover Army Morale Speed: §G+15.0%§!\n\n§YThird New Idea: Council of the Land§!\nYearly Republican Tradition: §G+0.30§!\nNumber of possible Parliament Issues: §G+1§!\n\n§YFourth New Idea: Keepers of the River Gates§!\nCost to justify trade conflict: §G-25.0%§!\nTrade Steering: §G+25.0%§!\n\n§YFifth New Idea: Leader of the Revolution§!\nMonthly Peasant Zeal: §G+0.07§!\nDiplomatic Relations: §G+2§!\n\n§YSixth New Idea: Peasant Hordes§!\nManpower Recovery Speed: §G+20.0%§!\nLand Maintenance Modifier: §G-10.0%§!\n\n§YSeventh New Idea: Shepherd of the Communes§!\nLiberty Desire in Same Continent Subjects: §G-20.00%§!\nDiplomatic Reputation: §G+2.00§!"
 moldavia_peasant_events.3.t: "Balkanize [new_peasant_subject.GetName]?"
 moldavia_peasant_events.3.d: "With their nobles overthrown and their armies broken, the land has been freed from aristocratic rule. Yet liberation brings its own question: shall the communes of these regions stand as independent brothers in our federation, or shall we entrust them all to the guidance of §Y[new_peasant_subject.GetName]§!, ruling from §Y[new_peasant_subject.Capital.GetCapitalName]§!? The future of this land now rests on how we choose to shape its newfound freedom.\n\nBalkanizing [new_peasant_subject.GetName] has its benefits. By balkanizing [new_peasant_subject.GetName], you can gain the benefits of Integrated Communes sooner, since you only have to integrate parts of the country rather than the entire country. Additionally, the released countries may have cores on other nations that aren't yet our subjects, which can give us some easy reconquest wars. You also gain more Peasant Zeal per month, as each Commune Subject generates a fixed amount.\n\nBalkanizing [new_peasant_subject.GetName] also comes with its costs. You will worsen relations immediately with [new_peasant_subject.GetName], making them more difficult to integrate. They may even leave our Peasant League if you fail to improve relations and keep them loyal by the time your truce with them ends. Allied Communes consume diplomatic relation slots, so you may quickly find yourself overwhelmed with many new subjects. Additionally, having many small subjects creates unpredictability: they may conquer each other, defeating the whole purpose of balkanization, and they can be annexed more easily if they start or join a losing war.\n\nConsider your nation’s situation and needs carefully."
 moldavia_peasant_events.3.balkanize: "Divide and conquer, that's what I always say."
 moldavia_peasant_events.3.no: "No, it would be unwise to anger [new_peasant_subject.GetName] this soon."
 balkanize_overlap_disclaimer_tt: "§gDisclaimer: The countries listed will be released in the order they appear. The information below assumes that the countries listed §Ydo not§! share the §Yexact same core provinces§!. In the event that two or more countries share the §Yexact same core provinces§!, the country listed §Gfirst§! will be §Greleased§!, and the others will be §Yskipped§!. Any effects that would have happened from releasing them will also be §Yskipped§!.§!"
 balkanize_effect_tt: "All of the countries released will become our £allied_commune£§YAllied Commune§!. Each released nation will gain:\n  §G+50§! opinion of us\n  §G-10.0%§! Liberty Desire.\n\n§Y[new_peasant_subject.GetName]§! will not approve of this arrangement. For each nation that is released, they will gain:\n  §R-20§! opinion of us\n §R+5.0%§! Liberty Desire\n\nWith §Y[new_peasant_subject.releasable_countries.GetValue]§! releasable nation(s), we stand to lose §R[new_peasant_subject.opinion_loss_from_balkanization.GetValue]§! opinion and gain §R[new_peasant_subject.liberty_desire_gain_from_balkanization.GetValue].0%§! Liberty Desire with §Y[new_peasant_subject.GetName]§!, assuming all of them can be released simultaneously."
 cant_balkanize_again_tt: "§RYou will not get another opportunity to balkanize §Y[new_peasant_subject.GetName]§!.§!"
 moldavia_peasant_events.4.t: "The End of the Celestial Empire"
 moldavia_peasant_events.4.d: "For thousands of years, the scholars of the East preached that the order of the world was fixed—that the high must rule the low as the mountain rules the valley. They claimed the Emperor held a Mandate from Heaven, making him a god among men.\n\nToday, we have proven that man was nothing but a blasphemer and a slave master. Much like the Pharaoh of Egypt of old, and every tyrant who has stood in our way since, he was made to face the judgement of the one true God, the Almighty."
 moldavia_peasant_events.4.a: "Blessed are the meek, for they shall inherit the Earth."
 moldavia_peasant_events.5.t: "Naadam Festival of [GetYear]"
 moldavia_peasant_events.5.d: "The Naadam is a celebration of the herder's skill, strength, and endurance. To foster unity between the Federation and the local tribes, the administration has organized a grand tournament at Caracorum. By sponsoring the traditional events of wrestling, horse racing, and archery, we prove that the Republic honors the culture of the steppe. Which discipline shall the communal treasury sponsor this year?"
 integrated_commune_tibetan_bonus_tt: "Heretic and Heathen provinces will no longer give any penalties if we have an £integrated_commune£§YIntegrated Commune§! subject of §YTibetan§! culture with more than §Y300§! total development."
 unlock_GPH_commune_diplomatic_actions_tt: "Unlock §YCommune Interactions§!£integrated_commune£ that allow you to establish @GPH §YGanden Phodrang§! in one of your £integrated_commune£§YIntegrated Communes§! that are of §YTibetan§! culture. Once @GPH §YGanden Phodrang§! is established, you will be able to transfer §YTibetan§! provinces from your other £integrated_commune£§YIntegrated Communes§! to @GPH §YGanden Phodrang§!."
 moldavia_peasant_events.6.t: "Free Tibet!"
 moldavia_peasant_events.6.d_pcc_exists: "The chants ring out from the snowy peaks of Lhasa to the streets of Suceava: 'Free Tibet! Free Tibet!' The victory is absolute, and the Abolitionists are already drafting the constitution for a new, holy peasant state.\n\nHowever, the [PCC.GetName] is desperate to reintegrate the plateau. While the mob outside chants for freedom, our Treasurer looks at the map, realizes the leverage we hold, and pushes aside the treaty of independence. Instead, he drafts a private missive to [PCC.Capital.GetCapitalName]:\n\n'Hello, China? We have something you may want. But it is going to cost you...'"
 moldavia_peasant_events.6.d_pcc_not_exists: "The chants ring out from the snowy peaks of Lhasa to the streets of Suceava: 'Free Tibet! Free Tibet!' The victory is absolute, and the Abolitionists are already drafting the constitution for a new, holy peasant state.\n\nHowever, the collective councils of the Chinese communes are desperate to reintegrate the plateau. While the mob outside chants for freedom, our Treasurer looks at the map, realizes the leverage we hold, and pushes aside the treaty of independence. Instead, he drafts a private missive to the trade guilds of the East:\n\n'Hello, China? We have something you may want. But it is going to cost you...'"
 moldavia_peasant_events.6.a: "We must listen to the people. Free Tibet!"
 moldavia_peasant_events.6.b: "That's right... All the tea..."
 china_can_absorb_tibet_tt: "We can transfer Tibetan provinces to the @[PCC.GetTag] §Y[PCC.GetName]§!"