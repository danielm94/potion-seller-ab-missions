l_english:
 razesi_events.0.t: "Extension of the Monopoly on Livestock"
 razesi_events.0.d: "The monopoly on livestock we granted to the [get_razesi_name] has expired, meaning that we are now able to reclaim the income from livestock farming. However, the [get_razesi_name] are keen to keep their privileges and are offering to pay us a lump sum in return for the monopoly being guaranteed for a further 10 years."
 razesi_events.1.t: "Extension of the Monopoly on Grain"
 razesi_events.1.d: "The monopoly on grain we granted to the [get_razesi_name] has expired, meaning that we are now able to reclaim the income from farming grain. However, the [get_razesi_name] are keen to keep their privileges and are offering to pay us a lump sum in return for the monopoly being guaranteed for a further 10 years."
 razesi_events.2.t: "A Black Harvest"
 razesi_events.2.d: "Blight has swept through the fields of [famine_province.GetName]. The Razesi smallholders report total crop failure and rapidly dwindling stockpiles. Starvation is imminent without immediate state subsidies to import food. Ignoring their plight will shatter their economic power and local organization."
 razesi_events.2.help: "Open the state granaries immediately."
 razesi_events.2.dont_help: "The treasury remains closed."
 razesi_events.2.well_connected_personality: "I know a merchant who owes me a favor..."
 starving_razesi_desc: "Starving Razesi: §Y$VAL$%§!"
 razesi_events.3.t: "The Hidden Harvest"
 razesi_events.3.d: "The tax collectors returning from [tax_evading_province.GetName] are baffled. While the official ledgers record a standard yield, whispers suggest a harvest of historic proportions. The Razesi communities there have clearly cooked the books, hoarding the surplus wealth right under our noses. We are being cheated, plain and simple."
 razesi_events.3.let_it_slide: "As long as the base rate is paid, do not pry."
 razesi_events.3.investment_opportunity: "Force them to reinvest the surplus into local infrastructure projects."
 razesi_events.3.make_them_pay: "Send the collectors back. We demand our due."
 razesi_events.3.kill_them_all: "Make an example of them."
 razesi_tax_evading: "Emboldened Tax Evaders: §Y$VAL$%§!"
 put_razesi_in_place: "Strict Auditing: §Y$VAL$%§!"
 terrified_razesi: "Draconian Enforcement: §Y$VAL$%§!"
 razesi_events.4.t: "Petition for Agrarian Expansion"
 razesi_events.4.d: "A delegation of Razesi elders from [farm_estate_target.GetName] has arrived at court with a petition. They argue that the region's soil is fertile but underutilized, and that a state-funded Farm Estate would significantly boost production."
 razesi_events.4.build_farm_estate: "Approve the funds. The realm needs food."
 razesi_events.4.architectural_visionary_personality: "I have drafted a far more efficient blueprint myself."
 razesi_events.4.dont_build: "The treasury is not a charity for smallholders."
 granted_razesi_funding: "Granted State Subsidies: §Y$VAL$%§!"
 denied_funding_razesi_desc: "Denied Funding: §Y$VAL$%§!"
 razesi_events.5.t: "The Razesi's Tribute"
 razesi_events.5.d: "Reports from the countryside confirm a harvest of historic proportions. Granaries are bursting, and the Razesi elders have arrived at court with heavy wagons and heavier purses. They offer a substantial share of this surplus to the state as a 'voluntary tribute.' While they frame it as a patriotic duty, the implication is clear: this gold is meant to purchase political favor and legislative consideration for their estate."
 razesi_events.5.take_money: "We accept their generous gift."
 razesi_events.6.greedy_personality: "If they can afford this bribe, they are clearly undertaxed."
 razesi_events.5.razesi_keeps: "The state is not for sale."
 razesi_big_harvest_desc: "Accepted Razesi Bribes: §Y$VAL$%§!"
 gave_money_back_to_razesi_desc: "Rebuked Razesi Lobbying"
 razesi_events.6.t: "Deteriorating Relations With the Razesi"
 razesi_events.6.d: "Relations between the [Root.GovernmentName] and the Razesi have collapsed. The free peasantry, once the backbone of our militia, now view the state as a parasitic entity that violates the ancient rights of the land. A minor dispute over land boundaries in the provinces has escalated into open insurrection. The watchtowers are burning, and the militias we trained are now marching against us."
 razesi_events.6.a: "Order must be restored at any cost."
 razesi_events.7.t: "The Razesi's Ultimatum"
 razesi_events.7.d: "The Razesi have grown far beyond their station as humble tillers of the earth. Through their dominance of local markets and the militia, they have established a parallel administration that rivals the Crown itself. Emboldened by our reliance on their grain and steel, a delegation of elders has presented a charter of demands. They seek irrevocable title to the lands they work, a move that would legally strip the state of its right to seize property, essentially ceding sovereignty of the countryside to the villages."
 razesi_events.7.accept_demands: "Sign the charter. We need their support."
 razesi_events.7.negotiate: "Would you like a cup of tea? Have a cup of tea."
 razesi_events.7.reject_demands: "Tear it up. The State is supreme."
 razesi_demands_accepted_desc: "Charter of Peasant Rights: §Y$VAL$%§!"
 razesi_demands_rejected_desc: "Denied Peasant Rights: §Y$VAL$%§!"