l_english:
 mop_wallachia_title_rem: "The Petty Tyrants"
 mop_wallachia_title_not_rem: "Butcher the Butcher"
 mop_wallachia_title_dead_wal: "The End of the Boierimea"
 mop_wallachia_desc_rem: "Wallachia stands as a mirror, showing the fate that would have befallen us had the last good Voivode been a weak and sniveling coward. Rather than stand for the common Vlach or even for his own dignity, he bent the knee to those ever power-hungry Boieri *spits*—all to save his own skin and cling to the shadow of a crown. They call this compromise 'honorable' they say 'all have a voice' now, but the truth is plain: they have ten petty tyrants instead of one."
 mop_wallachia_desc_not_rem: "Wallachia stands as a mirror, showing the fate that would have befallen us had we not risen for the common Vlach. Had we bowed and watched the last good Voivode slain, we too would live under our own butcher. We cannot allow this horror to go on any longer. God willing, we shall will cut down the butcher."
 mop_wallachia_desc_dead_wal: "At long last, the shadow of the Boieri has been lifted from our land. The banners of tyranny are torn, their manors stand empty, and the last chains on the Vlach soul are broken. From the Prut to the Olt, there are no lords and no serfs—only free men who till their own soil and answer to none but God and their conscience. We have paid dearly for this dawn, but through our struggle, the Vlachs stand as a free people once more."
 mop_flag: "@MOP"
