 string_start_title_moldavia: "The Voivodate of Moldavia"
 string_start_moldavia: "Perched on the perilous edge of Christendom, Moldavia has long served as a breakwater against the tides of the East. While our cousins in §YWallachia§! navigated webs of intrigue between empires, Moldavia survived by the sword, enduring centuries of raids from the §YGolden Horde§!, the §YMagyars§!, and the §YSlavs§!. This constant state of war and the failure of the Voivode and nobility to protect the peasant class of the hinterlands have driven the peasants of these lands to become fiercely independent and militaristic. They are known as the §YRazesi§!.\n\nYet, as 1444 dawns, the Voivodate grows dangerously unstable. The recent influx of Hussite exiles and runaway serfs from the fractured north has upset the delicate social balance of the realm. Rather than submitting to the nobility, these refugees have flocked to the remote §YRazesi§! communities, swelling their ranks and radicalizing their independent spirit with egalitarian doctrines. Bolstered by Hussite military tactics and a growing disdain for feudal authority, this militarized peasantry has evolved from a border defense force into a formidable power bloc. The nobility demand these “heretics and runaways” be crushed, yet the Voivode lacks the strength to subdue a hinterland that has effectively become a state within a state.\n\nHaving become aware of the schemes of the nobility, the §YRazesi§! are furious. For countless generations, they have shielded the principality with their blood, yet their reward is not gratitude, but treachery. Terrified by the peasantry’s newfound influence, the jealous nobility now plot openly to dismantle §YRazesi§! rights and force them back into servitude. Coexistence is no longer possible; a violent reckoning approaches, where either the feudal order will crush the freeholders, or the §YRazesi§! will carve a new destiny from the ashes of the old nobility. Only one side will survive the coming storm."