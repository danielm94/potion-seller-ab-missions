l_english:
 barbary_corsairs: "Corsair Crew"
 barbary_corsairs_desc: "Veterans of the Mediterranean coast, these sailors operate with a ruthless efficiency born of necessity. Their expertise grants the fleet unparalleled speed in landing operations and a predatory edge when hunting merchant shipping."
 venetian_arsenal_heavy_bombards: "Arsenal Heavy Bombards"
 venetian_arsenal_heavy_bombards_desc: "By seizing the casting secrets of the Venetian Arsenal, we have equipped our flagship with massive bronze siege guns. While their immense weight increases maintenance costs, their superior range and caliber allow them to pulverize coastal fortifications with terrifying ease."
 genoese_rigging: "Genoese Rigging"
 genoese_rigging_desc: "Genoese shipwrights have devised a complex, revolutionary sail plan that catches the wind from any angle. While the stress on the masts requires constant, expensive maintenance, the sheer speed allows the flagship to outmaneuver any rival and coordinate merchant convoys with unprecedented efficiency."