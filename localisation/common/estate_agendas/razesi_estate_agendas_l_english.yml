l_english:
 estate_razesi_spy_on_threats: "Infiltrate [spy_agenda_target.GetName]"
 estate_razesi_spy_on_threats_desc: "The [get_razesi_name] feel threatened by [spy_agenda_target.GetName] and want us to infiltrate their lands to see what their next move is."
 estate_razesi_build_roads: "Build Roadways in [agenda_province.GetName]"
 estate_razesi_build_roads_desc: "The [get_razesi_name] of [agenda_province.GetName] are isolated from the capital, lacking a reliable route to transport their goods. We must finance the construction of a permanent road to integrate these remote communities into the Republic."
 estate_razesi_upgrade_roads: "Modernize Roads in [road_target_province.GetName]"
 estate_razesi_upgrade_roads_desc: "The highways of [road_target_province.GetName] are an embarrassment to a modern Republic. While foreign nations boast paved causeways, our wagons still fracture their axles in deep ruts. We must upgrade this infrastructure to prove that a peasant state can build better than any king."
 remove_annexers_legacy_tt: "There will be no penalty to your Diplomatic Reputation for annexing @[agenda_country.GetTag] §Y[agenda_country.GetName]§!"
 estate_razesi_integrate_subject: "Absorb the [agenda_country.GetAdjective] Commune"
 estate_razesi_integrate_subject_desc: "Maintaining a separate puppet administration in [agenda_country.GetName] is a waste of federal resources. The [get_razesi_name] urge us to integrate them, streamlining tax collection and recruitment for the Federation."
 estate_razesi_support_rebels: "Fund Agitators in [target_country.GetName]"
 estate_razesi_support_rebels_desc: "The revolutionary fever has crossed the border into [target_country.GetName]. To ensure the spark becomes a fire, we must support the radicalized elements within their peasantry."
 estate_razesi_support_rebels_trigger_tt: "We are currently supporting rebels against @[agenda_country.GetTag] §Y[agenda_country.GetName]§!"
