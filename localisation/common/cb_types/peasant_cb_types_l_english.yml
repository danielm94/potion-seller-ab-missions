l_english:
 cb_great_peasant_uprising: "Great Peasant Uprising"
 cb_great_peasant_uprising_desc: "The suffering of the neighboring peasantry under feudal lords necessitates our intervention. We shall march to dismantle their chains and establish a revolutionary order of communal self-governance."
 cb_reintegrate_into_peasant_league: "Reintegrate into the Peasant League"
 cb_reintegrate_into_peasant_league_desc: "We'll teach those ungrateful bastards that membership in the league is not optional."
 cb_force_into_peasant_league: "Peasant League Integration"
 cb_force_into_peasant_league_desc: "A neighboring peasant republic rejects the League’s common charter. For the sake of solidarity and security, we will bring them into the League."
 cb_crush_peasants: "Crush the Peasants"
 cb_crush_peasants_desc: "The so-called commune undermines our rule, filling fields with seditious talk of equality. For the sake of order, we must put down this peasant regime before its poison spreads."