l_english:
 exemplarist_personality: "Exemplarist"
 desc_exemplarist_personality: "[Root.Monarch.GetName] focuses on the internal strength and prosperity of the Republic. This ruler believes that maintaining a high standard of living and technological advancement within our borders provides the most persuasive argument for the communal way of life. This approach prioritizes domestic stability and long-term economic growth over foreign entanglements."
 exemplarist_personality_die_desc: "The Republic mourns a dedicated administrator. [Root.Monarch.GetSheHeCap] leaves behind a legacy of improved infrastructure and robust institutions. The prosperity fostered under [Root.Monarch.GetHerHis] guidance provides a firm foundation for the future of our people."
 leaguist_personality: "Leaguist"
 desc_leaguist_personality: "A master of federal politics, [Root.Monarch.GetName] prioritizes the diplomatic health of the Peasant League. This ruler excels at managing the diverse interests of our commune subjects and strengthening the trade bonds that unite the federation. This focus ensures a cohesive and loyal network of allies but requires constant diplomatic investment."
 leaguist_personality_die_desc: "The Great Mediator has passed. [Root.Monarch.GetSheHeCap] spent [Root.Monarch.GetHerHis] life weaving the disparate communes into a single, functional league. The diplomatic bridges built by [Root.Monarch.GetName] remain the cornerstone of our collective security."
 abolitionist_personality: "Abolitionist"
 desc_abolitionist_personality: "[Root.Monarch.GetName] is a revolutionary who believes the Republic cannot be safe while monarchies still exist. This ruler prioritizes the military liberation of oppressed peasantries and the systematic dismantling of reactionary states. This aggressive stance spreads our ideology rapidly but keeps the nation in a state of perpetual mobilization."
 abolitionist_personality_die_desc: "A champion of the common people has passed. [Root.Monarch.GetSheHeCap] dedicated [Root.Monarch.GetHerHis] rule to the destruction of thrones and the liberation of the enslaved. The maps of our continent were redrawn by [Root.Monarch.GetHerHis] will to see every peasant free."