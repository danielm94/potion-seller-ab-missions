l_english:
 ability_boieri_vs_razesi_mechanic: "Boieri Vs Razesi"
 boieri_vs_razesi_power: "Razesi Power"
 boieri_vs_razesi_power_desc: "This represents the power struggle between the nobility and the peasants in our realm.\n-------------------------------------------------------------------\nWe gain §YRazesi Power§! by doing the following:\n- Developing provinces in §YBessarabia§!, or the §YPontic Steppe§! region. §g(§G+1§! per dev click)§!\n- Completing estate agendas for the §YRazesi§!. §g(§G+15§! per estate agenda)§!\n- Acquiring provinces in the §YPontic Steppe§! region. §g(§G+0.25§! per point of development)§!\n- Accepting peasant rebel demands. §g(§G+100§!)§!\n\nWe lose §YRazesi Power§! by doing the following:\n- Developing provinces in the §YCarpathia§! or §YBalkans§! region, except the provinces in the §YMoldavia§! area. §g(§G-1§! per dev click)§!\n- Completing estate agendas for the §Y[Root.GetNobilityName]§!. §g(§G-15§! per estate agenda)§!\n- Acquiring provinces in the §YCarpathia§! or §YBalkans§! regions, except the provinces in the §YMoldavia§! area. §g(§G-0.25§! per point of development)§!\n- Accepting noble rebel demands. §g(§G-100§!)§!\n\n[less_than_0_razesi_power_tt]"
 boieri_vs_razesi_power_gain_modifier: "Razesi Power Gain Modifier"
 monthly_boieri_vs_razesi_power: "Monthly Razesi Power Gain"
 less_than_0_razesi_power_tooltip_text: "At Minimum Power, §YRazesi Power§! has the following effects:\nNational Unrest: §R+4.00§!\nNational Tax Modifier: §G+10.0%§!\nNational Manpower Modifier: §G+10.0%§!\nCore-Creation Cost: §G-10.0%§!\nBoierimea Loyalty Equilibrium: §G+10.0%§!\nRazesi Loyalty: §R-10.0%§!\n\n"
 boieri_vs_razesi_civil_war_tt: "§RThe power struggle between the nobility and peasants will reach a boiling point, causing an all out civil war!§!"