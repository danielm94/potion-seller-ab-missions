 no_total_development_consulate_condition_tt: "£no£ §RThey have more than §Y125§! total development.§!"
 yes_total_development_consulate_condition_tt: "£yes£ §GTheir total development is §Y125§! or less.§!"
 no_has_casus_belli_consulate_condition_tt: "£no£ §RWe don't have a §YTrade Conflict§!, §YTrade Dispute§!, or §YTrade League Dispute§! casus belli against them.§!"
 yes_has_casus_belli_consulate_condition_tt: "£yes£ §GWe have a §YTrade Conflict§!, §YTrade Dispute§!, or §YTrade League Dispute§! casus belli against them.§!"
 no_continent_consulate_condition_tt: "£no£ §RTheir capital and our capital are both on the same continent, §Y[Root.Capital.GetContinentName]§!.§!"
