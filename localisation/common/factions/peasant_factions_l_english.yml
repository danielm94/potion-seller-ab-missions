l_english:
 exemplarists_faction: "The Exemplarists"
 exemplarists_faction_influence: "Exemplarist Influence"
 exemplarists_faction_FACTION_DESC: "The Exemplarists argue that the greatest threat to the feudal order is not the Armata, but the envy of the oppressed. Composed of successful freeholders, urban artisans, and the intelligentsia, this faction advocates for deep economic development and administrative stability.\n\nThey seek to transform the nation into an undeniable beacon of prosperity—a 'City on a Hill' that proves a peasant state can eclipse the glory of any monarchy, inciting foreign populations to revolt through the sheer contrast of their living standards."
 leaguists_faction: "The Leaguists"
 leaguists_faction_influence: "Leaguists Influence"
 leaguists_faction_FACTION_DESC: "The Leaguists maintain that a solitary republic, no matter how zealous, remains vulnerable in a continent of kings. Composed of federal diplomats, merchant guilds, and subject liaisons, they advocate for the projection of power through a vast, decentralized network of kindred republics.\n\nTheir goal is to bind the liberated peoples of Europe into a single, unbreakable economic and military pact, securing the revolution through a framework of permanent collective defense."
 abolitionists_faction: "The Abolitionists"
 abolitionists_faction_influence: "Abolitionist Influence"
 abolitionists_faction_FACTION_DESC: "Founded by the father of the Republic, Bogdan Razesul, the Abolitionists embody the militant spirit of the revolution. They rally behind the cry 'Christ has redeemed us' interpreting the scripture as a divine negation of all feudal debt and servitude.\n\nThis faction directs the state's resources toward the total annihilation of the aristocracy, asserting that the Republic can never be safe so long as a single monarch remains on a throne to challenge the rights of the free peasantry."
