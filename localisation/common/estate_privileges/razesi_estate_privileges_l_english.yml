l_english:
 estate_razesi_land_rights: "Razesi Land Rights"
 estate_razesi_land_rights_desc: "The central government cannot oversee every village. By issuing permanent land charters to the Razesi, we delegate the burden of local administration to these free landholders."
 estate_razesi_strong_communes_trigger_tooltip: "Have at least §Y2§! subjects that are £allied_commune£ §YCommune Subjects§! or §YConsulate Subjects§!."
 estate_razesi_strong_communes: "Guaranteed Communal Autonomy"
 estate_razesi_strong_communes_desc: "The Razesi class argues that the Revolution must not replace one Empire with another. They advocate for a loose federation where our Commune Subjects retain significant self-governance. By formally guaranteeing their autonomy, we can maintain a vast network of loyal allies who manage their own affairs. However, these legal guarantees will make it significantly harder to fully integrate these territories into the Republic later."
 estate_razesi_primacy: "Land of the Free"
 estate_razesi_primacy_desc: "We shall enshrine the principle that the [Root.GovernmentName] belongs to those who bleed for it. By granting the Razesi primacy in land distribution and military command, we ensure our leadership consists of hardened veterans rather than court favorites."
 estate_razesi_blood_tax: "The Blood Tax"
 estate_razesi_blood_tax_desc: "For a Razesi family rich in sons but poor in gold, the annual land tax can be a death sentence for their estate. To prevent these families from falling into debt-bondage, we have legalized the 'Blood Tax.' A household may discharge its fiscal debts by surrendering their second and third sons to the Republic's regiments. This grim compromise preserves the family land for the primary heir while ensuring our armies are constantly replenished with young men who have nothing to lose."
 estate_razesi_charter: "The Razesi Charter"
 estate_razesi_charter_desc: "The Razesi have always held a unique place in our society. They are neither serfs bound to the soil nor great lords ruling over it. This charter formally codifies their ancient rights to land ownership and legal autonomy, shielding them from encroachment by powerful interests."
