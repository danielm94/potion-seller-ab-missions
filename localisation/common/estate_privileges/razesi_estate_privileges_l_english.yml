l_english:
 estate_razesi_land_rights: "[get_razesi_name] Land Rights"
 estate_razesi_land_rights_desc: "The central government cannot oversee every village. By issuing permanent land charters to the [get_razesi_name], we delegate the burden of local administration to these free landholders."
 estate_razesi_strong_communes_trigger_tooltip: "Have at least §Y2§! subjects that are £allied_commune£ §YCommune Subjects§! or §YConsulate Subjects§!."
 estate_razesi_strong_communes: "Guaranteed Communal Autonomy"
 estate_razesi_strong_communes_desc: "The [get_razesi_name] class argues that the Revolution must not replace one Empire with another. They advocate for a loose federation where our Commune Subjects retain significant self-governance. By formally guaranteeing their autonomy, we can maintain a vast network of loyal allies who manage their own affairs. However, these legal guarantees will make it significantly harder to fully integrate these territories into the [Root.GovernmentName] later."
 estate_razesi_primacy: "Land of the Free"
 estate_razesi_primacy_desc: "We shall enshrine the principle that the [Root.GovernmentName] belongs to those who bleed for it. By granting the [get_razesi_name] primacy in land distribution and military command, we ensure our leadership consists of hardened veterans rather than court favorites."
 estate_razesi_blood_tax: "The Blood Tax"
 estate_razesi_blood_tax_desc: "For a [get_razesi_name] family rich in sons but poor in gold, the annual land tax can be a death sentence for their estate. To prevent these families from falling into debt-bondage, we have legalized the 'Blood Tax.' A household may discharge its fiscal debts by surrendering their second and third sons to the [Root.GovernmentName]'s regiments. This grim compromise preserves the family land for the primary heir while ensuring our armies are constantly replenished with young men who have nothing to lose."
 estate_razesi_charter: "The [get_razesi_name] Charter"
 estate_razesi_charter_desc: "The [get_razesi_name] have always held a unique place in our society. They are neither serfs bound to the soil nor great lords ruling over it. This charter formally codifies their ancient rights to land ownership and legal autonomy, shielding them from encroachment by powerful interests."
 estate_razesi_monopoly_of_livestock: "Monopoly on Livestock"
 estate_razesi_monopoly_of_livestock_desc: "The vast herds of cattle and sheep that roam our hills are the primary wealth of the [get_razesi_name] class. By granting them an exclusive charter to manage the export and sale of livestock, the state secures a substantial upfront payment to the treasury."
 estate_razesi_monopoly_of_grain: "Monopoly on Grain"
 estate_razesi_monopoly_of_grain_desc: "The harvest is the heartbeat of our economy. To secure immediate funding for the state, we have granted the [get_razesi_name] exclusive rights to the grain trade. In exchange for a substantial lump sum paid directly to the treasury, the [Root.GovernmentName] relinquishes its claim on the production taxes of the fields."
 estate_razesi_monopoly_of_grain_effect_tooltip: "§RNo income from §YGrain§!§!"
 estate_razesi_monopoly_of_grain_revoke_tooltip: "Production income from §YGrain§! is restored"
 estate_razesi_commune_integration: "[get_razesi_name] Integration Oversight"
 estate_razesi_commune_integration_desc: "Integrating a fellow commune is a delicate task, usually met with fear by our other subjects. The [get_razesi_name] propose a solution: a rigorous, standardized process of assimilation. By embedding [get_razesi_name] overseers in our subjects' administrations, we ensure a swift integration that other communes view as a standard legal procedure rather than a conquest."
 estate_razesi_advisors: "[get_razesi_name] Education Grants"
 estate_razesi_advisors_desc: "The [get_razesi_name] argue that the state invests too much in war and too little in the minds of its people. This privilege diverts a significant portion of national tax revenue to fund local schools and village academies."
 estate_razesi_revolution: "Mandate for Global Revolution"
 estate_razesi_revolution_desc: "We have entrusted the [get_razesi_name] with a sacred duty: to carry our ideology beyond our borders. By granting them immunity from land seizure and empowering the Abolitionist faction within their ranks, we effectively turn their estates into the treasury of the global uprising. The wealth of the [get_razesi_name] is channeled directly to foreign agitators, ensuring that as their land ownership grows, so too does our capacity to incite rebellion in neighboring monarchies."
