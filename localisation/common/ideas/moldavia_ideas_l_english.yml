l_english:
 MOP_ideas:0 "Moldavian Peasant Ideas"
 MOP_ideas_start:0 "Moldavian Peasant Traditions"
 MOP_ideas_bonus:0 "Moldavian Peasant Ambition"

 MOP_council_of_the_land:0 "Council of the Land"
 MOP_council_of_the_land_desc:0 "Sfatul Tarii, the Council of the Country, replaces princely decree. Decisions are made collectively by delegates from the communes, ensuring a steady hand in governance."

 MOP_wanderers_and_whispers:0 "Wanderers and Whispers"
 MOP_wanderers_and_whispers_desc:0 "Our peasants wander freely across borders, seeking work in foreign fields and markets. Wherever they go, they bring back whispers of opportunity and weakness."

 MOP_the_fields_are_ours:0 "The Fields Are Ours"
 MOP_the_fields_are_ours_desc:0 "With the land in the hands of those who till it, every harvest brings renewed effort. Fields flourish, villages grow, and prosperity follows."

 MOP_torchbearers_of_the_peasantry:0 "Torchbearers of the Peasantry"
 MOP_torchbearers_of_the_peasantry_desc:0 "Across distant lands, peasants see our banners and rise. We lead a movement to cast down nobles and free the fields."

 MOP_wine_of_the_east:0 "Wine of the East"
 MOP_wine_of_the_east_desc:0 "From the hills of Cotnari to the markets of Constantinople, Moldavian wine flows like liquid gold. Its reputation brings wealth and prestige."

 MOP_razesi_ascendant:0 "Razesi Ascendant"
 MOP_razesi_ascendant_desc:0 "The free peasants, once subjects, now shape the realm itself. Their loyalty strengthens the state, though not all accept this new order quietly."

 MOP_communes_united:0 "Communes United"
 MOP_communes_united_desc:0 "Our sister communes may be autonomous, but they share in our vision of freeing the serfs of the world from the boyars."
