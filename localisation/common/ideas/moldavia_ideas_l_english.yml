l_english:
 MOP_ideas: "Moldavian Peasant Ideas"
 MOP_ideas_start: "Moldavian Peasant Traditions"
 MOP_ideas_bonus: "Moldavian Peasant Ambition"
 MOP_council_of_the_land: "Council of the Land"
 MOP_council_of_the_land_desc: "Sfatul Tarii, the Council of the Country, replaces princely decree. Decisions are made collectively by delegates from the communes, ensuring a steady hand in governance."
 MOP_wanderers_and_whispers: "Wanderers and Whispers"
 MOP_wanderers_and_whispers_desc: "Our peasants wander freely across borders, seeking work in foreign fields and markets. Wherever they go, they bring back whispers of opportunity and weakness."
 MOP_the_fields_are_ours: "The Fields Are Ours"
 MOP_the_fields_are_ours_desc: "With the land in the hands of those who till it, every harvest brings renewed effort. Fields flourish, villages grow, and prosperity follows."
 MOP_torchbearers_of_the_peasantry: "Torchbearers of the Peasantry"
 MOP_torchbearers_of_the_peasantry_desc: "Across distant lands, peasants see our banners and rise. We lead a movement to cast down nobles and free the fields."
 MOP_wine_of_the_east: "Wine of the East"
 MOP_wine_of_the_east_desc: "From the hills of Cotnari to the markets of Constantinople, Moldavian wine flows like liquid gold. Its reputation brings wealth and prestige."
 MOP_razesi_ascendant: "Razesi Ascendant"
 MOP_razesi_ascendant_desc: "The free peasants, once subjects, now shape the realm itself. Their loyalty strengthens the state, though not all accept this new order quietly."
 MOP_communes_united: "Communes United"
 MOP_communes_united_desc: "Our sister communes may be autonomous, but they share in our vision of freeing the serfs of the world from the boyars."
 TUC_ideas: "Dacian Peasant Ideas"
 TUC_ideas_start: "Dacian Peasant Traditions"
 TUC_ideas_bonus: "Dacian Peasant Ambition"
 TUC_council_of_the_land: "Council of the Land"
 TUC_council_of_the_land_desc: "Sfatul Tarii, the Council of the Country, replaces princely decree. Decisions are made collectively by delegates from the communes, ensuring a steady hand in governance."
 TUC_sneaky_peasants: "Hidden Footpaths"
 TUC_sneaky_peasants_desc: "From market to monastery, from mill to border ford, our runners know every byway. News and powder move unseen, and where whispers go, uprisings soon follow."
 TUC_freedom: "Free Men's Resolve"
 TUC_freedom_desc: "No levy fights like those who till and guard their own soil. Setbacks are borne, ranks close, and our lines find their breath again faster than any lord’s host."
 TUC_river_gates: "Keepers of the River Gates"
 TUC_river_gates_desc: "We police the ferries, estuaries, and caravan crossings that feed our marts. Influence flows with the current—and we turn it to our profit and cause."
 TUC_leader_of_the_revolution: "Leader of the Revolution"
 TUC_leader_of_the_revolution_desc: "A single banner gathers many communes. Envoys ride ceaselessly to bind allies, settle disputes, and keep the zeal of the countryside bright."
 TUC_peasant_horde: "Peasant Hordes"
 TUC_peasant_horde_desc: "When the bells ring, the fields empty. Whole valleys muster with their own captains and carts, fighting lean and mending gear as they march."
 TUC_sheppard_of_the_communes: "Shepherd of the Communes"
 TUC_sheppard_of_the_communes_desc: "Firm hand, fair weights, and open granaries keep our sister communes loyal. With trust earned and promises kept, few pull against the yoke of unity."