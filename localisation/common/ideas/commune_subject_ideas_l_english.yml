l_english:
 sloboda_rus_ideas: "Slobodskoy Ideas"
 sloboda_rus_ideas_start: "Slobodskoy Traditions"
 sloboda_rus_ideas_bonus: "Slobodskoy Ambition"
 sloboda_rus_first: "Bogdanoff's Trade Networks"
 sloboda_rus_first_desc: "Upon his demise, Igor Bogdanoff, hegemon alone of the White Sea trade, left the rights to his commercial empire to the state of Novgorod. Thanks to the enterprise of this brave patriot, our state is the sole controller of trade from Archangelsk to the gulf of Finland."
 sloboda_rus_second: "Monopoly on the Fur Trade"
 sloboda_rus_second_desc: "The fauna of our frozen forests is ripe for harvesting fur, and it’s a resource that won’t run out anytime soon – in stark contrast to Europe’s continuous shortages of animals. Due to this, our exclusive rights of exportation over such a profitable good are sure to grant us formidable riches."
 sloboda_rus_third: "Ivan's Hundred"
 sloboda_rus_third_desc: "The legendary association of merchants, known as Ivan’s Hundred, has a stranglehold on Russian and Baltic commerce – something we’ll certainly benefit from in the long run."
 sloboda_rus_fourth: "Control of the Hanseatic Kontor"
 sloboda_rus_fourth_desc: "The trade post of Peterhof has been left behind by the Hansa and is now fully within our grasp. No longer shall German merchants have a chance of standing toe to toe with our best entrepreneurs."
 sloboda_rus_fifth: "Funding the Ushkuiniks"
 sloboda_rus_fifth_desc: "What if our state took a page out of the other great powers’ book and started engaging in copious privateering? Any remaining hopes of Sweden or Lubeck to prevent our commercial expansion will be stamped out."
 sloboda_rus_sixth: "Baltic Trade Hegemon"
 sloboda_rus_sixth_desc: "The Baltic sea is under our complete control, from Denmark’s faraway shores to our own. We rule these waves with an iron fist, and every ship traversing it has to pass through our careful controls."
 sloboda_rus_seventh: "New World Ambitions"
 sloboda_rus_seventh_desc: "Across the great Ocean, shores and forests as frozen as ours are home to creatures unheard-of here. Our enemies have already placed their eyes on them to replace our prized furs – the only reasonable thing to do is get there first!"
 PCC_ideas: "Chinese Communal Ideas"
 PCC_ideas_start: "Chinese Communal Traditions"
 PCC_ideas_bonus: "Chinese Communal Ambition"
 PCC_first: "The Communal Li-Jia"
 PCC_first_desc: "The old imperial Li-Jia system was a tool for tax collection and surveillance by the gentry. We have repurposed it. Now, the village councils—not the magistrates—manage the local census and labor drafts. By decentralizing administration to the village elders, we can govern the vastness of China without the bloat of the mandarin bureaucracy."
 PCC_second: "The Great Unity"
 PCC_second_desc: "We strive for 'Datong'—the Great Unity. In this era, the world belongs to everyone, not just a single family. By preaching that all under the Yellow Sky are kin, we harmonize the diverse faiths and peoples of the Middle Kingdom, ending the sectarian violence that plagued the dynasties."
 PCC_third: "Restoring the Well-Field"
 PCC_third_desc: "For centuries, scholars wrote of the ancient 'Jing-tian' system, where land was divided equally and worked communally, but no Emperor dared implement it. We have made the dream a reality. The landlord's fences are torn down, the irrigation ditches are shared, and the harvest of the Middle Kingdom flourishes like never before."
 PCC_fourth: "Shattering the Sea Ban"
 PCC_fourth_desc: "The Emperors burned their fleets and closed the coast, fearing that the outside world would destabilize their rule. We have no such fear. We are tearing down the 'Haijin' sea ban restrictions. The People's Communes will take to the waves, ensuring that the wealth of the Southern Seas flows into the pockets of the peasantry."
 PCC_fifth: "Men Plough, Women Weave"
 PCC_fifth_desc: "The ancient proverb says: 'Men plough, women weave.' Under the dynasties, the landlord took the grain and the merchant took the silk. Now that the parasites are gone, every household keeps what they produce. This incentive has sparked an explosion of productivity in our cottage industries."
 PCC_sixth: "The Yellow Sky Rises"
 PCC_sixth_desc: "The slogan of the Yellow Turban Rebellion has finally come to pass: 'The Azure Sky is dead; the Yellow Sky has risen.' Our soldiers do not fight for a distant Son of Heaven; they fight for the soil beneath their feet. This zeal makes our armies unstoppable, for they know that defeat means a return to serfdom."
 PCC_seventh: "Peace Under Heaven"
 PCC_seventh_desc: "Stability is not achieved by the executioner's blade, but by the full rice bowl. Now that the land has been returned to the tiller and the corrupt officials purged, the grievances that fueled centuries of rebellion have vanished. There is finally peace under heaven."
 GPH_ideas: "Ganden Phodrang Ideas"
 GPH_ideas_start: "Ganden Phodrang Traditions"
 GPH_ideas_bonus: "Ganden Phodrang Ambition"
 GPH_first: "The Frozen Ramparts"
 GPH_first_desc: "We dwell on the Roof of the World, where the air is thin and the cold is absolute. Foreign armies that march against us fight not only our soldiers but the mountain itself. We shall watch from our high peaks as their lungs fail and their supply lines freeze in the snow."
 GPH_second: "The Dzong Citadels"
 GPH_second_desc: "Our monasteries are not merely places of prayer; they are fortresses of stone commanded by the Lamas and garrisoned by the faithful. These Dzongs stand as the anchors of our administration, collecting the tithes of the harvest and guarding the valleys against intrusion."
 GPH_third: "Cho-sid-nyi"
 GPH_third_desc: "We have perfected the 'Dual System' of governance. By harmonizing the spiritual authority of the Dalai Lama with the material needs of the Peasant Councils, we have created a society where every grievance is heard and every soul is tended to, ensuring a tranquility that no other nation can match."
 GPH_fourth: "Masters of the High Passes"
 GPH_fourth_desc: "While others struggle to breathe in the thin atmosphere, our people have adapted to the altitude over millennia. Our caravans navigate the treacherous mountain paths with the sure-footedness of the yak, ensuring that our trade and logistics flow where others would perish."
 GPH_fifth: "The Yellow Hat Teachings"
 GPH_fifth_desc: "The Gelug school represents the purified path of the Dharma. Our monks are disciplined, learned, and zealous in their study. We shall send them forth to the villages and the nomads, spreading the true teachings and strengthening the spiritual bond of the nation."
 GPH_sixth: "Ocean of Wisdom"
 GPH_sixth_desc: "The Dalai Lama is more than a ruler; he is the manifestation of compassion. His voice carries a moral weight that transcends borders, allowing us to mediate disputes and secure favorable treaties with empires that would otherwise see us as prey."
 GPH_seventh: "The Monk-Officials"
 GPH_seventh_desc: "To run a state requires literacy and discipline. We draw our administrators from the monasteries, creating a class of Monk-Officials who serve the state not for personal enrichment, but as a religious duty. Their asceticism ensures the treasury is full and the administration is pure."