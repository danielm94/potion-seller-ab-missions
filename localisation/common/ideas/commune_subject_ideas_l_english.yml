l_english:
 sloboda_rus_ideas: "Slobodskoy Ideas"
 sloboda_rus_ideas_start: "Slobodskoy Traditions"
 sloboda_rus_ideas_bonus: "Slobodskoy Ambition"
 sloboda_rus_first: "Bogdanoff's Trade Networks"
 sloboda_rus_first_desc: "Upon his demise, Igor Bogdanoff, hegemon alone of the White Sea trade, left the rights to his commercial empire to the state of Novgorod. Thanks to the enterprise of this brave patriot, our state is the sole controller of trade from Archangelsk to the gulf of Finland."
 sloboda_rus_second: "Monopoly on the Fur Trade"
 sloboda_rus_second_desc: "The fauna of our frozen forests is ripe for harvesting fur, and it’s a resource that won’t run out anytime soon – in stark contrast to Europe’s continuous shortages of animals. Due to this, our exclusive rights of exportation over such a profitable good are sure to grant us formidable riches."
 sloboda_rus_third: "Ivan's Hundred"
 sloboda_rus_third_desc: "The legendary association of merchants, known as Ivan’s Hundred, has a stranglehold on Russian and Baltic commerce – something we’ll certainly benefit from in the long run."
 sloboda_rus_fourth: "Control of the Hanseatic Kontor"
 sloboda_rus_fourth_desc: "The trade post of Peterhof has been left behind by the Hansa and is now fully within our grasp. No longer shall German merchants have a chance of standing toe to toe with our best entrepreneurs."
 sloboda_rus_fifth: "Funding the Ushkuiniks"
 sloboda_rus_fifth_desc: "What if our state took a page out of the other great powers’ book and started engaging in copious privateering? Any remaining hopes of Sweden or Lubeck to prevent our commercial expansion will be stamped out."
 sloboda_rus_sixth: "Baltic Trade Hegemon"
 sloboda_rus_sixth_desc: "The Baltic sea is under our complete control, from Denmark’s faraway shores to our own. We rule these waves with an iron fist, and every ship traversing it has to pass through our careful controls."
 sloboda_rus_seventh: "New World Ambitions"
 sloboda_rus_seventh_desc: "Across the great Ocean, shores and forests as frozen as ours are home to creatures unheard-of here. Our enemies have already placed their eyes on them to replace our prized furs – the only reasonable thing to do is get there first!"