l_english:
 sloboda_rus_ideas: "Slobodskoy Ideas"
 sloboda_rus_ideas_start: "Slobodskoy Traditions"
 sloboda_rus_ideas_bonus: "Slobodskoy Ambition"
 sloboda_rus_first: "Bogdanoff's Trade Networks"
 sloboda_rus_first_desc: "Upon his demise, Igor Bogdanoff, hegemon alone of the White Sea trade, left the rights to his commercial empire to the state of Novgorod. Thanks to the enterprise of this brave patriot, our state is the sole controller of trade from Archangelsk to the gulf of Finland."
 sloboda_rus_second: "Monopoly on the Fur Trade"
 sloboda_rus_second_desc: "The fauna of our frozen forests is ripe for harvesting fur, and it’s a resource that won’t run out anytime soon – in stark contrast to Europe’s continuous shortages of animals. Due to this, our exclusive rights of exportation over such a profitable good are sure to grant us formidable riches."
 sloboda_rus_third: "Ivan's Hundred"
 sloboda_rus_third_desc: "The legendary association of merchants, known as Ivan’s Hundred, has a stranglehold on Russian and Baltic commerce – something we’ll certainly benefit from in the long run."
 sloboda_rus_fourth: "Control of the Hanseatic Kontor"
 sloboda_rus_fourth_desc: "The trade post of Peterhof has been left behind by the Hansa and is now fully within our grasp. No longer shall German merchants have a chance of standing toe to toe with our best entrepreneurs."
 sloboda_rus_fifth: "Funding the Ushkuiniks"
 sloboda_rus_fifth_desc: "What if our state took a page out of the other great powers’ book and started engaging in copious privateering? Any remaining hopes of Sweden or Lubeck to prevent our commercial expansion will be stamped out."
 sloboda_rus_sixth: "Baltic Trade Hegemon"
 sloboda_rus_sixth_desc: "The Baltic sea is under our complete control, from Denmark’s faraway shores to our own. We rule these waves with an iron fist, and every ship traversing it has to pass through our careful controls."
 sloboda_rus_seventh: "New World Ambitions"
 sloboda_rus_seventh_desc: "Across the great Ocean, shores and forests as frozen as ours are home to creatures unheard-of here. Our enemies have already placed their eyes on them to replace our prized furs – the only reasonable thing to do is get there first!"
 PCC_ideas: "Chinese Communal Ideas"
 PCC_ideas_start: "Chinese Communal Traditions"
 PCC_ideas_bonus: "Chinese Communal Ambition"
 PCC_first: "The Communal Li-Jia"
 PCC_first_desc: "The old imperial Li-Jia system was a tool for tax collection and surveillance by the gentry. We have repurposed it. Now, the village councils—not the magistrates—manage the local census and labor drafts. By decentralizing administration to the village elders, we can govern the vastness of China without the bloat of the mandarin bureaucracy."
 PCC_second: "The Great Unity"
 PCC_second_desc: "We strive for 'Datong'—the Great Unity. In this era, the world belongs to everyone, not just a single family. By preaching that all under the Yellow Sky are kin, we harmonize the diverse faiths and peoples of the Middle Kingdom, ending the sectarian violence that plagued the dynasties."
 PCC_third: "Restoring the Well-Field"
 PCC_third_desc: "For centuries, scholars wrote of the ancient 'Jing-tian' system, where land was divided equally and worked communally, but no Emperor dared implement it. We have made the dream a reality. The landlord's fences are torn down, the irrigation ditches are shared, and the harvest of the Middle Kingdom flourishes like never before."
 PCC_fourth: "Shattering the Sea Ban"
 PCC_fourth_desc: "The Emperors burned their fleets and closed the coast, fearing that the outside world would destabilize their rule. We have no such fear. We are tearing down the 'Haijin' sea ban restrictions. The People's Communes will take to the waves, ensuring that the wealth of the Southern Seas flows into the pockets of the peasantry."
 PCC_fifth: "Men Plough, Women Weave"
 PCC_fifth_desc: "The ancient proverb says: 'Men plough, women weave.' Under the dynasties, the landlord took the grain and the merchant took the silk. Now that the parasites are gone, every household keeps what they produce. This incentive has sparked an explosion of productivity in our cottage industries."
 PCC_sixth: "The Yellow Sky Rises"
 PCC_sixth_desc: "The slogan of the Yellow Turban Rebellion has finally come to pass: 'The Azure Sky is dead; the Yellow Sky has risen.' Our soldiers do not fight for a distant Son of Heaven; they fight for the soil beneath their feet. This zeal makes our armies unstoppable, for they know that defeat means a return to serfdom."
 PCC_seventh: "Peace Under Heaven"
 PCC_seventh_desc: "Stability is not achieved by the executioner's blade, but by the full rice bowl. Now that the land has been returned to the tiller and the corrupt officials purged, the grievances that fueled centuries of rebellion have vanished. There is finally peace under heaven."
 GPH_ideas: "Ganden Phodrang Ideas"
 GPH_ideas_start: "Ganden Phodrang Traditions"
 GPH_ideas_bonus: "Ganden Phodrang Ambition"
 GPH_first: "The Frozen Ramparts"
 GPH_first_desc: "We dwell on the Roof of the World, where the air is thin and the cold is absolute. Foreign armies that march against us fight not only our soldiers but the mountain itself. We shall watch from our high peaks as their lungs fail and their supply lines freeze in the snow."
 GPH_second: "The Dzong Citadels"
 GPH_second_desc: "Our monasteries are not merely places of prayer; they are fortresses of stone commanded by the Lamas and garrisoned by the faithful. These Dzongs stand as the anchors of our administration, collecting the tithes of the harvest and guarding the valleys against intrusion."
 GPH_third: "Cho-sid-nyi"
 GPH_third_desc: "We have perfected the 'Dual System' of governance. By harmonizing the spiritual authority of the Dalai Lama with the material needs of the Peasant Councils, we have created a society where every grievance is heard and every soul is tended to, ensuring a tranquility that no other nation can match."
 GPH_fourth: "Masters of the High Passes"
 GPH_fourth_desc: "While others struggle to breathe in the thin atmosphere, our people have adapted to the altitude over millennia. Our caravans navigate the treacherous mountain paths with the sure-footedness of the yak, ensuring that our trade and logistics flow where others would perish."
 GPH_fifth: "The Yellow Hat Teachings"
 GPH_fifth_desc: "The Gelug school represents the purified path of the Dharma. Our monks are disciplined, learned, and zealous in their study. We shall send them forth to the villages and the nomads, spreading the true teachings and strengthening the spiritual bond of the nation."
 GPH_sixth: "Ocean of Wisdom"
 GPH_sixth_desc: "The Dalai Lama is more than a ruler; he is the manifestation of compassion. His voice carries a moral weight that transcends borders, allowing us to mediate disputes and secure favorable treaties with empires that would otherwise see us as prey."
 GPH_seventh: "The Monk-Officials"
 GPH_seventh_desc: "To run a state requires literacy and discipline. We draw our administrators from the monasteries, creating a class of Monk-Officials who serve the state not for personal enrichment, but as a religious duty. Their asceticism ensures the treasury is full and the administration is pure."
 JAP_peasant_ideas: "Ikko Japanese Ideas"
 JAP_peasant_ideas_start: "Ikko Traditions"
 JAP_peasant_ideas_bonus: "Ikko Ambition"
 JAP_peasant_first: "The Primal Vow"
 JAP_peasant_first_desc: "We reject the esoteric rituals of the old sects, which served only the aristocracy and the literate. The Primal Vow of Amida Buddha offers salvation to all equally—peasant, merchant, and outcast alike. By reciting the Nembutsu, we forge a spiritual unity that transcends the rigid caste system of the past."
 JAP_peasant_second: "Constructing the Pure Land"
 JAP_peasant_second_desc: "We do not wait for death to enter paradise. It is our holy duty to build the Pure Land right here in this world (Shindo). We shall drain the swamps, terrace the hills, and pave the roads, transforming the Japanese archipelago into a garden worthy of the Buddha."
 JAP_peasant_third: "Reject the Bushido"
 JAP_peasant_third_desc: "For centuries, the Samurai class glorified death and loyalty to a feudal lord. We reject this death-cult. Our stability comes not from the sword of a Daimyo, but from the horizontal bonds of the community. We embrace life, labor, and the peace of the congregation."
 JAP_peasant_fourth: "Single-Minded Devotion"
 JAP_peasant_fourth_desc: "The Samurai fights for a stipend; the Ikko adherent fights for his soul. When our militias march, they move with a 'Single-Minded' (Ikko) determination that no mercenary force can match. We fear no death, for we know the Pure Land awaits those who fall defending the faithful."
 JAP_peasant_fifth: "Floating Fortresses"
 JAP_peasant_fifth_desc: "The sea is our moat, protecting the sanctity of our experiment from outside interference. We have commissioned a new fleet of massive Atakebune—floating fortresses of heavy timber and cannon fire designed to crush any warlord or foreign invader who dares approach our shores."
 JAP_peasant_sixth: "The Yoriai Councils"
 JAP_peasant_sixth_desc: "Decisions in our state are not handed down from a castle keep. They are debated in the 'Yoriai'—village assemblies where consensus is reached through discussion. This tradition of local democracy ensures that our leaders truly represent the will of the congregation."
 JAP_peasant_seventh: "Abolish the Han System"
 JAP_peasant_seventh_desc: "We have burned the land registries of the Daimyos. The artificial borders of the 'Han' domains are dissolved. Japan is no longer a patchwork of private fiefdoms, but a single, unified congregation administered efficiently by the people, for the people."
 ROP_ideas: "Roman Commune Ideas"
 ROP_ideas_start: "Roman Traditions"
 ROP_ideas_bonus: "Roman Ambition"
 ROP_first: "Caput Mundi"
 ROP_first_desc: "Rome is the Head of the World. For centuries, this title was usurped by Popes and Germanic pretenders, but the prestige of the Eternal City belongs to the people who live within its walls. We reclaim our place at the center of history."
 ROP_second: "Restore the Marble City"
 ROP_second_desc: "The Forum has become a cow pasture, and the Colosseum a quarry for nobles' palaces. We shall end this desecration. The state will fund a massive restoration of the ancient monuments, proving that the Commune is the only worthy heir to the grandeur of antiquity."
 ROP_third: "Lex Publica"
 ROP_third_desc: "The whims of tyrants bring chaos, but the Twelve Tables bring order. We have codified a new legal system based on the ancient Roman ideal that the law applies equally to all citizens, ensuring a stability that feudal kingdoms can never achieve."
 ROP_fourth: "The New Testudo"
 ROP_fourth_desc: "Our militias stand shoulder to shoulder, locking their shields against the charge of foreign cavalry. Like the legions of old, we do not break and we do not flee; we hold the line for the Republic with stoic determination."
 ROP_fifth: "The Workshops of Italy"
 ROP_fifth_desc: "From the glassblowers of Venice to the armorers of Milan, the peninsula is the manufactory of Europe. By nationalizing the guilds and removing internal tolls, we unleash the full productive power of the Italian artisan."
 ROP_sixth: "Mare Nostrum"
 ROP_sixth_desc: "It is the destiny of Rome to unite the shores of the Great Sea, integrating new territories into our system with the ruthless efficiency of our ancestors."
 ROP_seventh: "The Holy See of the People"
 ROP_seventh_desc: "We have separated the faith from the corruption of the Curia. Whether the people look to the Pope, the Patriarch, or the Scriptures alone, the Commune ensures that the Church serves the flock rather than fleecing it. All roads to salvation now pass through the will of the people."
 FRP_ideas: "Communard Ideas"
 FRP_ideas_start: "Communard Traditions"
 FRP_ideas_bonus: "Communard Ambition"
 FRP_first: "The Departmental System"
 FRP_first_desc: "Feudal borders are drawn by marriage and inheritance, creating a chaotic patchwork of laws and tolls. We have redrawn the map with the pen of reason. By dividing the land into rational, equal departments, we ensure that the writ of the Federation runs swiftly from Paris to the furthest frontier."
 FRP_second: "The National Workshops"
 FRP_second_desc: "The old guilds choked innovation to protect the privileges of the few. We have smashed their monopolies and standardized the currency. The idle wealth of the aristocracy is now fuel for the furnaces of industry, ensuring that French coin remains as strong as French steel."
 FRP_third: "The Civil Constitution"
 FRP_third_desc: "Faith is a matter for the soul, not the magistrate. Whether a citizen kneels to Rome, Geneva, or the Supreme Being, their loyalty to the Federation is all that matters. We have stripped the clergy of their political venom, leaving only the purity of their prayers."
 FRP_fourth: "Public Works of the Federation"
 FRP_fourth_desc: "The palaces of Versailles stand empty, monuments to vanity. We pour that stone and mortar into bridges, canals, and sanitation. While kings build statues to themselves, the Federation builds the infrastructure of a modern state."
 FRP_fifth: "The Sister Republic"
 FRP_fifth_desc: "Monarchs tremble at our name, but the oppressed look to us with hope. We conduct our diplomacy not in the shadowed whispers of royal courts, but with the booming voice of a liberated people. We are the proof that a great power can exist without a crown."
 FRP_sixth: "La Levée en Masse"
 FRP_sixth_desc: "The King's army fought for pay and fear of the lash. Our army fights for survival and liberty. From the Pyrenees to the Rhine, the call has gone out: the Republic is in danger, and every able-bodied citizen is now a soldier of the Federation."
 FRP_seventh: "Careers Open to Talent"
 FRP_seventh_desc: "No longer does the baton of command belong to the highborn. In the Federation, a marshal's baton lies in every soldier's knapsack. By ensuring that only the most capable rise to leadership, we secure a stability that the inbred dynasties of Europe can never match."
 CLT_peasant_ideas: "Celtic Confederacy Ideas"
 CLT_peasant_ideas_start: "Celtic Traditions"
 CLT_peasant_ideas_bonus: "Celtic Ambition"
 CLT_peasant_first: "The Faithful Host"
 CLT_peasant_first_desc: "We fight not for the coin of a king, but for the sanctity of our homes and the glory of God. Every village kirk serves as a muster point, raising a vast army of believers ready to die for the Commonwealth."
 CLT_peasant_second: "Revive the Old Tongues"
 CLT_peasant_second_desc: "For centuries, the languages of the invader have dominated our courts and markets. We are scrubbing the slate clean, restoring the Gaelic and Brythonic tongues to their rightful place as the sole voice of the people."
 CLT_peasant_third: "Martyrs of the Commonwealth"
 CLT_peasant_third_desc: "Let the enemy come with their cannons and their steel. A man who fears God has no reason to fear earthly weapons. Our preachers march alongside the pikemen, steeling their hearts against the terrors of war with promises of eternal salvation."
 CLT_peasant_fourth: "The Common Land"
 CLT_peasant_fourth_desc: "We have torn down the enclosures and returned the fields to those who work them. By organizing communal farming and local councils, we ensure that the harvest feeds the many rather than filling the granaries of an absent lord."
 CLT_peasant_fifth: "Expel the Foreign Merchant"
 CLT_peasant_fifth_desc: "Foreign leeches have drained our wealth for long enough. We are closing our ports to exploitative monopolies and ensuring that the fruits of Celtic labor are sold exclusively by Celtic hands."
 CLT_peasant_sixth: "The Union of the Celts"
 CLT_peasant_sixth_desc: "We are no longer a loose collection of warring tribes. Through the Grand Council, we are knitting the administration of our disparate lands into a single, unbreakable knot, governed efficiently from the center."
 CLT_peasant_seventh: "Council of Elders"
 CLT_peasant_seventh_desc: "Wisdom is found in experience, not bloodlines. We place our trust in those who have proven their dedication to the cause, allowing our most capable leaders to guide the state for as long as the people demand their service."
 UAC_ideas: "United Arab Commune Ideas"
 UAC_ideas_start: "Arab Communes Traditions"
 UAC_ideas_bonus: "Arab Communes Ambition"
 UAC_first: "The Pan-Arab Congress"
 UAC_first_desc: "Tribal boundaries and local customs hinder administrative unification. We have established a central congress to standardize legal codes across the Arab lands. This centralization facilitates the rapid integration of liberated territories into the federal structure."
 UAC_second: "Revive the Canals"
 UAC_second_desc: "Neglect has degraded the ancient irrigation networks of the Nile and Mesopotamia. Collective labor brigades now dredge and expand these waterways. Restoring the water supply lowers development costs and boosts agricultural productivity."
 UAC_third: "The True Ummah"
 UAC_third_desc: "The concept of the Ummah defines the faithful as a community of equals. By dismantling dynastic hierarchies, the Commune aligns political structure with religious doctrine. This adherence to scripture improves relations with other Islamic states and increases monthly piety."
 UAC_fourth: "The Desert Vanguard"
 UAC_fourth_desc: "Bedouin warfare relies on speed and shock. We have standardized these tribal tactics within the federal army. Incorporating light cavalry doctrine reduces maintenance costs and increases combat effectiveness in open terrain."
 UAC_fifth: "Free Caravan Routes"
 UAC_fifth_desc: "Royal tolls and unchecked banditry stifled inland trade. The Commune patrols the routes and has abolished internal tariffs. These measures maximize the volume and profitability of overland caravans."
 UAC_sixth: "Masters of the Sands"
 UAC_sixth_desc: "Desert logistics require specialized knowledge. Our supply lines utilize local understanding of water sources and oasis networks. This adaptation significantly reduces attrition for armies operating in arid environments."
 UAC_seventh: "The New House of Wisdom"
 UAC_seventh_desc: "The state actively funds madrasas and scientific institutes. This patronage attracts scholars from across the Islamic world, lowering the cost of employing skilled administrative and diplomatic advisors."