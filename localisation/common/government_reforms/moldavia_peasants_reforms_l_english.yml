 ganden_phodrang_reform: "The Ganden Phodrang"
 ganden_phodrang_reform_desc: "We have reorganized the governance of the Plateau into a revolutionary 'Cho-sid-nyi'—a dual system of Religion and Politics. The Dalai Lama retains supreme spiritual authority, guiding the nation's Karma and Harmony, while the material administration is entrusted to the Communal Councils. The monastery and the field are now linked; the monk prays for the soul of the worker, and the worker toils for the sustenance of the monk, creating a holy union free from the corruption of feudal lords."
 freemen_primacy_reform: "Virtue of the Freeholder"
 freemen_primacy_reform_desc: "Dependency is the root of tyranny. A man who relies on a lord for his bread will never be truly free. Our Republic champions the virtue of self-reliance, declaring that the independent smallholder is the only moral foundation for a just society. We empower the Razesi because they alone owe nothing to no one."
 ten_year_terms_reform: "Ten-Year Terms"
 ten_year_terms_reform_desc: "Innovation is useful, but consistency is vital. We hereby extend the term of the highest office to ten years to facilitate long-term state planning. While this may slow the influx of new ideas into the administration, it drastically reduces the political capital required to execute complex national projects, ensuring that the government remains focused on execution rather than debate."
 mechanic_half_ten_year_plan_cost_yes: "The cost of enacting §Yten-year plans§! is §Greduced by half§!."
 peasant_tide_reform: "The Peasant Tide"
 peasant_tide_reform_desc: "War is a numbers game, and the Republic plays with a stacked deck. We institutionalize the concept of the 'Nation in Arms,' transforming the population into a vast, renewable resource of violence. Like a rising tide, our advance may be slow, but it is inexhaustible, relentless, and impossible to turn back."
 peasant_bulwark_of_the_faith: "Defenders of the Rite"
 peasant_bulwark_of_the_faith_desc: "In a world drowning in Papist heresy and Heathen aggression, our land is a sacred ark. The Razesi are not merely defending their farms; they are defending the liturgy, the saints, and the sacraments. We pledge ourselves to the Church, granting it the protection the Voivodes could not provide. In return, the Church blesses our cause."
 sfatul_tarii_supremacy_reform: "Supremacy of the Sfatul Tarii"
 sfatul_tarii_supremacy_reform_desc: "A single ruler, no matter how wise, can only serve so many interests. We transfer the reins of state to the council of the land, ensuring that every commune has a representative at the table. This shift moves power away from the capital and into the hands of local advisors, creating a government that is slower to act unilaterally but far more capable of complex legislative work."
 jude_authority_reform: "Supremacy of the Jude"
 jude_authority_reform_desc: "The Sfatul Tarii has become a den of bickering and inaction. A Republic surrounded by wolves cannot afford the luxury of endless debate. We consolidate supreme authority in the hands of the High Magistrate, granting the executive the power to bypass the assembly entirely."
 peasants_enslave_romani_reform: "The Romani Question"
 peasants_enslave_romani_reform_desc: "We threw off the yoke of the Boieri because God wills free men to be free. However, if the Almighty intended the Romani to be masters of their own destiny, He would not have placed them in irons for centuries. Who are we to question the station Providence has assigned them? By assuming stewardship over them, the Republic fulfills a divine mandate to maintain order. To emancipate them would be an act of arrogance against God's design."
 embrace_the_churn_reform: "Mandatory Rotation Act"
 embrace_the_churn_reform_desc: "We have observed that after a decade in power, a ruler begins to confuse the state's treasury with his own pockets. To cure this sickness, we prescribe a radical treatment: the total removal of incumbency. With no hope of re-election and no long-term schemes to distract them, our Magistrates are forced to serve the immediate needs of the people before vanishing back into obscurity."
 mechanic_disables_faction_fatigue_mechanics_yes: "Faction fatigue mechanics will no longer apply when electing a new candidate."
 mechanic_peasant_elections_cant_reelect_yes: "§RYou can't reelect candidates.§!"
 mechanic_peasant_elections_no_ten_year_plan_yes: "§RYou can't enact ten-year plans.§!"
 mechanic_peasant_elections_foreign_candidates_yes: "You can elect candidates from communes you are integrating which will grant you integration progress."
 exemplarists_principle_reform: "Principle of the Model Republic"
 exemplarists_principle_reform_desc: "The greatest weapon against tyranny is not the sword, but the success of our example. If we build a land of plenty where justice reigns and the granaries are full, the serfs of foreign kings will revolt of their own accord. We commit the administration to the perfection of the homeland, proving that a free people can build a civilization that eclipses the decaying empires of the old world."
 leaguists_principle_reform: "Principle of Constitutional Integration"
 leaguists_principle_reform_desc: "The Federal Charter is the supreme law of the land, designed to be expansive and inclusive. We structure our administration to serve as a hub for a continental network of republics. By harmonizing the legal codes of our subjects with our own, the act of annexation ceases to be a diplomatic struggle and becomes a simple administrative formality, costless and inevitable."
 abolitionists_principle_reform: "Principle of Permanent Revolution"
 abolitionists_principle_reform_desc: "When the Boieri savagely murdered the last honorable Voivode, they proved that there is no sin they will not commit to keep the common man in chains. They would rather spend eternity in the fiery lakes of Hell than allow us a single day of liberty! It is our sacred duty as Christians and men of honor to cut down these vile beasts! Christ has redeemed all of us!"