l_english:
 moldavian_voivodate: "Moldavian Voivodate"
 moldavian_voivodate_desc: "A military administration forged by the necessities of the frontier. The Voivode rules as a warlord bound by a cruel reality: he relies on the Razesi to fight the wars, but he relies on the Boyars to fund them. Held hostage by the nobility's wealth and political influence, the throne is forced to appease the aristocracy even as their greed cannibalizes the very army that keeps the nation alive."
 mechanic_enables_estate_razesi_yes: "Enables the §YRazesi§! estate."