 establish_scottish_commune_desc: "\n- @[From.GetTag] §Y[From.GetName]§! will become @ABO §YThe United Clans§!.\n\n- The government rank of @ABO §YThe United Clans§! changes to §YKingdom§!.\n\n- They will gain a permanent claim on all §YScottish§! and §YÆnglish§! culture provinces, as well as the §YBritain§! region.\n\n\nYou can ask loyal £integrated_commune£§YIntegrated Commune§! or §YCossack Protectorate§! subjects to transfer §YScottish§!, §YÆnglish§!, or §YBritain§! region provinces to @ABO §YThe United Clans§!.\n\n§RYOU CANNOT UNDO THIS DECISION! Think carefully on whether or not @[From.GetTag] §Y[From.GetName]§! is the best candidate to form @ABO §YThe United Clans§!."
