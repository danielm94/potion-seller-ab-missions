 invest_adm_commune_integration_desc: "\nWe will begin investing £adm£ §YAdministrative Power§! to integrate @[From.GetTag] §Y[From.GetName]§!.\n\n\nEach point of £adm£ spent provides §Y0.6§! integration progress per month.\n\n\n§YEvery month§!, we will spend a base of §Y4§! £adm£.\nAn additional §G+1§! £adm£ is spent per month for every §Y250§! Governing Capacity §g(after modifiers)§! our country has.\n\n\n§RWe cannot invest £dip£ §YDiplomatic Power§! or £mil£ §YMilitary Power§! at the same time for the same country.§!"
