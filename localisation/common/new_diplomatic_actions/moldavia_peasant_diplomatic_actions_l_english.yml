 stage_coup_commune_integration_title: "Stage Coup in Commune"
 stage_coup_commune_integration_desc: "\nWe will stage a coup in @[From.GetTag] §Y[From.GetName]§! and install a loyal regime.\n\n\nThis will immediately grant §G20%§! of the total integration progress.\n\n\n@[From.GetTag] §Y[From.GetName]§! will gain §R+40§! Liberty Desire and lose §R40§! Trust with us.\n\n\nEvery £allied_commune£ §YCommune Subject§! will gain §R+20§! Liberty Desire and lose §R20§! Trust with us.\n\nThis interaction cannot be used again until the installed ruler has died or lost an election."
 stage_coup_commune_integration_tooltip: "We will gain §G20%§! of the required integration progress with @[From.GetTag] §Y[From.GetName]§!."
 stage_coup_commune_integration_alert_tooltip: "Stage Coup in Commune"
 convert_subject_to_commune: "Establish Commune"
 convert_subject_to_commune_title: "Establish Commune"
 convert_subject_to_commune_desc: "\nWe will abolish the existing regime in @[From.GetTag] §Y[From.GetName]§! and reorganize the state into a §YPeasants' Republic§!, beginning its integration into our sphere.\n\nOnce integration is complete, the target country will become a §YSister Commune§!.\n\nEach point of £dip£ §YDiplomatic Power§! spent provides §Y1§! integration progress per month.\n\n§YEvery month§!, we will spend a base of §Y4§! £dip£.\n\nThe monthly investment is modified by our §YDiplomatic Reputation§!, increasing or decreasing by §G+1§! or §R-1§! £dip£ per point of §YDiplomatic Reputation§! §Gabove§! or §Rbelow§! §Y0§!."
 convert_subject_to_commune_tooltip: "We will integrate @[From.GetTag] §Y[From.GetName]§! and turn them into a £sister_commune£§YSister Commune§!"
