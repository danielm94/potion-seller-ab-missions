 cancel_commune_integration_title: "§OCancel Integration§!"
 cancel_commune_integration_desc: "\nWe will stop integrating @[From.GetTag] §Y[From.GetName]§!.\n\n§RYou will not be refunded any investments you have made towards integrating @[From.GetTag] §Y[From.GetName]§!.\n\nThis decision cannot be undone!§!"
 cancel_commune_integration_tooltip: "We will stop integrating @[From.GetTag] §Y[From.GetName]§!."
