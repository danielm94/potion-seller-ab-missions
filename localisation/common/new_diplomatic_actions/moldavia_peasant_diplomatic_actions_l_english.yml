 establish_illyrian_commune_title: "@ILR Establish Illyria"
 establish_illyrian_commune_desc: "\n- @[From.GetTag] §Y[From.GetName]§! will become @ILR §YThe Illyrian Communes§!.\n\n- The government rank of @ILR §YThe Illyrian Communes§! changes to §YKingdom§!.\n\n- They will gain a permanent claim on all §YSouth Slavic§! provinces in the Balkan region.\n\n\nYou can ask loyal £integrated_commune£§YIntegrated Commune§! or §YCossack Protectorate§! subjects to transfer §YSouth Slavic§! provinces to @ILR §YThe Illyrian Communes§!.\n\n§RYOU CANNOT UNDO THIS DECISION! Think carefully on whether or not @[From.GetTag] §Y[From.GetName]§! is the best candidate to form @ILR §YThe Illyrian Communes§!."
 establish_illyrian_commune_tooltip: "@[From.GetTag] §Y[From.GetName]§! will become @ILR §YThe Illyrian Communes§!"
 integrate_into_illyria: "Transfer to Illyria @ILR"
 integrate_into_illyria_title: "Transfer to Illyria @ILR"
 integrate_into_illyria_desc: "\n@[From.GetTag] §Y[From.GetName]§! will transfer all owned §YSouth Slavic§! provinces to @ILR §Y[ILR.GetName]§!.\n\nNote: If all of @[From.GetTag] §Y[From.GetName]§!'s provinces are of §YSouth Slavic§! culture, they will be §Rfully annexed§! by @ILR §Y[ILR.GetName]§!."
 integrate_into_illyria_tooltip: "@[From.GetTag] §Y[From.GetName]§! will transfer all owned §YSouth Slavic§! provinces to @ILR §Y[ILR.GetName]§!"
