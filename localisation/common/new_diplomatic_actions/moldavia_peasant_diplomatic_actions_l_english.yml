 integrate_commune_title: "Integrate Commune"
 integrate_commune_desc: "\nWe will begin the process of integrating @[From.GetTag] §Y[From.GetName]§!. Every month we will spend £dip£ §YDiplomatic Power§! integrating @[From.GetTag] §Y[From.GetName]§!. You can also switch to spending £adm£ §YAdministrative Power§! or £mil£ §YMilitary Power§! instead once you begin integrating.\n\nOnce the integration is complete, @[From.GetTag] §Y[From.GetName]§! will become our [get_commune_subject_next_stage].\n\n[get_commune_subject_mechanics]"
 integrate_commune_tooltip: "We will start integrating @[From.GetTag] §Y[From.GetName]§!.\n§ONext Stage§!: [get_commune_subject_next_stage]"
 integrate_commune_alert_tooltip: "@[Root.GetTag] §Y[Root.GetName]§! wants to integrate us!"
