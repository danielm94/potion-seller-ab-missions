 leave_peasant_league_title: "Leave Peasant League"
 leave_peasant_league_desc: "\nWe will no longer be a subject of @[From.GetTag] §Y[From.GetName]§!.\n\nThis will §Rupset§! @[From.GetTag] §Y[From.GetName]§!.\n\n@[From.GetTag] §Y[From.GetName]§! will §Rgain a casus belli§! to force us to become their subject again."
 leave_peasant_league_tooltip: "We will no longer be a subject of @[From.GetTag] §Y[From.GetName]§!"
 leave_peasant_league_alert_tooltip: "Leave Peasant League"
