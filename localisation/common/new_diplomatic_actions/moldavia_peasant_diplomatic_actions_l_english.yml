 stage_mass_peasant_uprising_desc: "\nWe will lose §R-[Root.stage_mass_peasant_uprising_cost_var.GetValue]§! spy network in @[From.GetTag] §Y[From.GetName]§!.\n\nWe will lose §R25%§! of our §Yyearly income§!¤ to support the uprising.\n\n§YPeasant Rebel§! armies will rise up in every §Y[From.GetAdjective]§! province with the \n£radicalized_peasantry£ §YRadicalized Peasantry§! modifier.\n\nThe £radicalized_peasantry£ §YRadicalized Peasantry§! modifier will be §Rremoved§! in every province where it was spread using the §YIncite Peasants§! covert diplomatic action. §gThe modifier will not be removed in provinces where it spreads naturally.§!\n\n@[From.GetTag] §Y[From.GetName]§! will not suffer any unrest where §YPeasant Rebels§! are likely to rise up for §Y10 years§!. §gYou will not be able to support §YPeasant Rebels§! in @[From.GetTag] §Y[From.GetName]§! during that time.§!\n\nYou §Rcannot use this diplomatic action§! against @[From.GetTag] §Y[From.GetName]§! for the next §Y10 years§!.\n\nYou will gain §R+5§! Aggressive Expansion with @[From.GetTag] §Y[From.GetName]§! and the §YHoly Roman Emperor§!, @[Emperor.GetTag] §Y[Emperor.GetName]§!. §gAE calculations do apply.§!\n\nYou will gain  §R+2§! Aggressive Expansion with §Revery prince§! in the §YHoly Roman Empire§! that isn't a §Ypeasants' republic§!. §gAE calculations do apply.§!\n\n§gIf the §YPeasant Rebels§! successfully enforce their demands, @[From.GetTag] §Y[From.GetName]§! will become a §YPeasants' Republic§!, allowing us to turn them into a  £allied_commune£ §YCommune Subject§! §Gdiplomatically§!.§!"
 stage_mass_peasant_uprising_tooltip: "Peasant rebel armies will rise up in every §Y[From.GetAdjective]§! province with the £radicalized_peasantry£ §YRadicalized Peasantry§! modifier."
