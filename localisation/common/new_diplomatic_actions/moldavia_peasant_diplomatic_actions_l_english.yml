 invest_mil_commune_integration_desc: "\nWe will begin investing £mil£ §YMilitary Power§! to integrate @[From.GetTag] §Y[From.GetName]§!.\n\n\nEach point of £mil£ spent provides §Y0.5§! integration progress per month.\n\n\n§YEvery month§!, we will spend a base of §Y4§! £mil£.\nAn additional §G+1§! £mil£ is spent for every §Y20%§! Army Tradition or Army Professionalism, up to a maximum of §Y+10§!.\n\n\n§RWe cannot invest £adm£ §YAdministrative Power§! or £dip£ §YDiplomatic Power§! at the same time for the same country.§!"
