 invite_to_peasant_league: "Invite to League"
 invite_to_peasant_league_title: "Invite to League"
 invite_to_peasant_league_desc: "We will invite them into our peasant league.\n\nIf they accept the offer:\n- §Y[From.GetName]§! will become an §YAllied Commune§! of ours.\n- §YThe Leaguists§! will gain §Y+5§! faction influence.\n\nIf they reject the offer:\n- Lose §R5§! Prestige\n- We will gain the §YPeasant League Integration§! casus belli against them for §Y5 years§!, allowing us to force them to become an §YAllied Commune§!."
 invite_to_peasant_league_tooltip: "We will invite them into our peasant league, making them an §YAllied Commune§! subject of ours.\n\nIf they reject our offer, we will §Ggain§! a §Ycasus belli§! against them to force them into our league."
 invite_to_peasant_league_alert_tooltip: "Invite to League"
 invite_to_peasant_league_dialog: "By accepting, we will become an §YAllied Commune§! §Rsubject§! of §Y[Root.GetName]§!.\n\nIf we reject their offer, our relations with them will worsen, and they will gain a §Ycasus belli§! against us to force us into their league."
