 incite_peasants_on_cooldown_tt: "We haven't incited the peasants against them in the last §Y10§! years."
 incite_peasants: "Incite Peasants"
 incite_peasants_title: "Incite Peasants"
 incite_peasants_desc: "\nWe will lose §R-[Root.incite_peasants_cost_var.GetValue]§! Spy Network in @[From.GetTag] §Y[From.GetName]§!.\n\n[incite_peasants_desc_modifier_applied]\n\n[incite_peasants_desc_radicalized_peasantry]\n\nAny temporary instance of the £radicalized_peasantry£ §YRadicalized Peasantry§! modifier will have its duration §Grefreshed§! to §Y10 years§!.\n\n§YPeasant Rebels§! will gain §G+50%§! uprising progress in @[From.GetTag] §Y[From.GetName]§!.\n\n[incite_peasants_desc_overthrow_explained]"
 incite_peasants_tooltip: "[custom_incite_peasants_tooltip]"
 custom_incite_peasants_gpw_tooltip: "@[From.GetTag] §Y[From.GetName]§! will suffer severe Unrest, and the £radicalized_peasantry£ §YRadicalized Peasantry§! modifier will spread across large swathes of their territory."
 custom_incite_peasants_regular_tooltip: "@[From.GetTag] §Y[From.GetName]§! will suffer increased Unrest, and the £radicalized_peasantry£ §YRadicalized Peasantry§! modifier will be applied to a random province."
 incite_peasants_desc_gpw_modifier_applied: "@[From.GetTag] §Y[From.GetName]§! will gain the modifier §YInsurrectionary Peasantry§! for §Y10 years§! which grants the following:\n- National Unrest: §R+4.00§!\n- National Tax Modifier: §R-20.0%§!\n- Foreign Spy Detection: §R-25.0%§!"
 incite_peasants_desc_regular_modifier_applied: "@[From.GetTag] §Y[From.GetName]§! will gain the modifier §YIncited Peasantry§! for §Y10 years§! which grants the following:\n- National Unrest: §R+2.00§!\n- National Tax Modifier: §R-10.0%§!"
 incite_peasants_desc_radicalized_peasantry_regular: "The £radicalized_peasantry£ §YRadicalized Peasantry§! modifier will be applied for §Y10 years§! to a random province in @[From.GetTag] §Y[From.GetName]§! that §Ydoesn't already have it§!, which has the following effect:\n- Local Unrest: §R+10.00§!\n- Only §YPeasant Rebels§! can rise up from the province."
 incite_peasants_desc_radicalized_peasantry_gpw: "The £radicalized_peasantry£ §YRadicalized Peasantry§! modifier will be applied for §Y10 years§! to §Yhalf§! of all provinces in @[From.GetTag] §Y[From.GetName]§! that §Ydon't already have it§!, which has the following effect:\n- Local Unrest: §R+10.00§!\n- Only §YPeasant Rebels§! can rise up from the province."
 incite_peasants_desc_overthrow_explained_has_rad_pes: "§g@[From.GetTag] §Y[From.GetName]§! already has a province with the £radicalized_peasantry£ §YRadicalized Peasantry§! modifier, which is required to establish a £allied_commune£ §YCommune Subject§!.\n\nTo unlock the §YGreat Peasant Uprising§! Casus Belli, you must now support §YPeasant Rebels§! in their country.§!"
 incite_peasants_desc_overthrow_explained_not_has_rad_pes: "§g----------------------------------------------------------------------------------\n\nTo establish a £allied_commune£ §YCommune Subject§! in @[From.GetTag] §Y[From.GetName]§!, you must first use this action to apply the £radicalized_peasantry£ §YRadicalized Peasantry§! modifier to at least §Y1§! of their provinces. \n\n§gThe £radicalized_peasantry£ §YRadicalized Peasantry§! modifier usually spreads automatically to countries that directly border §Yyou§!, your £allied_commune£ §YCommune Subject§!, or your §YConsulate Subjects§!. Use this action to apply it to non-neighboring countries within range.\n\nOnce the modifier is present, you must support §YPeasant Rebels§! to unlock the §YGreat Peasant Uprising§! Casus Belli.§!" 
 incite_peasants_alert_tooltip: "Incite Peasants"
 incite_peasants_spy_network_size_tt: "Have a Spy Network in §Y[From.GetName]§! of at least size §Y[Root.incite_peasants_cost_var.GetValue]§!."
