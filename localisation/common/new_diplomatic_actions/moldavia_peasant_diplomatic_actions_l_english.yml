 export_egyptian_grain_title: "Gift Egyptian Grain"
 export_egyptian_grain_desc: "\n@[From.GetTag] §Y[From.GetName]§! will gain the modifier §YEgyptian Grain Dole§! for §Y5 years§! which grants them the following:\n§G+10%§! National Manpower Modifier\n§G+10%§! Manpower Recovery Speed\n\n[export_egyptian_grain_grain_target] It will cost us §R5% of our yearly income§! to ship the grain.\n\nOur relations will improve by §G+50§! with @[From.GetTag] §Y[From.GetName]§!\n\nWe will gain §G+5§! §YTrust§! with @[From.GetTag] §Y[From.GetName]§![export_egyptian_grain_subject_bonus]"
 export_egyptian_grain_tooltip: "We will send §YGrain§! from §YEgypt§! to @[From.GetTag] §Y[From.GetName]§!, which will improve relations with them.\n"
 export_egyptian_grain_self_grain_target: "One of our owned §YGrain§!-producing provinces in §YEgypt§! will lose §R1§! Base Production."
 export_egyptian_grain_subject_grain_target: "One of our £integrated_commune£ §YIntegrated Commune§!'s §YGrain§!-producing provinces in §YEgypt§! will lose §R1§! Base Production. They will expect §R10% of our yearly income§! as compensation."
 export_egyptian_grain_is_subject: "\n\n@[From.GetTag] §Y[From.GetName]§! will lose §G10§! Liberty Desire."
