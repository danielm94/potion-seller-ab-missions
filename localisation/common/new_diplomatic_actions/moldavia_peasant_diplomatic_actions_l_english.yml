 invest_dip_commune_integration_desc: "\nWe will begin investing £dip£ §YDiplomatic Power§! to integrate @[From.GetTag] §Y[From.GetName]§!.\n\n\nEach point of £dip£ spent provides §Y1§! integration progress per month.\n\n\n§YEvery month§!, we will spend a base of §Y4§! £dip£.\nThe monthly investment is modified by our §YDiplomatic Reputation§!, increasing or decreasing by §G+1§! or §R-1§! £dip£ per point of §YDiplomatic Reputation§! §Gabove§! or §Rbelow§! §Y0§!.\n\n\n§RWe cannot invest £adm£ §YAdministrative Power§! or £mil£ §YMilitary Power§! at the same time for the same country.§!"
 invest_dip_commune_integration_tooltip: "We will begin investing £dip£ §YDiplomatic Power§! to integrate @[From.GetTag] §Y[From.GetName]§!."
