l_english:
 peasant_expansion_mod: "Export the Revolution"
 desc_peasant_expansion_mod: "The fires of liberty cannot be contained by borders. We actively fund dissidents and arm the peasantry of rival nations, destabilizing their regimes while our armies march to deliver the final blow."
 peasant_expansion_mod_enhanced: "The Phenian Method"
 desc_peasant_expansion_mod_enhanced: "We have refined liberation into a science. Through absolute discipline and overwhelming force, we shatter the will of the enemy and enforce the freedom of the peasantry with a ruthless efficiency."
 peasant_development_mod: "Domestic Focus"
 desc_peasant_development_mod: "We turn our gaze inward. The army stands down so that men may return home to their fields and their families."
 peasant_development_mod_enhanced: "The Jodo Doctrine"
 desc_peasant_development_mod_enhanced: "We have embraced the pursuit of the Pure Land. The Federation closes its gates to the distractions of foreign conflict, channeling every ounce of its energy into perfecting the society we have already built."
 peasant_diplomacy_mod: "Mobilize the Masses"
 desc_peasant_diplomacy_mod: "We channel our revolutionary fervor directly into the lands of our subjects, bypassing their local rulers to speak to the common man. By organizing unions and peasant councils within their borders, we ensure the local population is more loyal to the Federation than to their own government, making integration a mere formality."
 peasant_diplomacy_mod_enhanced: "Harmonious Integration"
 desc_peasant_diplomacy_mod_enhanced: "We have fused revolutionary agitation with the meticulous efficiency of the Chinese Civil Service. We no longer just pressure subjects; we structurally absorb them. Our clerks standardize their laws and taxes long before the borders change, ensuring that when the time comes, the subject state dissolves into the Federation with the natural inevitability of a river flowing into the sea."