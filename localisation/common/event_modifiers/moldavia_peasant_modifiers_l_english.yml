 moldavia_civil_war_recovery: "Recovering From the Civil War"
 desc_moldavia_civil_war_recovery: "$TODO$"
 incited_peasantry: "Incited Peasantry"
 desc_incited_peasantry: "$TODO$"
 negate_moldavian_commune_reform_ccr: "Negated Commune Coring Penalty"
 boieri_purged: "Boieri Purged"
 desc_boieri_purged: "$TODO$"
 mop_zaz_subject_bonus: "The Dniester Pact"
 desc_mop_zaz_subject_bonus: "Mutual trust with the Zaporizhian Host grants us the favor of the Cossacks and the service of their horsemen along our frontier."
 cossack_protectorate_subject_modifier: "Cossack Protectorate"
 cossack_protectorate_overlord_modifier: "Cossack Military Integration"
 cossack_protectorate_overlord_bonus_1: "Rider-Levies of the Host"
 desc_cossack_protectorate_overlord_bonus_1: "The Zaporizhian Host musters fresh squadrons under our colors. With forage secured and remounts guaranteed, our cavalry strikes harder across the steppe."
 cossack_protectorate_overlord_bonus_2: "Host Shock Corps"
 desc_cossack_protectorate_overlord_bonus_2: "Picked sotnias form a vanguard of mailed riders. Drill and shared depots cut the cost of keeping them in the saddle—and their first charge tells."
 cossack_protectorate_overlord_bonus_3: "Wings of the Steppe"
 desc_cossack_protectorate_overlord_bonus_3: "Our battle line bends to the Host’s way of war: more horse than foot, and wide flanking arcs that break formations before they can wheel."
 cossack_protectorate_overlord_bonus_4: "Steppe Lightning"
 desc_cossack_protectorate_overlord_bonus_4: "Couriers, guides, and spare mounts turn marches into sudden apparitions. When we arrive, the shock is not only in the blow but in the speed that delivers it."
 cossack_protectorate_merchant_bonus_1: "Large Cossack Protectorate"
 cossack_protectorate_merchant_bonus_2: "Huge Cossack Protectorate"
 kievan_commune: "The Kievan Commune"
 desc_kievan_commune: "Within the walls of Kyiv we have established a Dacian enclave — a self-governing commune of merchants, craftsmen, and soldiers."
 azov_commune: "The Azov Commune"
 desc_azov_commune: "Once a nest of slavers and raiders, Azov now serves as the southern anchor of Dacian commerce. From its fortified quays our merchants and shipwrights oversee the Cossack fleets, and the city’s workshops hum with free labor. Though its autonomy is broad, it has become the heart of our influence upon the Black Sea."
 azov_abolition_shock: "Aftermath of Abolition"
 desc_azov_abolition_shock: "The slave pens of Azov stand empty, their keepers fled or slain. In the wake of emancipation, the city reels—its markets silent, its merchants ruined. The people struggle to find new purpose as Dacian overseers and abolitionist envoys work to rebuild the port upon just foundations."
 great_kievan_commune: "The Great Kievan Commune"
 desc_great_kievan_commune: "Reformed councils, paved quays, and the endowments of the Kyievo-Pecherska Lavra have remade Kyiv into a self-directing metropolis."
 astrakhan_commune: "The Astrahan Commune"
 desc_astrakhan_commune: "At the mouth of the Volga, Astrahan has become our eastern bastion and gateway to the Caspian. Its councils rule with broad autonomy, overseeing the fleets, granaries, and caravans that pass between the steppes and the sea. From this city flow the goods of the Orient and the wealth of the river, all tallied under the ledgers of the communes."
 zaz_hegemon_of_ruthenia: "Hegemon of Ruthenia"
 desc_zaz_hegemon_of_ruthenia: "The Zaporizhian Host stands unchallenged across Ruthenia’s plains. Local chanceries bow to the mace of the Hetman, and petitions are judged in the Host’s camp. With roads secured and scribes set to work, claims harden into law and new lands are folded into the Host at a stroke."
 astrakhan_gate: "The Caspian Gate"
 desc_astrakhan_gate: "Guarding the mouth of the mighty Volga, Astrahan stands as our eastern gate to the Silk Road. Its docks bustle with merchants from every corner of the steppe, and its fortifications ensure that the wealth of the Caspian flows safely into our markets."
 azov_gate: "The Black Sea Gate"
 desc_azov_gate: "Azov commands the Dnieper’s final passage into the Black Sea. Its ports teem with ships laden in grain and furs, while vigilant garrisons and merchant guilds alike ensure that no trade escapes our grasp."
 mop_the_end_of_the_boierimea: "The End of the Boierimea"
 desc_mop_the_end_of_the_boierimea: "With the old boyar order shattered and their estates cast down, the razesi stand prouder than ever. The fields once plowed for their masters now yield for free men, and every Vlach who bears a spear does so for his own kin and land."
 mop_purging_the_ten_houses: "Purging the Ten Houses"
 desc_mop_purging_the_ten_houses: "The noble manors burn, the land lies barren, and whole villages drown in blood and smoke. Until the last of the Ten Houses is torn out by its roots, Wallachia will know no peace."
 mop_supporting_rebels_bul: "Arming the Bulgar Villages"
 desc_mop_supporting_rebels_bul: "Coins, grain, and hidden blades flow south across the Danube. Our agents guide smugglers through the hills, slip pikes into the hands of shepherds, and fuel every rumor that stirs the fields. With our backing, the Bulgar peasants stand one spark away from open revolt."
 mop_soothe_relations_post_bulgarian_liberation: "Assurances to the Balkans"
 desc_mop_soothe_relations_post_bulgarian_liberation: "Envoys ride to every court from the Danube to Anatolia, repeating the same careful line: the fall of the Bulgar nobles was a correction of a cruel order, not a crusade against all thrones. We send gifts, sign treaties, and swear that their peasants are safe from our banners. For now, the chancelleries breathe easier—and our Leaguists learn which doors open to a friendly smile."
 mop_exemplary_society: "Exemplary Society"
 desc_mop_exemplary_society: "Our communes stand as a beacon for all who dwell beyond the mountains. Prosperity is shared, justice is even-handed, and every village thrives. Subjects who once kept us at arm's length now seek entry into our league, hoping their own people may be uplifted by our example. The world sees what the free and united can build—and many wish to join our number."
 mop_pest_crowning_achievement: "Crowning Achievement of Pest"
 desc_mop_pest_crowning_achievement: "Once a tribal stronghold, Pest has been rebuilt into the pride of the Carpathian communes. Its markets bustle with trade, its councils run with unmatched efficiency, and its people live in prosperity rare even among our own lands. Travelers speak of it as the jewel of Dacia—a living testament to what free peasants can build together."
 mop_church_of_the_dormition_of_the_martyrs: "The Church of the Dormition of the Martyrs"
 desc_mop_church_of_the_dormition_of_the_martyrs: "A beautiful Orthodox church constructed in memory of the last honorable Voivode, [assassinated_moldavian_voivode.GetName], and the fallen of the Moldavian Civil War."
 gate_of_the_danube: "Gate of the Danube"
 desc_gate_of_the_danube: "This port stands as one of the river’s great locks. Its piers, custom houses, and watchtowers oversee the flow of trade from the heart of Europe to the Black Sea, ensuring that no cargo passes without leaving a share in our coffers."
 mop_patriarchate_of_stamboli: "Patriarchate of Stamboli"
 desc_mop_patriarchate_of_stamboli: "The Cross now serves the Communes. The spiritual leader of the Orthodox world speaks with our voice, his authority an instrument of our state."
 mop_stamboli_commune: "Commune of Stamboli"
 desc_mop_stamboli_commune: "The former imperial capital has been reorganized as a directly administered federal commune. Local autonomy is guaranteed for the city’s workers and guilds, while its strategic position grants immense influence over the trade flowing through the straits. Under communal stewardship, Stamboli stands as a thriving port, a developing hub, and a symbol of the united peasantry’s triumph over imperial rule."
 mop_commune_of_dubrovnik: "Commune of Dubrovnik"
 desc_mop_commune_of_dubrovnik: "Once a citadel of merchant patricians, Dubrovnik has been reshaped into a federal commune-port. Its burghers enjoy broad local autonomy, but the city’s docks, countinghouses, and convoys now serve the interests of the peasantry, not a handful of oligarchs. As the Adriatic’s key free harbor of the federation, Dubrovnik channels trade, expertise, and investment into our wider network of communes."
 mop_great_commune_of_dubrovnik: "Great Commune of Dubrovnik"
 desc_great_commune_of_dubrovnik: "Dubrovnik has risen from a modest commune-port to a true maritime powerhouse of the federation. Its harbors are crowded with communal fleets, its quays lined with warehouses and arsenals, and its councils staffed by experienced sailors and merchants loyal to the peasantry."
 mop_prepare_to_confront_venice: "Preparing to Confront Venice"
 desc_mop_prepare_to_confront_venice: "The rise of Dubrovnik as a great commune-port has forced us to look squarely across the water at Venice, the foremost oligarchic republic of the Adriatic. If we are to challenge its fleets and break its grip on maritime trade, we must invest heavily in our own navy—expanding our docks, drilling new crews, and launching ship after ship."
 mop_balkan_liberator: "Balkan Liberator"
 desc_mop_balkan_liberator: "The banners of our communes fly over the cities and mountain passes of the Balkans, and the old aristocracies tremble at the sight."
 mop_the_legend_of_bogdan_razesul: "The Legend of Bogdan Razesul"
 desc_mop_the_legend_of_bogdan_razesul: "$TODO$"
 mop_chalcedon_commune: "Chalcedon Commune"
 desc_mop_chalcedon_commune: "The ancient town of Chalcedon has been reorganized into a communal enclave overseeing the Asian shore of the Bosphorus. Its councils maintain the docks, patrol the strait, and regulate passage between the seas, ensuring that no warlord or officer caste can ever again dominate these vital waters."
 gate_of_the_bosporus: "Gate of the Bosporus"
 desc_gate_of_the_bosporus: "Massive harbor works, layered fortifications and communal customs houses dominate this stretch of the Bosporus. Patrol galleys and shore batteries ensure that no ship can slip past untaxed, while the flow of goods between the Black Sea and the Mediterranean is carefully measured and tithed. So long as these gates remain in our hands, the wealth of two seas is drawn into our coffers."
 mop_krakow_commune: "The Cracovia Commune"
 desc_mop_krakow_commune: "A communal enclave governs Cracovia’s markets and salt works, reducing local costs and strengthening control over regional trade."
 mop_moscow_commune: "The Moscova Commune"
 desc_mop_moscow_commune: "In the shadow of the Kremlin, the Moscova Commune stands as an island of peasant rule amidst the ruins of princely power."
 mop_great_fortress_commune_of_moscow: "The Great Fortress Commune of Moscova"
 desc_mop_great_fortress_commune_of_moscow: "Moscova has been remade as a fortress-city of the communes: its walls thickened, its towers bristling with guns, its streets threaded with magazines, granaries and mustering yards. From here the councils can govern the surrounding lands with a firm hand, sustain large standing forces at lower cost, and command the trade that flows through the heart of Rus."
 mop_great_krakow_commune: "The Great Cracovian Commune"
 desc_mop_great_krakow_commune: "This city has been forged into the logistical heart of the region. The salt trade flows efficiently into the republic's coffers, while the expanded guilds ensure that our armies in the west are the best supplied in Europe."
 consulate_overlord_modifier: "Is Overlord of a Consulate"
 agitated_guilds_mod: "Guild Sedition"
 desc_agitated_guilds_mod: "Agents from the Peasant Republic have infiltrated the guild halls and dockyards. They are inciting strikes, demanding the abolition of tariffs, and turning the merchant class against the crown."
 radicalized_peasantry: "Radicalized Peasantry"
 desc_radicalized_peasantry: "The peasants in this province have witnessed the freedoms enjoyed by their brethren across the border. They no longer accept the divine right of lords to rule over them, and whispers of revolution are turning into open defiance."
 mop_kazan_commune: "The Cazan Commune"
 desc_mop_kazan_commune: "Once the jewel of the Golden Horde, Cazan has been stripped of its aristocratic trappings. It now stands as the administrative capital of the Eastern Frontier, managing the flow of trade from Siberia and guarding the Republic against the threats of the deep steppe."
 mop_great_kazan_commune: "The Great Cazan Commune"
 desc_mop_great_kazan_commune: "Cazan has evolved into the military and logistical capital of the Republic's eastern territories. Supplies, recruits, and orders flow from the Kremlin to every Krepost on the line, ensuring that the frontier remains secure against any threat."
 mop_krepost: "Krepost"
 desc_mop_krepost: "This province is part of the Great Abatis Line. The fortress here serves as a defensive structure and as a hub for soldier-settlers and colonial administration. The local population is organized to maintain the defenses and till the land in exchange for military service."
 mop_arhanghel_commune: "The Arhanghel Commune"
 desc_mop_arhanghel_commune: "The northern gateway to the world is now under the direct administration of the Republic. Through these icy waters, the wealth of the Federation flows to the wider world."
 mop_port_of_arhanghel: "The White Sea Gateway"
 desc_mop_port_of_arhanghel: "Dredged, fortified, and expanded, this port now serves as our gateway to the Atlantic. It brings in the wealth of the Atlantic and exports the resources of the East, operating far beyond the reach of the Baltic powers."
 port_of_anhanghel_desc: "We control the port of Arhanghel"
 mop_dock_arctic_negation: "Winterized Infrastructure"
 desc_mop_dock_arctic_negation: "Advanced logistical networks and heated warehouses allow this port to operate at full capacity despite the harsh climate. The infrastructure effectively negates the logistical penalties of the Arctic winter."
 mop_gdansc_commune: "The Gdansc Commune"
 desc_mop_gdansc_commune: "The wealthy patricians of the Hansa have been expelled from the city. The great crane of the harbor now lifts grain for the common granaries, and the Vistula trade is finally free from the tolls of the German lords."
 mop_riga_commune: "The Riga Commune"
 desc_mop_riga_commune: "Once the headquarters of the Crusader orders, Riga has been cleansed of its military aristocracy. It now serves as the commercial heart of the Baltic, acting as a funnel for the immense wealth of the interior forests to flow into the Republic."
 mop_great_port_of_gdansc: "The Great Port of Gdansc"
 desc_mop_great_port_of_gdansc: "The Hanseatic patricians have been expelled, and their exclusive trade rights abolished. The port is no longer a private enterprise of the German merchant guild, but the sovereign gateway of the Federation, enforcing our will upon the Baltic waves."
 mop_holy_commune_of_riga: "The Holy Commune of Riga"
 desc_mop_holy_commune_of_riga: "Where once the Livonian Knights plotted war against the Orthodox faithful, a new Patriarch now sits. The city has been transformed into a beacon of the true faith, guiding the spiritual life of the Baltic peoples and funding the church with its immense commercial wealth."
 mop_commune_of_khiva: "The Khiva Terminus"
 desc_mop_commune_of_khiva: "Khiva has been transformed from a Khanate stronghold into the primary logistical hub of the Central Asian steppe. Caravans from China and India are taxed and processed here before being sent west to the Federation's heartland."
 mop_great_commune_of_khiva: "The Great Khiva Terminus"
 desc_mop_great_commune_of_khiva: "The ancient walls of the Itchan Kala now guard a thoroughly modern logistical miracle. Khiva serves as the central switching station for the entire Silk Road, processing the wealth of the East before funneling it westward across the new steppe highway."
 mop_siberian_frontier_subject: "Expand into Siberia"
 desc_mop_siberian_frontier_subject: "Nobody is going to read this shit, honestly. It's just so VSCode stops highlighting the modifier with the piss colored squiggly line yes I know I'm unhinged."
 mop_qaraqorum_commune: "The Caracorum Commune"
 desc_mop_qaraqorum_commune: "The ancestral seat of the Yuan has been converted into the administrative center of our eastern frontier. Where Khans once issued decrees to an empire, Republican governors now manage the logistics of the occupation. The city stands as a permanent reminder to the steppe tribes that the old dynasty is gone, and the Federation is here to stay."
 mop_great_qaraqorum_commune: "The Great Caracorum Commune"
 desc_mop_great_qaraqorum_commune: "The city has evolved from a military outpost into a thriving capital of the steppe. The twenty thousand soldiers who settled here have integrated with the local population, creating a unique martial society that serves as the unbreakable eastern shield of the Federation."
 mop_beijing_legation_city: "Pechin Legation Quarter"
 desc_mop_beijing_legation_city: "The Republic administers a fortified district within Beijing, serving as the central hub for diplomatic correspondence with the shattered remnants of the Chinese bureaucracy. While the city remains Chinese in custom and law, the real power resides in the Legation."
 mop_hangzhou_legation_city: "Hangciu Legation Quarter"
 desc_mop_hangzhou_legation_city: "At the southern terminus of the Grand Canal, the Republic has established a sovereign trade zone. We do not govern the weavers or the farmers, but we control the warehouses and the docks. By managing the flow of goods from the Yangtze Delta, we siphon the wealth of the interior into our own coffers."
 mop_canton_legation_city: "Canton Legation Quarter"
 desc_mop_canton_legation_city: "The Pearl River is the gateway to the southern seas, and we hold the gate. The Republic administers the port facilities and shipyards of Canton as an extraterritorial zone. It serves as the primary naval link between the Federation and the Far East, outfitting our fleets with local labor and materials."
 mop_chengdu_legation_city: "Cengdu Legation Quarter"
 desc_mop_chengdu_legation_city: "Deep in the Sichuan Basin, isolated by mountains, the Republic maintains a strategic foothold. This administrative zone oversees the vast manpower reserves of the region, ensuring that the 'Granary of Heaven' supplies the Republican armies rather than local warlords."
 mop_xian_legation_city: "Sian Legation Quarter"
 desc_mop_xian_legation_city: "As the historic starting point of the Silk Road, Sian is the vital link connecting China to our Central Asian territories. Our legation here focuses purely on logistics, ensuring that the caravan routes flowing west remain open, secure, and profitable for the Federation."
 mop_dragon_slayer: "Dragon Slayer"
 desc_mop_dragon_slayer: "The Azure Sky is dead; the Yellow Sky has risen.\nThe Dragon falls to the earth; the Mandate returns to the soil.\nIn the year of our victory, there is prosperity under Heaven."
 mop_vladivostoc_commune: "The Vladivostoc Commune"
 desc_mop_vladivostoc_commune: "We have reached the edge of the continent. Vladivostoc stands as the Republic's watchtower over the Pacific. Its shipyards labor day and night to turn Manchurian timber into a fleet capable of challenging the empires of the sea."
 mop_venture_into_pacific: "Pacific Ambitions"
 desc_mop_venture_into_pacific: "With the eastern coast secured, we look towards the rising sun and the unknown islands beyond. The revolution must carry its message across the waves to new worlds."
 mop_berlin_commune: "The Berlin Commune"
 desc_mop_berlin_commune: "We have transformed this city into the westernmost bastion of the Federation. Sitting astride the Spree, the Berlin Commune serves as a fortified breakwater, designed to shatter any Imperial offensive that seeks to cross the river and enslave the East."
 mop_great_berlin_commune: "The Great Berlin Commune"
 desc_mop_great_berlin_commune: "The city has been forged into a fortress-metropolis. It serves as the nerve center of the western defense, boasting a martial tradition that rivals ancient Sparta. The Brandenburg Gate stands open to friends of the revolution, but remains an impenetrable barrier to its enemies."
 mop_wendish_fortifications: "The Wendish Shield"
 desc_mop_wendish_fortifications: "A coordinated network of earthworks, river forts, and modern bastions now stretches across the Wendish lands. This defensive line ensures that any invader who manages to cross the border will be bled dry before they can reach the heartland."
 mop_bergenhus_commune: "The Berghenhus Commune"
 desc_mop_bergenhus_commune: "This fortress overlooks the western fjords, serving as the Federation's eyes on the North Sea and a secure harbor for our northern fleets."
 mop_copenhaga_commune: "The Copenhaga Commune"
 desc_mop_copenhaga_commune: "The Key to the Baltic has been secured. No longer the seat of a Danish King, this great port now serves as the administrative heart of the straits, guarding the entrance to the inner seas."
 mop_gotland_commune: "The Gotlanda Commune"
 desc_mop_gotland_commune: "The strategic heart of the Baltic, Visbi has been transformed from a pirate haven into the central logistics hub for the Federation's merchant marine."
 mop_aland_commune: "The Alandia Commune"
 desc_mop_aland_commune: "These islands now serve as the bridge between the Nordic and Kalevalan communes, acting as a vital connection point for the northern wing of the Federation."
 mop_reykjavik_commune: "The Reichiavic Commune"
 desc_mop_reykjavik_commune: "A remote outpost of liberty at the edge of the frozen world, serving as our gateway to the open Atlantic and the unknown lands beyond."
 mop_great_copenhaga_commune: "The Great Copenhaga Commune"
 desc_mop_great_copenhaga_commune: "The Gate of the Baltic is shut, and we hold the only key. The guns of Kronborg ensure that the Federation dictates the flow of every ducat and every vessel in the North."
 mop_sound_toll: "The Sound Dues"
 desc_mop_sound_toll: "Every merchant, king, and pirate who wishes to taste the wealth of the Baltic must first pay their tithe to the Revolution."
 mop_great_gotland_commune: "The Great Gotlanda Commune"
 desc_mop_great_gotland_commune: "Visbi has been reborn as the warehouse of the North. It is the beating heart of our logistics, ensuring that our reach extends from the Neva to the North Sea."
 mop_great_aland_commune: "The Great Alandia Commune"
 desc_mop_great_aland_commune: "A fortress archipelago that dominates the Gulf of Bothnia. From these rocky shores, our fleets can strike at any enemy who dares challenge our supremacy over the Baltic."