l_english:
 exemplarists_dev_plan: "Ten-Year Plan: The Roads Act"
 desc_exemplarists_dev_plan: "Every great nation is built upon strong foundations of infrastructure. If we are to set an example for the world, then we must follow in that tradition. The work begins at once. Roads shall be paved from the capital to the most distant commune."
 exemplarists_build_plan: "Ten-Year Plan: The Common Guild"
 desc_exemplarists_build_plan: "Every commune holds its share of masters and craftsmen, but their talents rarely travel beyond their own fields. By founding a Common Guild, each commune may call upon skilled hands from across the realm."
 exemplarists_reform_banking_plan: "Ten-Year Plan: Reform the Banks"
 desc_exemplarists_reform_banking_plan: "Let us cast out the moneylenders from the temple of the commune. Usury shall no longer devour the poor. Gold will serve the people, not rule them."
 exemplarists_reform_the_commune_plan: "Ten-Year Plan: Reform the Commune"
 desc_exemplarists_reform_the_commune_plan: "We must not grow content with the order of things, for complacency is the way of the boyar. A period reflection must begin. Let us weigh every statute anew, scrutinize each edict, and hear the petitions of common men. Only then may we prove ourselves a model for all the world."
 exemplarists_modernize_plan: "Ten-Year Plan: Modernize"
 desc_exemplarists_modernize_plan: "Workshops adopt new measures; scholars trade letters with distant minds. Old tools are set aside for modern ones, and the  commune learns to think ahead." #TODO - REVISE
 leaguists_integration_plan: "Ten-Year Plan: Bind the League"
 desc_leaguists_integration_plan: "Envoys travel with open ledgers and patient smiles. Small councils are folded into the great one, oaths renewed, and disputes  settled at long tables." #TODO - REVISE
 leaguists_expand_diplomatic_corps_plan: "Ten-Year Plan: The Diplomatic Corps"
 desc_leaguists_expand_diplomatic_corps_plan: "Clerks are trained into envoys, envoys into negotiators. New seals are cut, new codes learned, and correspondence  multiplies across the map."
 leaguists_improve_communal_image_plan: "Ten-Year Plan: Polish Our Image"
 desc_leaguists_improve_communal_image_plan: "Look, we are not savages looking to upend the order of the world. This is simply how the people of our land want to be governed."
 leaguists_expand_trade_plan: "Ten-Year Plan: Open the Lanes"
 desc_leaguists_expand_trade_plan: "Warehouses fill, caravans time their crossings, and brokers whisper along the piers. Routes that once drifted now run with  purpose." #TODO - REVISE
 leaguists_establish_spheres_of_influence_plan: "Ten-Year Plan: Spheres of Influence"
 desc_leaguists_establish_spheres_of_influence_plan: "We draw careful lines on the map. Lesser councils are courted, guarded, and—when needed—gently steered."
 abolitionists_spy_plan: "Ten-Year Plan: Eyes of the Commune"
 desc_abolitionists_spy_plan: "The slave masters need the serfs to toil in their fields. Without them, they would have to work just like the rest of us. This is the great weakness of the slave master brothers. We must exploit this at every opportunity. We shall fund underground networks who will supply and arm the serfs. Then, when the time is right, we strike with them!"
 abolitionists_establish_standards_plan: "Ten-Year Plan: Professionalize the Masses"
 desc_abolitionists_establish_standards_plan: "We cannot expect to take on the grand armies of empires with peasant levies forever. We must establish a professional communal army with strict standards. We shall bring in advisors and reform our military."
 abolitionists_professionalize_peasants_plan: "Ten-Year Plan: Military Standards Act"
 desc_abolitionists_professionalize_peasants_plan: "In order to purge the world of those who seek to enslave us we must establish a strict military code. Every man in the commune must bear arms and familiarize themselves with the basics of our standard."
 abolitionists_rally_the_peasants_plan: "Ten-Year Plan: Rally the Commune"
 desc_abolitionists_rally_the_peasants_plan: "A great war is coming, brothers—a war of great liberation. Where will you be on the day the first slave master is cut down? Will you tell your children — your grandchildren — that you stood beside your brothers as you marched to free the serfs?"
 abolitionists_global_liberation_plan: "Ten-Year Plan: Global Liberation"
 desc_abolitionists_global_liberation_plan: "Just as the Lord smote the Pharaohs, so too shall every crown be cast down! From sea to sea, we shall break the yoke of kings and raise the banner of the free!"